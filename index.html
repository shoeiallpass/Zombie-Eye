<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>七天 — 垂直切片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0E10;--panel:#161B1E;--line:#2E383D;--text:#D8DEE1;--dim:#7C8B92;
  --amber:#E8A33D;--steel:#6E8B9A;--alert:#C4453A;--go:#7FA88A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden;
  font-family:"IBM Plex Sans TC",system-ui,"Noto Sans TC",sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.mono{font-family:"IBM Plex Mono",monospace}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .6s}
#hud.on{opacity:1}

#vitals{position:absolute;top:14px;left:14px;width:130px}
.bar{height:4px;background:rgba(46,56,61,.85);margin-bottom:5px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .18s}
#hp i{background:var(--alert)} #st i{background:var(--steel)}
#eye{font-size:10px;letter-spacing:.12em;color:var(--amber);margin-top:7px;display:none}
#bright{position:absolute;top:70px;left:14px;pointer-events:auto;font-size:10px;letter-spacing:.12em;
  color:var(--dim);border:1px solid var(--line);background:rgba(22,27,30,.55);padding:5px 9px}
#bright:active{border-color:var(--amber);color:var(--amber)}
#obj{position:absolute;top:14px;right:14px;text-align:right;font-size:10px;letter-spacing:.14em;color:var(--dim)}
#obj b{color:var(--text);font-weight:600}
#objmsg{margin-top:6px;color:var(--go);font-size:10px;opacity:0;transition:opacity .4s}
#hurt{position:absolute;inset:0;opacity:0;transition:opacity .25s;
  background:radial-gradient(circle at 50% 50%,transparent 35%,rgba(196,69,58,.55))}
#toast{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:13px;
  letter-spacing:.14em;color:var(--go);opacity:0;transition:opacity .4s}
#hint{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:12px;
  letter-spacing:.1em;color:var(--dim);transition:opacity .8s}

.pad{position:absolute;pointer-events:auto;border:1px solid var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.1em;
  color:var(--dim);background:rgba(22,27,30,.5)}
.pad:active,.pad.on{border-color:var(--amber);color:var(--amber)}
#atk{right:20px;bottom:26px;width:94px;height:94px;font-size:13px;flex-direction:column;gap:3px}
#atk.rec{border-color:rgba(46,56,61,.9);color:#4b565b}
#atk .sw{font-size:9px;letter-spacing:.14em;color:var(--dim);opacity:.65}
#chg{position:absolute;right:20px;bottom:126px;width:94px;height:3px;background:rgba(46,56,61,.9);display:none}
#chg.on{display:block}
#chg i{display:block;height:100%;width:0;background:var(--amber)}
/* 操作說明（開場卡片內） */
#ctrls{margin:-8px 0 22px;border-top:1px solid rgba(46,56,61,.6);padding-top:16px}
#ctrls h3{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.26em;
  color:var(--amber);font-weight:400;margin-bottom:11px}
.crow{display:flex;align-items:baseline;gap:11px;font-size:11.5px;line-height:1.85;color:var(--dim)}
.crow k{flex:0 0 92px;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;
  color:var(--text);border:1px solid var(--line);padding:2px 0;text-align:center;font-style:normal}
#dev{display:none;margin:-10px 0 22px;border:1px solid var(--line);padding:12px 13px}
#dev h3{font-size:9.5px;letter-spacing:.26em;color:var(--steel);font-weight:400;margin-bottom:10px}
.devbtns{display:flex;flex-wrap:wrap;gap:6px}
.devb{flex:1 0 42%;padding:10px 6px;border:1px solid var(--line);color:var(--dim);
  text-align:center;font-size:10.5px;letter-spacing:.08em;cursor:pointer}
.devb:active{border-color:var(--amber);color:var(--amber)}
#ctrlswap{margin-top:13px;font-size:10px;letter-spacing:.12em;color:var(--steel);
  border-bottom:1px solid rgba(110,139,154,.4);display:inline-block;padding-bottom:2px;cursor:pointer}
#blk{right:128px;bottom:34px;width:62px;height:62px}
#spr{right:26px;bottom:134px;width:62px;height:62px}
/* 手電筒鍵。只有身上真的有手電筒才會出現（跟「檢視」同一種寫法）。
   放在衝刺的正上方：這是切換鍵不是連打鍵，稍微遠一點反而不會誤觸 */
#tor{right:26px;bottom:206px;width:56px;height:56px;font-size:11px;display:none}
#tor.show{display:flex}
#spr.burning{border-color:var(--alert);color:var(--alert)}
#stick{position:absolute;left:0;bottom:0;width:45%;height:52%;pointer-events:auto}
#knob{position:absolute;width:104px;height:104px;border:1px solid var(--line);border-radius:50%;opacity:0;transition:opacity .15s}
#knob i{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(216,222,225,.22)}
#knob.on{opacity:1}

/* cards */
/* 內容短的時候要置中，長的時候要能捲到最上面。
   `justify-content:center` 只做得到前者——內容一超過畫面，
   上緣會被切掉而且捲不回去（開場多了衛教圖卡之後一定會超過）。
   改用兩個 margin:auto 的假元素把空白吃掉：有空白時等分＝置中，
   沒空白時 margin 自動變 0＝從頭開始，兩種情況都對 */
#card{position:fixed;inset:0;background:#070809;z-index:9;display:none;
  flex-direction:column;padding:30px 24px;overflow-y:auto}
#card.show{display:flex}
#card::before,#card::after{content:'';margin:auto 0;flex:0 0 0}
#card .day{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.34em;color:var(--dim);margin-bottom:10px}
#card h2{font-size:19px;letter-spacing:.12em;margin-bottom:12px}
#card .lede{font-size:12.5px;color:var(--dim);line-height:2;margin-bottom:24px}
.stat{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid rgba(46,56,61,.6);font-size:12px}
.stat span:last-child{margin-left:auto;font-family:"IBM Plex Mono",monospace;color:var(--amber)}
.stat.big span:last-child{font-size:16px;color:var(--alert)}
#verdict{margin-top:18px;font-size:12px;line-height:1.95;border-left:2px solid var(--amber);padding-left:13px}
#callback{margin-top:20px;padding-top:16px;border-top:1px solid rgba(46,56,61,.6);
  font-size:12px;line-height:2;color:var(--dim);white-space:pre-line}
#cardbtn{margin-top:26px;background:transparent;border:1px solid var(--amber);color:var(--amber);
  padding:14px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;cursor:pointer}
#stats{display:none}
/* 片尾衛教字卡。這是整個作品存在的理由，所以它有自己的區塊，不跟結算數字混在一起 */
#edu{display:none;margin-top:22px;padding-top:18px;border-top:1px solid rgba(46,56,61,.6);
  font-size:12px;line-height:2.05;color:var(--dim);white-space:pre-line}
#edu.show{display:block}
#stats.show{display:block}
/* 開場的衛教圖卡。
   最上面三行是**躲不掉的**——玩青光眼那一局的人，如果那三行也要點才看得到，
   沒點的那個人正好就是我們沒救到的人。圖卡才是「想看再看」的那一層。
   展開用的是「原地長出來」而不是翻轉或彈出面板：
   翻轉要求正反面一樣大，背面裝不下「什麼時候該當天就醫」那幾行；
   彈出面板自己要能捲，捲動區包在卡片的捲動區裡，手機上很難點 */
#eduk{display:none;margin-top:22px;padding-top:18px;border-top:1px solid rgba(46,56,61,.6)}
#eduk.show{display:block}
#eduk h3{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.26em;
  color:var(--amber);font-weight:400;margin-bottom:11px}
#edukintro{font-size:12px;line-height:2;color:var(--dim);white-space:pre-line;margin-bottom:14px}
#eduktiles{display:flex;flex-wrap:wrap;gap:6px}
.ek{flex:1 0 42%;border:1px solid var(--line);padding:10px 9px;cursor:pointer}
.ek:active{border-color:var(--amber)}
.ek.open{flex-basis:100%;border-color:var(--amber)}   /* 展開時佔滿一整列 */
.ek b{display:block;font-size:11.5px;letter-spacing:.06em;color:var(--text);font-weight:500}
.ek em{display:block;font-style:normal;font-family:"IBM Plex Mono",monospace;
  font-size:9px;letter-spacing:.1em;color:var(--steel);margin-top:5px;line-height:1.5}
.ek.open em{color:var(--amber)}
.ekb{display:none;font-size:12px;line-height:2;color:var(--dim);white-space:pre-line;
  margin-top:11px;padding-top:11px;border-top:1px solid rgba(46,56,61,.6)}
.ek.open .ekb{display:block}
#diag{position:fixed;left:8px;right:8px;top:8px;z-index:20;background:rgba(8,10,11,.94);
  border:1px solid var(--line);padding:10px 12px;font-size:10px;line-height:1.65;color:var(--dim);
  max-height:46vh;overflow-y:auto}
#diaghead{color:var(--amber);letter-spacing:.18em;margin-bottom:6px;display:flex}
#diagx{margin-left:auto;color:var(--dim);cursor:pointer;pointer-events:auto}
#diag.hide{display:none}
#diaglog b{color:var(--text);font-weight:400}
#diaglog .ok{color:var(--go)} #diaglog .bad{color:var(--alert)}
#act{right:118px;bottom:124px;width:78px;height:78px;font-size:11px;display:none}
#act.show{display:flex}
#insp{position:absolute;left:0;right:0;bottom:24px;display:none;justify-content:center;gap:9px}
#insp.on{display:flex}
.ibtn{pointer-events:auto;padding:13px 15px;border:1px solid var(--line);background:rgba(22,27,30,.62);
  color:var(--dim);font-size:11px;letter-spacing:.12em}
.ibtn:active,.ibtn.on{border-color:var(--amber);color:var(--amber)}
#hud.insp .pad,#hud.insp #stick,#hud.insp #bagbtn{display:none}
#bagbtn{position:absolute;top:110px;left:14px;pointer-events:auto;font-size:10px;letter-spacing:.12em;
  color:var(--dim);border:1px solid var(--line);background:rgba(22,27,30,.55);padding:5px 9px}
#bagbtn:active{border-color:var(--amber);color:var(--amber)}
#bag{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,90vw);
  max-height:74vh;z-index:25;display:none;flex-direction:column;
  background:rgba(10,13,14,.95);border:1px solid var(--line)}
#bag.show{display:flex}
#baghead{display:flex;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);
  color:var(--amber);font-size:10px;letter-spacing:.18em}
#baghead b{margin-left:auto;font-weight:400;color:var(--dim);border:1px solid var(--line);padding:3px 8px}
#baglist{overflow-y:auto;padding:6px 13px 14px;-webkit-overflow-scrolling:touch}
.bagrow{padding:10px 0;border-bottom:1px solid rgba(46,56,61,.55)}
.bagrow .nm{font-size:12px;color:var(--text)}
.bagrow .sub{font-size:9.5px;color:var(--dim);letter-spacing:.1em;margin-top:2px}
.bagrow .ops{display:flex;gap:7px;margin-top:7px}
.bagrow .op{padding:6px 12px;border:1px solid var(--line);color:var(--dim);font-size:10.5px}
.bagrow .op:active{border-color:var(--amber);color:var(--amber)}
#bagempty{color:var(--dim);font-size:11px;padding:18px 0;text-align:center}
#bagmsg{padding:9px 13px;border-bottom:1px solid rgba(46,56,61,.55);color:var(--amber);
  font-size:11px;line-height:1.6;display:none}
#bagmsg.on{display:block}
#hold{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);width:140px;height:3px;
  background:rgba(46,56,61,.9);display:none}
#hold.on{display:block}
#hold i{display:block;height:100%;width:0;background:var(--amber)}
#caption{position:fixed;left:0;right:0;bottom:16%;text-align:center;z-index:8;
  font-size:13px;letter-spacing:.16em;opacity:0;transition:opacity .8s;pointer-events:none}

/* 調參面板（網址加 #debug 才會出現） */
#dbg{position:fixed;right:0;top:0;bottom:0;width:min(300px,86vw);z-index:30;display:none;
  flex-direction:column;background:rgba(8,10,11,.93);border-left:1px solid var(--line);
  font-size:11px;color:var(--text);touch-action:pan-y}
#dbg.show{display:flex}
#dbghead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);
  color:var(--amber);letter-spacing:.18em;font-size:10px}
#dbghead b{margin-left:auto;font-weight:400;color:var(--dim);cursor:pointer;padding:2px 6px;border:1px solid var(--line)}
#dbgbody{flex:1;overflow-y:auto;padding:8px 12px 26px;-webkit-overflow-scrolling:touch}
.dsec{color:var(--dim);letter-spacing:.16em;font-size:9px;margin:14px 0 6px;
  border-bottom:1px solid rgba(46,56,61,.6);padding-bottom:4px}
.drow{margin-bottom:9px}
.drow label{display:flex;font-size:10.5px;color:var(--dim);margin-bottom:3px}
.drow label span{margin-left:auto;color:var(--amber);font-family:"IBM Plex Mono",monospace}
.drow input[type=range]{width:100%;height:22px;accent-color:#E8A33D;background:transparent}
.dbtns{display:flex;flex-wrap:wrap;gap:5px}
.dbtn{flex:1 0 auto;padding:7px 8px;border:1px solid var(--line);color:var(--dim);
  text-align:center;font-size:10px;letter-spacing:.08em;cursor:pointer}
.dbtn.on{border-color:var(--amber);color:var(--amber)}
#dbgout{width:100%;height:150px;margin-top:8px;background:#0b0e10;color:var(--text);
  border:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:9.5px;padding:6px;display:none}
#dbgtab{position:fixed;right:0;top:44%;z-index:29;display:none;padding:10px 6px;
  background:rgba(8,10,11,.9);border:1px solid var(--line);border-right:0;
  color:var(--amber);font-size:10px;letter-spacing:.2em;writing-mode:vertical-rl;cursor:pointer}
#dbgtab.show{display:block}
</style>
</head>
<body>

<div id="hud">
  <div id="vitals">
    <div class="bar" id="hp"><i></i></div>
    <div class="bar" id="st"><i></i></div>
    <div id="eye" class="mono"><span id="eyelabel">右眼</span> <b id="eyev">8</b>%</div>
  </div>
  <div id="bright" class="mono">亮度 3</div>
  <div id="bagbtn" class="mono">背包 0</div>
  <div id="obj" class="mono"><span id="objlabel"></span> <b id="got">0</b>/<span id="tot">3</span><div id="objmsg">前往出口</div></div>
  <div id="hurt"></div>
  <div id="toast" class="mono"></div>
  <div id="hint"></div>
  <div id="stick"><div id="knob"><i></i></div></div>
  <div class="pad mono" id="atk"><span id="wname">鐵撬</span><span class="sw">▲▼ 換</span></div>
  <div id="chg"><i></i></div>
  <div class="pad mono" id="blk">格擋</div>
  <div class="pad mono" id="tor">手電</div>
  <div class="pad mono" id="spr">衝刺</div>
  <div class="pad mono" id="act">檢視</div>
  <div id="hold"><i></i></div>
  <div id="insp" class="mono">
    <div class="ibtn" id="izoom">湊近</div>
    <div class="ibtn" id="iflip">翻面</div>
    <div class="ibtn" id="itake">帶走</div>
    <div class="ibtn" id="iclose">放回</div>
  </div>
</div>

<div id="caption" class="mono"></div>
<div id="bag" class="mono">
  <div id="baghead">背包 <b id="bagclose">關閉</b></div>
  <div id="bagmsg"></div>
  <div id="baglist"></div>
</div>
<div id="dbgtab" class="mono">調參</div>
<div id="dbg" class="mono">
  <div id="dbghead">調參面板 <b id="dbgclose">收起</b></div>
  <div id="dbgbody"></div>
</div>
<div id="diag" class="mono">
  <div id="diaghead">載入診斷 <span id="diagx">關閉</span></div>
  <div id="diaglog"></div>
</div>

<div id="card" class="show">
  <div class="day" id="cardday">DAY 1</div>
  <h2 id="cardtitle">你的公寓</h2>
  <div class="lede" id="cardlede">外面已經亂了三個小時。你得拿到鑰匙和手電筒，然後離開這裡。</div>
  <div id="ctrls"><h3 id="ctrlshead">操作</h3><div id="ctrlsbody"></div><div id="ctrlswap"></div></div>
  <div id="dev" class="mono">
    <h3>測試入口</h3>
    <div class="devbtns">
      <div class="devb" id="devd1">Day 1 公寓</div>
      <div class="devb" id="devd2">Day 2 街道</div>
      <div class="devb" id="devd3">Day 3 藥局</div>
      <div class="devb" id="devd4">Day 4 停車場</div>
      <div class="devb" id="devd5">Day 5 隧道</div>
      <div class="devb" id="devd6">Day 6 醫院外圍</div>
      <div class="devb" id="devdbg">調參面板</div>
      <div class="devb" id="deve1">結局 · 來得及</div>
      <div class="devb" id="deve0">結局 · 來不及</div>
    </div>
  </div>
  <div id="stats">
    <div class="stat"><span>出發時的右眼</span><span id="s0"></span></div>
    <div class="stat"><span>自然惡化</span><span id="s1"></span></div>
    <div class="stat"><span id="s2lab">衝刺代價</span><span id="s2"></span></div>
    <div class="stat"><span>頭部受擊代價</span><span id="s3"></span></div>
    <div class="stat" id="s5row"><span id="s5lab">開槍</span><span id="s5"></span></div>
    <div class="stat big"><span>結束時的右眼</span><span id="s4"></span></div>
    <div id="verdict"></div>
    <div id="callback"></div>
  </div>
  <div id="edu"></div>
  <div id="eduk">
    <h3 id="edukhead">開始之前</h3>
    <div id="edukintro"></div>
    <div id="eduktiles"></div>
  </div>
  <button id="cardbtn" class="mono">開始</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- 建置時換掉：發佈模式塞進 GLTFLoader/SkeletonUtils 整段程式碼，開發模式換成外部網址 -->
<script src="GLTFLoader.js"></script>

<script>
// ================================================================ core
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.insertBefore(renderer.domElement, document.getElementById('hud'));
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(74,1,.1,140);
scene.add(camera);
var level=new THREE.Group(); scene.add(level);

// ================================================================ 亮度
// 五級。每一級同時調三件事，才不會只是「把黑的地方變灰」：
//   light 場景燈光倍率 / gain 畫面整體增亮 / fog 霧的起點與終點往外推
var BRIGHT=[
  {n:'1', light:1.00, gain:1.00, fog:1.00},   // 最暗，恐怖氛圍
  {n:'2', light:1.28, gain:1.10, fog:1.20},   // 停電、隧道這類場景用
  {n:'3', light:1.60, gain:1.22, fog:1.45},   // 預設
  {n:'4', light:2.00, gain:1.38, fog:1.75},
  {n:'5', light:2.50, gain:1.58, fog:2.10}
];

// 每個場景自己的預設亮度（1~5）。之後加新關卡就在這裡加一行。
// 例：停車場停電版寫 4:2，隧道寫 5:1
// **Day 2 不是靠亮度級數變亮的，是靠場景自己的光。**
// 第一版寫 5 級，實測整片過曝——因為那等於把「已經很強的白天光」再乘 2.5 倍、
// 曝光再乘 1.58 倍，兩邊重複算了一次。作者實測 2~3 級剛好，這裡取 3。
// 街道仍然比公寓亮得多（環境光 0.92 vs 0.72、另外有平行光與天空光），
// 那個差別本來就該由場景的光負責，不是由亮度級數負責。
// Day 5 是 2 不是 1。**「幾乎全黑」不等於「看不出要往哪走」**——
// 第一版寫 1 級、霧從 2 公尺就開始，結果玩家連腳下的水都看不到，
// 那不是失明的體驗，是畫面壞掉的體驗。
// 2026-09 實測：換上程序化材質之後 Day 2 偏亮，作者要求降一階 → 2。
// 上面那段註解裡「作者實測 2~3 級剛好」本來就涵蓋這個值。
var SCENE_BRIGHT={ 1:3, 2:2, 3:3, 4:3, 5:2, 6:3 };

// 三個數字的關係：
//   bScene  這一關設計上該有的亮度（來自上面的表）
//   userB   玩家按按鈕調出來的偏移量，跨關卡保留 —— 所以關卡之間的明暗差距不會被抹平
//   bCur    實際生效的值，是浮點數，切換時會平順過渡（停電才會有淡出的感覺）
var bScene=2, userB=0, bTarget=2, bCur=2;
function clampB(x){ return Math.max(0,Math.min(BRIGHT.length-1,x)); }
// 在兩級之間內插，讓過渡不是跳一格一格的
function bAt(x){
  x=clampB(x);
  var i=Math.floor(x), j=Math.min(BRIGHT.length-1,i+1), f=x-i, A=BRIGHT[i], B=BRIGHT[j];
  return {light:A.light+(B.light-A.light)*f, gain:A.gain+(B.gain-A.gain)*f, fog:A.fog+(B.fog-A.fog)*f};
}
function LM(){return bAt(bCur).light;}
// 設定這一關的亮度。fade=true 會花約一秒過渡（停電、發電機重啟、走進暗房都可以用）
function setSceneBright(lvl,fade){

  if(!fade) bCur=bTarget;

}
// 所有場景燈光都登記在這裡，記住「原本該有的強度」，切換亮度時整批重算
var lightReg=[];

  // 場景裡沒有任何「天空」物件，霧也不會畫背景，所以清除色（黑）就直接露出來。
  // Day 2 是白天的街道，霧色是 0xb9c3c6 的亮灰，卻配一片純黑的天，非常怪。
  // 讓背景等於霧色還有一個好處：遠處的東西淡入霧裡之後會**無縫接到天空**，
  // 不會在地平線留下一條硬邊

var gainBase=1;
function applyBright(){
  var b=bAt(bCur);
  for(var i=0;i<lightReg.length;i++) lightReg[i].l.intensity=lightReg[i].base*b.light;
  torch.intensity=torchBase*b.light; torchSpill.intensity=torchBase*TUNE.torchSpill*b.light;

  var el=document.getElementById('bright');
  if(el) el.textContent='亮度 '+(Math.round(bTarget)+1)+(userB?(userB>0?' +':' ')+userB:'');
}

// ================================================================ 程序化材質（2026-09）
// 為什麼不用 AI 生圖或照片貼圖：
//   1. 生出來的圖**自帶光影**。這款遊戲整個建立在「手電筒 vs 黑暗」上，
//      一面自帶高光的牆在漆黑的隧道裡看起來就是被打過光的，直接跟核心機制打架
//   2. 不會無縫接合，一面牆重複二十次就看得到接縫
//   3. 只有顏色，沒有凹凸，手電筒掃過去表面是平的
//   4. 檔案會變大，而第 8 節那條「回饋迴圈會垮」的線就在前面
// 程序化的做法沒有這四個問題，而且它是程式不是資產，**檔案大小是零**。
//
// **關鍵原則：每張貼圖畫完之後，把平均顏色校正回原本那個純色**（`matchMean`）。
// 這樣換上貼圖不會順便改掉這一關的明暗——比較的時候才不會混進亮度的變因。
// （同一個道理見第 6 節「白送的常亮燈」與「停車場每盞燈有機率是壞的」。）

var PTEX={};                                    // 貼圖快取，重進同一關不用重算
function pcv(s){var c=document.createElement('canvas');c.width=c.height=s;return c;}
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),
  parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}

// 畫東西時把超出邊界的部分從另一邊補回來 → 貼圖左右上下接得起來
function wrapRect(x,px,py,w,h,S){
  x.fillRect(px,py,w,h);
  if(px+w>S) x.fillRect(px-S,py,w,h);
  if(py+h>S) x.fillRect(px,py-S,w,h);
  if(px+w>S&&py+h>S) x.fillRect(px-S,py-S,w,h);
}
function wrapDraw(x,S,fn){                      // 大塊的斑痕、線條用這個，九宮格各畫一次
  for(var a=-1;a<=1;a++)for(var b=-1;b<=1;b++){
    x.save();x.translate(a*S,b*S);fn(x);x.restore();
  }
}

// 把整張圖的平均顏色拉回 target。這是「換貼圖不改亮度」唯一可靠的做法：
// 憑感覺畫「差不多一樣暗」一定會偏，而偏掉之後你會以為是別的東西壞了
function matchMean(cv,target){
  var s=cv.width,x=cv.getContext('2d'),im=x.getImageData(0,0,s,s),d=im.data,n=s*s;
  var sr=0,sg=0,sb=0,i;
  for(i=0;i<d.length;i+=4){sr+=d[i];sg+=d[i+1];sb+=d[i+2];}
  var t=hex2rgb(target);
  var gr=t[0]/Math.max(1,sr/n),gg=t[1]/Math.max(1,sg/n),gb=t[2]/Math.max(1,sb/n);
  for(i=0;i<d.length;i+=4){
    d[i]=Math.min(255,d[i]*gr);d[i+1]=Math.min(255,d[i+1]*gg);d[i+2]=Math.min(255,d[i+2]*gb);
  }
  x.putImageData(im,0,0);return cv;
}

// 從高度圖算法線圖。這是這一整套裡**畫面差最多的一步**：
// 沒有法線圖，手電筒掃過牆面只是一團均勻的亮斑；有了它，
// 光會沿著模板痕、裂縫、骨材的邊緣走，表面才有「摸得到」的感覺。
// 取樣用 %S 繞回去，所以法線圖跟顏色圖一樣是無縫的。
function normalMap(cv,strength){
  var s=cv.width,src=cv.getContext('2d').getImageData(0,0,s,s).data;
  var out=pcv(s),ox=out.getContext('2d'),im=ox.createImageData(s,s),d=im.data;
  function H(x,y){x=(x+s)%s;y=(y+s)%s;var i=(y*s+x)*4;
    return (src[i]*0.299+src[i+1]*0.587+src[i+2]*0.114)/255;}
  for(var y=0;y<s;y++)for(var x=0;x<s;x++){
    var dx=(H(x-1,y)-H(x+1,y))*strength, dy=(H(x,y-1)-H(x,y+1))*strength;
    var L=Math.sqrt(dx*dx+dy*dy+1),i=(y*s+x)*4;
    d[i]=(dx/L*.5+.5)*255; d[i+1]=(dy/L*.5+.5)*255; d[i+2]=(1/L*.5+.5)*255; d[i+3]=255;
  }
  ox.putImageData(im,0,0);return out;
}
function mkTex(cv,rx,ry){
  var t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry);
  t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy?
    renderer.capabilities.getMaxAnisotropy():1);
  return t;
}

// ---- 各種表面 ----
// 每個 builder 回傳一張 256 的 canvas。256 對這款遊戲夠用：畫面上還壓著一層後製，
// 512 只是多花四倍的時間算法線圖，手機上看不出差別。

function cvConcrete(base,opt){                  // 清水混凝土：骨材、色斑、裂縫、水漬
  opt=opt||{};var S=256,c=pcv(S),x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,S,S);
  wrapDraw(x,S,function(g){                     // 大片的深淺色斑（澆置的批次差）
    for(var i=0;i<9;i++){
      var px=Math.random()*S,py=Math.random()*S,r=26+Math.random()*46;
      var gd=g.createRadialGradient(px,py,0,px,py,r);
      gd.addColorStop(0,'rgba('+(Math.random()<.5?'0,0,0':'255,255,255')+','+(.03+Math.random()*.05)+')');
      gd.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gd;g.beginPath();g.arc(px,py,r,0,6.284);g.fill();
    }
  });
  for(var i=0;i<2600;i++){                      // 骨材顆粒
    var v=Math.random()<.5?0:255;
    x.fillStyle='rgba('+v+','+v+','+v+','+(.03+Math.random()*.10)+')';
    wrapRect(x,Math.random()*S,Math.random()*S,1+Math.random()*2.2,1+Math.random()*2.2,S);
  }
  if(opt.form) wrapDraw(x,S,function(g){        // 模板痕（橫向的木板接縫）＋ 繫件孔
    for(var k=0;k<4;k++){
      var yy=k*S/4+2;
      g.fillStyle='rgba(0,0,0,.20)';g.fillRect(-S,yy,S*3,1.6);
      g.fillStyle='rgba(255,255,255,.07)';g.fillRect(-S,yy+1.6,S*3,1.4);
      for(var t=0;t<3;t++){
        var tx=(t+.5)*S/3+(Math.random()-.5)*18;
        g.fillStyle='rgba(0,0,0,.26)';g.beginPath();g.arc(tx,yy+S/8,2.6,0,6.284);g.fill();
      }
    }
  });
  wrapDraw(x,S,function(g){                     // 裂縫
    for(var k=0;k<7;k++){
      g.strokeStyle='rgba(0,0,0,'+(.10+Math.random()*.16)+')';g.lineWidth=.5+Math.random()*1.1;
      var px=Math.random()*S,py=Math.random()*S;g.beginPath();g.moveTo(px,py);
      for(var st=0;st<5;st++){px+=(Math.random()-.5)*44;py+=(Math.random()-.5)*44;g.lineTo(px,py);}
      g.stroke();
    }
  });
  if(opt.streak) wrapDraw(x,S,function(g){      // 由上往下的水漬（牆面才有，地板沒有）
    for(var k=0;k<10;k++){
      var px=Math.random()*S,w=3+Math.random()*13;
      var gd=g.createLinearGradient(0,0,0,S);
      gd.addColorStop(0,'rgba(0,0,0,0)');gd.addColorStop(.35,'rgba(0,0,0,'+(.05+Math.random()*.09)+')');
      gd.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gd;g.fillRect(px,0,w,S);
    }
  });
  return matchMean(c,base);
}

function cvOil(){                               // 地上的油漬遮罩。當高光遮罩用：
  var S=256,c=pcv(S),x=c.getContext('2d');      // 只有這些地方會反光，其他地方是霧面
  x.fillStyle='#000';x.fillRect(0,0,S,S);
  wrapDraw(x,S,function(g){
    for(var i=0;i<7;i++){
      var px=Math.random()*S,py=Math.random()*S,r=10+Math.random()*30;
      var gd=g.createRadialGradient(px,py,0,px,py,r);
      gd.addColorStop(0,'rgba(255,255,255,'+(.45+Math.random()*.45)+')');
      gd.addColorStop(.6,'rgba(255,255,255,.18)');gd.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=gd;g.beginPath();g.arc(px,py,r,0,6.284);g.fill();
    }
  });
  return c;
}

function cvMetal(base){                         // 上漆的鐵板：板件接縫、鏽斑、刮痕
  var S=256,c=pcv(S),x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,S,S);
  wrapDraw(x,S,function(g){
    g.fillStyle='rgba(0,0,0,.24)';g.fillRect(-S,S/2-1,S*3,2);g.fillRect(S/2-1,-S,2,S*3);
    g.fillStyle='rgba(255,255,255,.06)';g.fillRect(-S,S/2+1,S*3,1.4);
    for(var i=0;i<16;i++){                      // 鏽：從邊緣往內咬
      var px=Math.random()*S,py=Math.random()*S,r=4+Math.random()*15;
      var gd=g.createRadialGradient(px,py,0,px,py,r);
      gd.addColorStop(0,'rgba(122,72,38,'+(.28+Math.random()*.34)+')');
      gd.addColorStop(1,'rgba(122,72,38,0)');
      g.fillStyle=gd;g.beginPath();g.arc(px,py,r,0,6.284);g.fill();
    }
    for(var k=0;k<22;k++){                       // 刮痕，露出底下的金屬
      g.strokeStyle='rgba(198,196,188,'+(.10+Math.random()*.16)+')';g.lineWidth=.5+Math.random()*.9;
      var sx=Math.random()*S,sy=Math.random()*S;g.beginPath();g.moveTo(sx,sy);
      g.lineTo(sx+(Math.random()-.5)*40,sy+(Math.random()-.5)*40);g.stroke();
    }
  });
  return matchMean(c,base);

function cvWood(base){                          // 棧板：木紋、節疤、板縫

// 停車格的漆線。**不做成重複的格子**——真正的停車場只有側邊有格線，
// 中間的車道是空的。所以 u 方向（橫跨 8 公尺的走道）不重複，只有 v 方向（沿著長邊）重複。
// 停車格的漆線。**改成平行式停車**（2026-09）。
// 原本畫的是垂直式，但 Day 4 只有 8 公尺寬、柱子在 ±2.5，
// 而垂直式停車格要 5 公尺深——**塞不下**，所以那些線在幾何上就是錯的，
// 畫出來會沒入兩側牆面，看起來像牆裡有停車位（作者實測指出的）。
// 平行式：車貼牆縱向停（車身外緣約 x=∓3.1），
// 所以邊線畫在走道那一側 x=±1.3，短線從邊線拉到牆邊。
// u 方向（橫跨 8 公尺走道）不重複，只有 v 方向沿著長邊重複，每 5 公尺一格
function cvBay(){
  var S=256,c=pcv(S),x=c.getContext('2d');
  x.clearRect(0,0,S,S);
  function paint(px,py,w,h){
    x.fillStyle='rgba(214,206,176,.80)';x.fillRect(px,py,w,h);
    for(var i=0;i<Math.max(8,w*h/26);i++){      // 磨掉的地方：漆是舊的，不是新畫的
      x.clearRect(px+Math.random()*w,py+Math.random()*h,1+Math.random()*4,1+Math.random()*4);
    }
  }
  // x = −1.3 → u 0.3375 → 86px；x = +1.3 → 170px（走道寬 8 公尺對應 256px）
  paint(84,0,4,S); paint(168,0,4,S);            // 兩條沿走道的邊線
  paint(0,124,86,4); paint(172,124,84,4);       // 車格分隔線：從邊線拉到牆邊
  return c;
}

// 平面版的 UV 縮放，跟 uvBox 同一件事：貼圖一律 repeat(1,1)，
// 由每個網格自己依照「這面牆實際有幾公尺」把 UV 撐開。
// 這樣 98 公尺長的側牆和 8 公尺寬的端牆可以共用一張貼圖而紋理大小一致——
// 不然要嘛拉歪、要嘛每種尺寸複製一份材質
function uvPlane(g,w,h,per){
  var uv=g.attributes.uv;
  for(var i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*w*per, uv.getY(i)*h*per);
  uv.needsUpdate=true;
}
// 圓柱版的 UV 縮放。u 繞圓周一圈、v 沿著軸向，兩邊都要換算成實際公尺數，
// 否則一段 6 公尺的管和一段 12 公尺的管，紋理密度會差一倍
function uvCyl(g,R,len,theta,per){
  var uv=g.attributes.uv, arc=R*(theta||6.283185);
  for(var i=0;i<uv.count;i++) uv.setXY(i, uv.getX(i)*arc*per, uv.getY(i)*len*per);
  uv.needsUpdate=true;
}
function plane(w,h,mat,per){
  var g=new THREE.PlaneGeometry(w,h); if(per) uvPlane(g,w,h,per);
  return new THREE.Mesh(g,mat);
}
// 把一張灰階圖染成指定顏色。用途：同一個花紋要出四種顏色時（例如 Day 2 的沿街立面），
// **只畫一次、只算一張法線圖**，其餘只是染色。不這樣做的話光是立面就要四張法線圖
function cvTint(src,base){
  var s=src.width,c=pcv(s),x=c.getContext('2d');
  x.drawImage(src,0,0);
  x.globalCompositeOperation='multiply'; x.fillStyle=base; x.fillRect(0,0,s,s);
  x.globalCompositeOperation='source-over';
  return matchMean(c,base);
}

function pt(name,fn){ if(!PTEX[name]) PTEX[name]=fn(); return PTEX[name]; }
// 顏色圖 + 由它算出來的法線圖，包成一個材質。兩張都快取，重進同一關不用重算
// 所有程序化材質都登記進來，滑桿才調得到（材質是快取的，不能重建）
var PMATS=[];
function applyMatSpec(){
  for(var i=0;i<PMATS.length;i++){
    var m=PMATS[i];
    m.specular.setHex(m.userData.spec0).multiplyScalar(TUNE.matSpec);
  }
}
function pmat(name,fn,nstr,sh,per,spec,side){
  var cv=pt(name,fn);
  var m=new THREE.MeshPhongMaterial({map:mkTex(cv,1,1),
    shininess:sh, specular:spec||0x0a0a0a});
  if(side) m.side=side;
  if(!TUNE.noNormal){                    // 調參面板可以關掉，見「關掉法線貼圖」
    m.normalMap=mkTex(pt('n_'+name,function(){return normalMap(cv,nstr);}),1,1);
    m.normalScale=new THREE.Vector2(1,1);
  }
  m.userData={per:per,spec0:spec||0x0a0a0a};   // box() 會讀 per 去縮 UV
  m.specular.multiplyScalar(TUNE.matSpec); PMATS.push(m);
  return m;
}
// 同一個花紋、不同顏色。灰階原圖與法線圖只算一次，其餘只是染色——
// Day 2 沿街有四種立面顏色，用這個從「四張法線圖」降到「一張」
function pmatT(greyName,greyFn,hex,nstr,sh,per,spec){
  var g=pt(greyName,greyFn);
  var cv=pt(greyName+'_'+hex,function(){return cvTint(g,hex);});
  var m=new THREE.MeshPhongMaterial({map:mkTex(cv,1,1),shininess:sh,specular:spec||0x0a0a0a});
  if(!TUNE.noNormal){
    m.normalMap=mkTex(pt('n_'+greyName,function(){return normalMap(g,nstr);}),1,1);
    m.normalScale=new THREE.Vector2(1,1);
  }
  m.userData={per:per,spec0:spec||0x0a0a0a};
  m.specular.multiplyScalar(TUNE.matSpec); PMATS.push(m);
  return m;
}

function tex(base,speck,rx,ry){
  var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,256,256);
  for(var i=0;i<4200;i++){x.fillStyle='rgba('+speck+','+(Math.random()*.15)+')';
    x.fillRect(Math.random()*256,Math.random()*256,Math.random()*3+1,Math.random()*3+1);}
  for(var j=0;j<20;j++){x.strokeStyle='rgba(0,0,0,'+(Math.random()*.14)+')';x.lineWidth=Math.random()*6;
    x.beginPath();x.moveTo(Math.random()*256,0);
    x.bezierCurveTo(Math.random()*256,90,Math.random()*256,170,Math.random()*256,256);x.stroke();}
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t;
}
// phong=true 給「大面積 + 低面數 + 會被手電筒照到」的東西用。
// MeshLambertMaterial 是逐頂點打光，聚光燈落在頂點之間時整片是黑的
// （見第 6 節的坑）。Day 6 在戶外傍晚，但玩家仍然會開手電筒照牆。
// 六個面的 UV 依照那個面「實際有幾公尺」重新縮放，
// 這樣一根 0.7 公尺寬的柱子和一個 1.7 公尺寬的箱子可以**共用同一張貼圖**
// 而紋理不會一個被壓扁一個被拉長。BoxGeometry 的面序固定是 +X −X +Y −Y +Z −Z。
// 不這樣做的話，每種尺寸都要各自複製一份材質，貼圖數量會爆掉
function uvBox(g,w,h,d,per){
  var uv=g.attributes.uv, sp=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(var f=0;f<6;f++)for(var i=0;i<4;i++){
    var k=f*4+i; uv.setXY(k, uv.getX(k)*sp[f][0]*per, uv.getY(k)*sp[f][1]*per);
  }
  uv.needsUpdate=true;
}
// color 可以傳一個現成的 THREE.Material（程序化材質用），也可以照舊傳顏色數值
function box(w,h,d,color,x,y,z,ry,solid,phong){
  var g=new THREE.BoxGeometry(w,h,d), mt;
  if(color&&color.isMaterial){ mt=color; uvBox(g,w,h,d,(color.userData&&color.userData.per)||0.5); }
  else mt=phong?new THREE.MeshPhongMaterial({color:color,shininess:3})
               :new THREE.MeshLambertMaterial({color:color});
  var m=new THREE.Mesh(g,mt);
  m.position.set(x,y,z); if(ry)m.rotation.y=ry; level.add(m);
  if(solid) solids.push({x:x,z:z,hw:w/2+.35,hd:d/2+.35,ry:ry||0});
  return m;
}
var solids=[];
// 撿得到的東西不可以被埋進碰撞箱裡。
// 街道的雜物、停車場的柱子與護欄都是**隨機生成**的，所以「這一局剛好蓋住消防斧」
// 不是機率問題，是遲早會發生的事——**光靠微調座標修不掉，必須有檢查**。
// （這也是為什麼要做成通用的：Day 6 蓋起來之後同一件事會再發生一次。）
function clearOf(x,z,pad){
  for(var s=0;s<solids.length;s++){
    var o=solids[s];
    if(Math.abs(x-o.x)<o.hw+pad && Math.abs(z-o.z)<o.hd+pad) return false;
  }
  return true;
}
// 從原位往外一圈一圈找最近的空位。**要找最近的**——
// 東西該在哪裡是設計出來的，不是挪到哪都行。找不到就回傳 false（要記進診斷）
function freeSpot(x,z,pad){
  for(var r=0.55;r<=6.5;r+=0.35){
    for(var a=0;a<16;a++){
      var th=a*Math.PI/8 + r*1.7;                 // 每一圈起始角錯開，才不會都往同一邊擠
      var nx=x+Math.cos(th)*r, nz=z+Math.sin(th)*r;
      if(bounds && (nx<bounds[0]+0.8||nx>bounds[1]-0.8||nz<bounds[2]+0.8||nz>bounds[3]-0.8)) continue;
      if(clearOf(nx,nz,pad)) return {x:nx,z:nz};
    }
  }
  return false;
}
// 蓋完場景之後跑一次。solids 的 hw/hd 已經含了 0.35 的玩家半徑，
// 所以只要中心點在padding外面，玩家就站得到、東西也不會跟牆面穿在一起
function fixPickups(){
  var moved=0, stuck=0, list=[];
  items.forEach(function(o){ if(o.kind==='take'&&o.g&&o.g.position) list.push(o); });
  sups.forEach(function(o){ if(o.g&&o.g.position) list.push(o); });
  list.forEach(function(o){
    var p=o.g.position;
    if(clearOf(p.x,p.z,0.12)) return;
    var f=freeSpot(p.x,p.z,0.12);
    if(f){ p.x=f.x; p.z=f.z; moved++; }
    else stuck++;
  });
  return {n:list.length,moved:moved,stuck:stuck};
}
// 喪屍的移動 + **真正的碰撞**（2026-09）。
// 在這之前，喪屍對場景物件只有「閃避」——一個把想走的方向推開的力，
// 它會影響方向，但**永遠不會擋住牠**。所以只要推力不夠，牠就直接穿過去。
// 這在薄板（圍籬、門片）上最明顯，而 Day 6 的圍籬門正是薄板。
//
// 為什麼以前看不出來：門後的喪屍會不斷發動攻擊，而攻擊中 `z.busy>0` 會**暫停移動**，
// 等於攻擊動作意外地把牠釘在門邊。2026-09 補上「隔著東西不能揮」之後，
// 牠不再攻擊，於是一路走進門裡——**修掉一個穿透，反而讓另一個穿透浮出來**。
//
// 用跟玩家完全相同的兩條規則（見第 6 節第一條）：
//   分軸判定 —— X 和 Z 分開檢查，才能沿著牆滑過去而不是整個停住
//   已經卡住時放行 —— 生成點萬一落在碰撞箱裡，不放行就永遠動不了
function zMove(z,dx,dz){
  var px=z.g.position.x, pz=z.g.position.z, nx=px+dx, nz=pz+dz;
  // **已經在箱子裡的時候不能無條件放行。**
  // 玩家那一版寫的是「卡住就讓你自由移動」，因為玩家只會在出生點卡一次。
  // 喪屍不一樣：牠們會被同伴的互推擠進牆裡，一旦擠進去，
  // 「自由移動」等於允許牠直接從另一邊走出來——穿牆就是這樣發生的。
  // 所以卡住時只准**往最近的那個面推出去**，不准往別的方向走。
  if(blockedAtZ(px,pz)){ var o=nearestSolid(px,pz);
    if(o){ var ox=px-o.x, oz=pz-o.z, ex2=o.zsx||0, ez2=o.zsz||0;
      if(o.hw+ex2-Math.abs(ox) < o.hd+ez2-Math.abs(oz)) z.g.position.x=px+(ox<0?-1:1)*2.2*0.016;
      else                                              z.g.position.z=pz+(oz<0?-1:1)*2.2*0.016; }
    z.blockT=0; return; }
  var bx=blockedAtZ(nx,pz); if(bx) nx=px;
  var bz=blockedAtZ(nx,nz); if(bz) nz=pz;
  z.g.position.x=nx; z.g.position.z=nz;
  // 兩軸都被擋住＝正卡在凹角裡。累積超過 1.2 秒就沿著牆面切線走一段，
  // 不然牠會對著牆原地抖動，而「永遠走不過來」比「穿牆」更糟
  if(bx&&bz){ z.blockT=(z.blockT||0)+0.016;
    if(z.blockT>1.2){ z.slide=(z.slide||(Math.random()<0.5?-1:1)); z.slideT=1.0; z.blockT=0; }
  } else z.blockT=0;
}
// 找出把這個點包住的那個碰撞箱（用來決定往哪一面推出去）
function nearestSolid(x,z){
  var best=null, bd=1e9;
  for(var s=0;s<solids.length;s++){
    var o=solids[s];
    var ex=o.zsx||0, ez=o.zsz||0;
    if(Math.abs(x-o.x)<o.hw+ex && Math.abs(z-o.z)<o.hd+ez){
      var d=Math.min(o.hw+ex-Math.abs(x-o.x), o.hd+ez-Math.abs(z-o.z));
      if(d<bd){ bd=d; best=o; }
    }
  }
  return best;
}
// 標記剛剛蓋好的那個碰撞箱是「薄板」。
// zpad = 閃避距離（軟的，只影響方向）；zstop = **硬的**額外碰撞邊界，只對喪屍生效。
// 為什麼兩個都要：zpad 只是一股推力，六隻喪屍互相擠的時候會被壓過去，
// 牠還是會貼到硬邊界上——而硬邊界只有 0.35，比牠伸手的長度短，手就穿出去了。
// 所以薄板要**同時**加大軟推力和硬邊界。
function padLast(zpad,zstop){
  var o=solids[solids.length-1];
  if(o){ o.zpad=zpad;
    // **只往薄的那一面加厚。** 手是從板面穿出來的，不是從板的兩端穿出來的，
    // 所以只要把厚度那一軸推遠就夠了。
    // 兩軸一起加會把**開口也縮掉**：圍籬門的缺口只有 1.70 公尺，
    // 兩邊各加 0.62 之後剩 0.46 公尺，喪屍就擠不進來了——
    // 實測就是這樣（撬開後只有 2/6 追得過來），檢查 7 當場抓到
    if(o.hw<o.hd){ o.zsx=zstop; o.zsz=0; }      // 薄在 X（圍籬門、側向圍籬）
    else          { o.zsx=0; o.zsz=zstop; }      // 薄在 Z（沿街的圍籬）
  }
  return o;
}
// 喪屍專用的碰撞判定：薄板要多擋 zstop 那麼多，讓牠的手構不到另一邊。
// 玩家用的 blockedAt() 不受影響——玩家可以貼著圍籬站，那沒有問題
function blockedAtZ(x,z){
  for(var s=0;s<solids.length;s++){
    var o=solids[s];
    if(Math.abs(x-o.x)<o.hw+(o.zsx||0) && Math.abs(z-o.z)<o.hd+(o.zsz||0)) return true;
  }
  return false;
}
function blockedAt(x,z){
  for(var s=0;s<solids.length;s++){
    var o=solids[s];
    if(Math.abs(x-o.x)<o.hw && Math.abs(z-o.z)<o.hd) return true;
  }
  return false;
}

// ================================================================ hands
// 手是全場離手電筒最近的東西（0.42 公尺），所以**一定要用 Phong**。
// Lambert 是逐頂點打光，在這種近距離、大面積的表面上會看不出光斑，
// 手會變成一塊平板（第 6 節那條坑，當初漏掉了手）。
var handMat=new THREE.MeshPhongMaterial({color:0x7d6c5b,shininess:6,specular:0x141110});
// 膚色只調亮度，色相固定。第一版刻意偏暗：手是全場最靠近手電筒的東西，
// 過曝的話眼疾 shader 疊上去會整片糊掉，那是最難判斷的狀態。
// 寧可你嫌暗，也不要一開始就白掉
function applyHandLook(){
  handMat.color.setHSL(0.078,0.16,TUNE.handBright);
  handMat.shininess=TUNE.handShine;
  if(typeof rHand!=='undefined'&&rHand) rHand.scale.setScalar(TUNE.handScale);
  if(typeof lHand!=='undefined'&&lHand) lHand.scale.setScalar(TUNE.handScale);
}
var steelMat=new THREE.MeshLambertMaterial({color:0x5a6166});

// ---- 手的幾何：程序化生成，零素材檔 ----
// 為什麼不抓現成模型：抓來的手都是張開的，要握五種武器得在 Blender 裡
// 綁骨架擺五組姿勢；而且素材站（Sketchfab／Poly Haven）在建置環境連不上。
// 程序化的手可以把「彎多少」變成參數，直接放進調參面板用手機拉。
//
// 座標系（右手，未旋轉時）：
//   手掌躺在 xz 平面，**掌心朝 +y**，手指指向 -z，拇指在 -x 側。
//   手指往 +y 捲（繞 x 軸正向轉），所以**握住的圓柱軸線平行於 x**。
// 五把武器的握把有兩種方向，所以用的時候要把整隻手轉過去：
//   鐵撬／斧／瓶／手電筒＝握把沿 z（繞 y 轉 90°）
//   手槍／霰彈槍＝握把垂直沿 y（繞 z 轉 90°）
var HAND_SEG={
  //           指節根部 x, 三節長度,            半徑
  index :[-.030,[.040,.026,.021],.0108],
  middle:[-.008,[.043,.028,.022],.0112],
  ring  :[ .014,[.040,.026,.021],.0104],
  pinky :[ .034,[.032,.021,.018],.0092]
};
// 三種握法。數字是每一節相對前一節的彎曲角（弧度），三節加起來約 3 弧度，
// **兩節做不出握拳**：手指總長約 0.088，要圍成半徑 0.03 的圈需要繞約 3 弧度，
// 分兩節的話每節要彎 1.5 弧度以上，關節會互相插進去。三節才是對的。
var HAND_POSE={
  grip   :{f:[1.02,1.00,0.98], th:[0.75,0.60], spread:0.030},  // 握圓柱
  trigger:{f:[1.02,1.00,0.98], th:[0.62,0.45], spread:0.030,
           idx:[0.30,0.16,0.12]},                              // 食指伸出扣扳機
  wide   :{f:[0.70,0.60,0.54], th:[0.55,0.40], spread:0.042},  // 半握：瓶身太粗，握不攏
  open   :{f:[0.14,0.10,0.08], th:[0.20,0.12], spread:0.075}   // 空手／檢視物品
};
// 為什麼玻璃瓶要另一種握法：瓶身半徑 52 mm，而手指總長 88 mm 只圍得起
// 半徑約 29 mm 的圈——照握鐵撬那樣彎下去，手指會直接插進瓶子裡。
// 真實世界拿瓶子本來就是手指圍不攏的（verify_hand.js 第 4、5 項會驗這件事）。
var HAND_GEO={};
// 把一塊幾何搬到指定的位置與角度，然後回傳（mergeGeos 只會接位置陣列，
// 所以變換必須在合併之前先烤進頂點裡）
function hPart(geo,px,py,pz,rx,ry,rz,mir){
  var m=new THREE.Matrix4();
  m.makeRotationFromEuler(new THREE.Euler(rx,mir?-ry:ry,mir?-rz:rz));
  m.setPosition(mir?-px:px,py,pz);
  return geo.clone().applyMatrix4(m);
}
// 一根手指：從指節根部往 -z 長出去，每一節在前一節的末端接著再彎一點
function hFinger(out,kx,ky,kz,L,r,ang,spread,mir){
  var x=kx,y=ky,z=kz,a=0;
  var sy=(kx*(mir?-1:1))*0;                       // 保留給之後的側向張開
  for(var i=0;i<L.length;i++){
    a+=ang[i];
    var rr=r*(1-i*0.11);
    // 圓柱預設沿 y，轉 90° 讓它沿 z；再繞 x 彎 a
    var g=new THREE.CylinderGeometry(rr*0.94,rr,L[i],6);
    var m=new THREE.Matrix4().makeRotationX(Math.PI/2+a);
    // 這一節的中點＝根部沿著「彎過 a 之後的方向」走半節
    var dx=0, dy=Math.sin(a)*L[i]/2, dz=-Math.cos(a)*L[i]/2;
    var mm=new THREE.Matrix4().makeRotationFromEuler(
      new THREE.Euler(Math.PI/2+a,0,mir?-spread:spread));
    mm.setPosition(mir?-(x+dx):(x+dx), y+dy, z+dz);
    g.applyMatrix4(mm);
    out.push(g);
    // 末端＝再走半節，成為下一節的根部
    x+=dx; y+=dy*2-dy; z+=dz;
    y+=Math.sin(a)*L[i]/2; z+=-Math.cos(a)*L[i]/2;
  }
  return {x:x,y:y,z:z};
}
// 產生一隻手。pose＝握法，mir=true 是左手（把 x 鏡射，箱與圓柱本身左右對稱，
// 所以只要鏡射位置與繞 y／z 的角度就好，三角形繞向不會反過來）
function handGeo(pose,mir){
  var key=pose+(mir?'L':'R');
  if(HAND_GEO[key]) return HAND_GEO[key];
  var P=HAND_POSE[pose]||HAND_POSE.grip, out=[];
  // 手掌：0.088 寬 × 0.030 厚 × 0.096 長。真實成人手掌約這個尺寸，
  // 舊版是 0.12×0.13×0.17 的方塊——13 公分厚，那是一塊磚不是手
  out.push(hPart(new THREE.BoxGeometry(.088,.030,.096),0,0,.004,0,0,0,mir));
  // 拇指根部的肉墊（大魚際）。少了它手掌會是一片方板，輪廓一眼就假
  out.push(hPart(new THREE.BoxGeometry(.026,.028,.062),-.038,-.002,.016,0,.22,0,mir));
  var tipY=0,tipZ=0,n=0;
  for(var k in HAND_SEG){
    var s=HAND_SEG[k];
    var ang=(pose==='trigger'&&k==='index')?P.idx:P.f;
    var sp=(s[0]/.034)*P.spread*0.35;             // 小指張得比食指開一點
    var e=hFinger(out,s[0],.010,-.048,s[1],s[2],ang,sp,mir);
    if(k!=='pinky'){ tipY+=e.y; tipZ+=e.z; n++; }
  }
  // 拇指：從 -x 側斜出去，繞 y 轉開、繞 x 彎過來壓住握把
  var tx=-.046,ty=.002,tz=.020,ta=0;
  for(var i=0;i<2;i++){
    ta+=P.th[i];
    var TL=[.036,.030][i], tr=[.0135,.0120][i];
    var g=new THREE.CylinderGeometry(tr*0.9,tr,TL,6);
    var dy=Math.sin(ta)*TL/2, dz=-Math.cos(ta)*TL/2;
    var mm=new THREE.Matrix4().makeRotationFromEuler(
      new THREE.Euler(Math.PI/2+ta,mir?0.62:-0.62,0));
    mm.setPosition(mir?-(tx):(tx),ty+dy,tz+dz);
    g.applyMatrix4(mm); out.push(g);
    tx+=mir?-0.016:0.016; ty+=dy*2; tz+=dz*2;
  }
  var g=mergeGeos(out);
  // 握住的圓柱**中心在哪裡**：四指指尖與指節根部的中點，就是被圍起來的那個圈。
  // 擺放的時候要讓這個點對準武器的握把，不是讓手掌對準握把
  g.userData={gripY:(tipY/n+.010)/2, gripZ:(tipZ/n-.048)/2};
  HAND_GEO[key]=g;
  return g;
}

// 前臂**不能跟著手一起轉**。握沿 z 的鐵撬時整隻手要繞 y 轉 90°，
// 前臂跟著轉的話就從「指向身體」變成「指向右側」，手臂會橫著伸出畫面外——
// 而且畫面一變矮、水平視角變寬，那隻橫著的手臂就露出更多，
// 看起來像「畫面尺寸跑掉」。真實世界握前方的棍子時前臂本來就跟棍子平行，
// 只有手腕以下轉過去。所以前臂固定沿 +z，只有手掌與手指跟著武器轉。
function foreGeo(){
  return new THREE.CylinderGeometry(.042,.056,.30,8)
    .applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI/2)
      .setPosition(0,-.020,.200));
}
var rightArm=new THREE.Group();
rightArm.add(new THREE.Mesh(foreGeo(),handMat));
var rHand=new THREE.Group();
rHand.add(new THREE.Mesh(handGeo('grip',false),handMat));
rightArm.add(rHand);
// ---- 三把武器，全部用基本幾何體組，不引入模型檔 ----
var woodMat=new THREE.MeshLambertMaterial({color:0x6b4c33});
var bladeMat=new THREE.MeshLambertMaterial({color:0x9aa3a8});
var glassMat=new THREE.MeshLambertMaterial({color:0x4e7a5c,transparent:true,opacity:0.62});
var WMESH={};
(function(){
  // 鐵撬：一根扁鐵條 + 尾端的撬勾
  var crow=new THREE.Group();
  var b=new THREE.Mesh(new THREE.BoxGeometry(.036,.036,.78),steelMat);
  b.position.set(0,.02,-.34); crow.add(b);
  var c=new THREE.Mesh(new THREE.BoxGeometry(.034,.13,.034),steelMat);
  c.position.set(0,-.03,-.71); c.rotation.x=.55; crow.add(c);
  rightArm.add(crow); WMESH.crow=crow;

  // 消防斧：長木柄 + 前端的斧頭。刃比鐵撬遠很多，所以距離感差別看得出來
  var axe=new THREE.Group();
  var h=new THREE.Mesh(new THREE.CylinderGeometry(.028,.033,1.02,8),woodMat);
  h.position.set(0,.01,-.44); h.rotation.x=Math.PI/2; axe.add(h);
  var head=new THREE.Mesh(new THREE.BoxGeometry(.055,.20,.13),bladeMat);
  head.position.set(0,.06,-.90); axe.add(head);
  var edge=new THREE.Mesh(new THREE.CylinderGeometry(.006,.055,.20,4),bladeMat);
  edge.position.set(0,.06,-.99); edge.rotation.set(0,0,Math.PI/2); edge.rotation.y=Math.PI/2;
  axe.add(edge);
  var spike=new THREE.Mesh(new THREE.ConeGeometry(.028,.16,6),bladeMat);
  spike.position.set(0,-.06,-.90); spike.rotation.x=-Math.PI/2; axe.add(spike);

function setGrip(hand,key,mir){
  var G=GRIP[key]||GRIP.none;
  var g=handGeo(G.p,mir);
  hand.children[0].geometry=g;
  var W=new THREE.Vector3().fromArray(G.w).normalize();
  var A=new THREE.Vector3().fromArray(G.a); if(mir) A.x=-A.x;
  A.sub(W.clone().multiplyScalar(A.dot(W))).normalize();   // 把 a 拉成垂直於 w
  // 手的座標系：x＝拇指方向（右手拇指在 -x，所以 x 映到 -w；左手是鏡射的，映到 +w）
  //             y＝掌心法線（掌心貼著軸，所以指向 -a）
  //             z＝叉積補齊，手指自然就橫過那根軸
  var xA=W.clone().multiplyScalar(mir?1:-1);
  var yA=A.clone().negate();
  var zA=new THREE.Vector3().crossVectors(xA,yA).normalize();
  yA.crossVectors(zA,xA).normalize();
  hand.rotation.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xA,yA,zA));
  var c=new THREE.Vector3(0,g.userData.gripY,g.userData.gripZ).applyEuler(hand.rotation);
  var at=mir?ZERO:G.at;
  hand.position.set(at[0]-c.x, at[1]-c.y, at[2]-c.z);
}

// 黃斑部病變：這裡只留末期真的變成暗點的部分。
// 文獻上中央缺損會被大腦「填補」——病人多半不知道缺損的邊界在哪，
// 只覺得「看不清楚」「認不出來」。主體同樣放在 main() 裡做填補。
'#if DIS==2',   // 黃斑部 · 末期暗點
'  if(amd>0.001){',
'    float a3=amd*amd;',
'    loss=max(loss,smoothstep(uAmdP.x*0.60+uAmdP.y*0.45*amd,0.0,r)*a3*0.88);}',
'#endif',
// 糖尿病視網膜病變：玻璃體出血的血絲不是整齊的圓點，
// 是不規則、拉長、而且會隨著眼球轉動慢慢飄的一團一團
'#if DIS==4',   // 糖尿病 · 血絲
'  if(dr>0.001){',
'    for(int i=0;i<6;i++){ float fi=float(i);',
'      float sp=hash(vec2(fi,2.2+seed));',
'      vec2 p=(vec2(hash(vec2(fi,1.7+seed)),hash(vec2(fi,4.3+seed)))-0.5)*vec2(2.0,1.6);',
'      p+=vec2(sin(t*0.09+fi*1.9+seed),cos(t*0.07+fi*2.7+seed))*0.11;',
'      float on=step(fi/6.0,dr);',
'      vec2 d0=f-p;',
'      vec2 q=vec2(d0.x*0.92+d0.y*0.39,-d0.x*0.39+d0.y*0.92);',
'      q.y*=2.4+3.2*sp;',
'      float sz=uDrP.x+uDrP.y*sp;',
'      loss=max(loss,smoothstep(sz,sz*0.25,length(q))*on*dr*0.88);} }',
'#endif',
'  return clamp(loss,0.0,1.0);}',

'void main(){',
'  vec2 uv=vUv; float aspect=uRes.x/max(uRes.y,1.0);',
'  if(uShake>0.001) uv+=vec2(sin(uTime*61.0),cos(uTime*47.0))*0.006*uShake;',
'  vec2 f=(uv-0.5)*2.0;',
'  float r=length(f*vec2(1.0,0.9));',

// 屈光類症狀：好的那隻眼會主導，但對比仍會下降
'  float catB=min(uCat.x,uCat.y);  float cat=catB+(max(uCat.x,uCat.y)-catB)*0.38;',
'  float amdB=min(uAmd.x,uAmd.y);  float warp=amdB+(max(uAmd.x,uAmd.y)-amdB)*0.28;',
'  float drB=min(uDr.x,uDr.y);',

// 黃斑部病變的變形視（metamorphopsia）：**是固定的，不會晃動**。
// 病人看到的是「直線被折彎了」，不是「畫面在抖」。原本掛了 uTime，
// 那會變成水波紋，跟 Amsler grid 上看到的東西完全不一樣。
'#if DIS==2',   // 黃斑部 · 變形視
'  if(warp>0.001){',
'    float w=exp(-pow(r/uAmdP.w,2.0))*warp;',
'    uv+=vec2(sin(f.y*11.5),cos(f.x*9.5))*uAmdP.z*w;',
// 微小視（micropsia）：感光細胞被推開，變形區裡的東西看起來比較小
'    uv+=(uv-vec2(0.5))*w*0.12;}',
'#endif',

'  vec3 col;',
'#if DIS==2 || DIS==3 || DIS==4',          // 只有這三種需要散焦
'  float blurAmt=cat*0.55+warp*0.30+drB*0.35;',
'  if(blurAmt>0.002){',
'    vec3 acc=vec3(0.0); float rad=blurAmt*0.010;',
'    for(int i=0;i<10;i++){ float fi=float(i);',
'      float ang=fi*2.399963; float rr=sqrt((fi+0.5)/10.0)*rad;',
'      vec2 off=vec2(cos(ang),sin(ang))*rr; off.x/=aspect;',
'      acc+=texture2D(tDiffuse,uv+off).rgb;}',
'    col=acc/10.0;',
'  } else col=texture2D(tDiffuse,uv).rgb;',
'#else',
'  col=texture2D(tDiffuse,uv).rgb;',
'#endif',

'  col=expose(col);',

// 白內障：真正的機轉是**前向散射（straylight）**。混濁的水晶體把光散開，
// 在視網膜影像上疊一層「光幕」（veiling luminance），讓對比整個掉下來。
// 所以它不是把畫面模糊，是把畫面**加上一層由亮處擴散出來的乳白**——
// 黑的地方被墊高、亮的地方暈開，這才是「白濁」的感覺。
// 光幕的強度跟場景裡的光有關：面對燈就整片糊掉，面對暗牆就相對乾淨。
'#if DIS==3',   // 白內障
'  if(cat>0.002){',
// 取樣的角度與半徑都要**逐像素隨機打散**。固定的螺旋角度會讓每一個亮物
// 複製成一圈整齊的鬼影（藥盒變成一圈小藥盒），那是取樣的瑕疵不是散射。
// 真正的散射是連續的，所以打散之後看起來會像很細的顆粒，那才對。
// 半徑用 1.5 次方往內壓，因為散射的能量絕大部分集中在小角度，外圍只有很淡的尾巴。
'    vec3 sc=vec3(0.0); float wsum=0.0;',
'    float j0=hash(gl_FragCoord.xy)*6.2831853;',
'    float j1=hash(gl_FragCoord.xy+vec2(37.0,17.0));',
'    for(int i=0;i<16;i++){ float fi=float(i);',
'      float ang=fi*2.399963+j0;',
'      float rr=pow((fi+0.35+j1)/16.35,1.5)*uCatP.x;',
'      vec2 off=vec2(cos(ang),sin(ang))*rr; off.x/=aspect;',
'      float w=1.0/(1.0+rr*14.0);',
'      sc+=texture2D(tDiffuse,uv+off).rgb*w; wsum+=w;}',
'    sc=expose(sc/max(wsum,0.0001));',
'    float sl=dot(sc,vec3(0.299,0.587,0.114));',
'    vec3 veil=(mix(sc,vec3(sl),0.55)+vec3(0.030,0.030,0.028))*uCatP.z*cat;',
'    col=col*(1.0-0.22*cat)+veil;',
// 核性白內障會黃化（brunescence）：藍光被吸收得最多
'    col.b*=1.0-uCatP.y*cat*0.62; col.g*=1.0-uCatP.y*cat*0.18;',
'    float lum=dot(col,vec3(0.299,0.587,0.114));',
'    col=mix(col,vec3(lum),uCatP.w*cat*0.55);',
'    col=(col-0.5)*(1.0-uCatP.w*cat)+0.5;}',
'#endif',

// 青光眼的主體：弓形缺損（Bjerrum）＋ 大腦的填補。
// 文獻上病人幾乎沒有人把它形容成黑色隧道或黑色斑塊，最常被選的是
// 「模糊的區塊」與「不見的區塊」——缺損會被周圍的顏色紋理補起來，
// 所以那塊不是黑的，是**沒有細節、沒有對比的一片**。
// 你不會看到一個洞，你只是看不到那裡站著一隻喪屍。
// 形狀沿著視神經纖維束呈弓形，繞過中央凹，而且到水平中線就突然中止
//（上下神經纖維在水平縫分界），上下兩條弧幾乎不會對稱。
'#if DIS==1',   // 青光眼 · 主體
'  float gsev=max(uGlauc.x,uGlauc.y);',
'  if(gsev>0.004){',
// 早期要幾乎沒感覺——研究裡有 26% 的病人**完全不知道自己視力有缺損**。
// 如果一開始就看得出來，這個病最可怕的地方就沒傳達到。
'    float gp=smoothstep(uGlaQ.w*0.30,uGlaQ.w+0.60,gsev);',
'    float rg=length(f*vec2(1.0,1.30));',
'    float aG=atan(f.y,f.x);',
// 邊界不是幾何學上的正圓，用角度上的低頻擾動揉亂
'    rg*=1.0+0.16*sin(aG*2.0+1.3)+0.10*sin(aG*3.0-0.7)+0.06*sin(aG*5.0+2.2);',
// 指數用 1.4 而不是 2.0：高斯的尾巴收得太快，邊界會看起來像一條線。
// 1.4 的尾巴拖得長，缺損是「慢慢淡出去」的
'    float band=exp(-pow(abs(rg-uGlaP.x)/max(uGlaP.y,0.05),1.4));',
// 上下半場的交界仍然是階梯（水平中線），但**不是一條直線**：
// 水平縫本身就是不規則的，而且那是敏感度的落差不是一道牆。
// 原本 0.07 寬的直線過渡在畫面中央會看成一條接縫
'    float raphe=f.y+0.055*sin(f.x*3.1+0.7)+0.028*sin(f.x*5.7-1.4);',
'    float hemi=mix(uGlaP.z,1.0,smoothstep(-0.11,0.11,raphe));',
// 缺損不是一整條連續的弧，是沿著弧散布的**好幾塊**。
// 病程越重塊與塊才連起來，這就是臨床上「旁中心暗點 → 弓形暗點 → 環狀」的順序
// 注意：這個變數**不能叫 patch**。patch 在 GLSL ES 3.0 是保留字，
// 手機的 ANGLE 會把 shader 升級成 300 es 再編譯，一用就整支編不過、畫面全黑。
'    float pn=0.5+0.5*sin(aG*3.7+1.1)*sin(aG*2.3-0.6)+0.30*sin(aG*6.1+2.4);',
'    pn=mix(1.0,pn,uGlaQ.x);',
'    float blot=smoothstep(0.50-0.50*gp,1.10-0.60*gp,pn+0.35*gp);',
'    float gd=clamp(band*hemi*blot*gp*1.70,0.0,0.94);',
// 抖動：把邊界那條等高線打散成雜訊。人眼對「連續的曲線」極度敏感，
// 對同樣強度的雜訊卻幾乎看不出來——所以加一點點抖動，邊界就消失了
'    gd=clamp(gd+(hash(gl_FragCoord.xy+vec2(11.0,7.0))-0.5)*0.10,0.0,0.94);',
'    float g2=pow(gsev,1.35);',                    // 末期才輪到周邊整圈收縮
'    float con=smoothstep(mix(2.8,uGlaP.w,g2),mix(2.3,uGlaP.w*0.45,g2),rg);',
'    gd=max(gd,(1.0-con)*gsev*0.94);',
'    float dg=uGlaQ.z*gsev;',
'    if(gd>0.004||dg>0.004){',
'      vec3 sN=vec3(0.0), sW=vec3(0.0);',
'      float k0=hash(gl_FragCoord.xy)*6.2831853;',
// 取樣半徑要跟**這一局的病程**走，不能跟 gd 走。
// 半徑一旦隨位置改變，糊的程度就會在缺損邊緣突然跳一階，
// 那個跳階本身就是一條看得見的邊
'      float RW=0.030+0.060*gsev;',
'      for(int i=0;i<8;i++){ float fi=float(i);',
'        float an=fi*2.399963+k0; float rt=sqrt((fi+0.5)/8.0);',
'        vec2 o1=vec2(cos(an),sin(an))*rt*0.018; o1.x/=aspect;',
'        vec2 o2=vec2(cos(an),sin(an))*rt*RW; o2.x/=aspect;',
'        sN+=texture2D(tDiffuse,uv+o1).rgb;',
'        sW+=texture2D(tDiffuse,uv+o2).rgb;}',
'      sN=expose(sN/8.0); sW=expose(sW/8.0);',
// 「像隔著髒玻璃」「字看起來很淡」「光線太多」——研究指出這種整體的
// 影像品質下降才是病人最常抱怨的東西，它跟缺損無關，全視野都有一點
'      if(dg>0.004){',
'        float ld=dot(sW,vec3(0.299,0.587,0.114));',
'        col=mix(col,mix(sN,vec3(ld),0.30),0.42*dg);',
'        col+=sW*0.10*dg;}',
// 缺損區分兩種表現，比例照實證：
//   淺的部分＝「模糊的區塊」（54% 的病人選這張）
//   深的核心＝「東西不見了」，被周圍的背景整個補起來（16%）
// 兩種都**維持原本的亮度**，不會變黑也不會變白
'      if(gd>0.004){',
'        float miss=clamp(smoothstep(0.42,0.90,gd)*uGlaQ.y,0.0,1.0);',
'        float lw=dot(sW,vec3(0.299,0.587,0.114));',
'        vec3 fill=mix(sN,mix(sW,vec3(lw),0.65),miss);',
'        float lf=dot(fill,vec3(0.299,0.587,0.114));',
'        fill=mix(fill,vec3(lf),0.40*gd);',
'        col=mix(col,fill,gd);} } }',
'#endif',

// 黃斑部病變的主體：中央的「認不出來」。
// 文獻上中央暗點會被知覺填補——病人會感知到那一塊的顏色與紋理，
// 通常不知道缺損的邊界在哪，所以畫成一個黑點是不對的。
// 真正的殘障是：你正對著一張臉，卻認不出那是誰。
'#if DIS==2',   // 黃斑部 · 主體
'  float asev=max(uAmd.x,uAmd.y);',
'  if(asev>0.004){',
'    float ra=length(f);',
'    float am=smoothstep(uAmdP.x+uAmdP.y*asev,0.0,ra);',
'    float ad=clamp(am*asev*1.7,0.0,0.93);',
'    if(ad>0.004){',
'      vec3 sa=vec3(0.0);',
'      for(int i=0;i<8;i++){ float fi=float(i);',
'        float ang=fi*2.399963; float rs=sqrt((fi+0.5)/8.0)*0.034;',
'        vec2 off=vec2(cos(ang),sin(ang))*rs; off.x/=aspect;',
'        sa+=texture2D(tDiffuse,uv+off).rgb;}',
'      sa=expose(sa/8.0);',
'      float la=dot(sa,vec3(0.299,0.587,0.114));',
'      col=mix(col,mix(sa,vec3(la),0.55)*0.92,ad);} }',
'#endif',

// 糖尿病視網膜病變的主體有兩件事，而且都不是「黑點」：
// 一是玻璃體出血——血在玻璃體裡，整片視野蒙上一層紅褐色的濁；
// 二是黃斑部水腫，這是糖尿病病人失明最常見的原因，表現是中央變模糊、變形。
'#if DIS==4',   // 糖尿病 · 主體
'  float dsev=max(uDr.x,uDr.y);',
'  if(dsev>0.004){',
'    float ld=dot(col,vec3(0.299,0.587,0.114));',
'    col=mix(col,vec3(0.36,0.11,0.08)*(0.30+ld*1.1),uDrP.z*dsev*0.60);',
'    float rd=length(f);',
'    float ed=exp(-pow(rd/0.62,2.0))*uDrP.w*dsev;',
'    if(ed>0.004){',
'      vec3 sd=vec3(0.0);',
'      for(int i=0;i<6;i++){ float fi=float(i);',
'        float ang=fi*2.399963+1.1; float rs=sqrt((fi+0.5)/6.0)*0.022;',
'        vec2 off=vec2(cos(ang),sin(ang))*rs; off.x/=aspect;',
'        sd+=texture2D(tDiffuse,uv+off).rgb;}',
'      col=mix(col,expose(sd/6.0),clamp(ed,0.0,0.88));} }',
'#endif',

// 雙眼合成
// 兩眼視野的交界。右側超過某個角度就只有右眼看得到，那個界線是**鼻樑**擋出來的——
// 鼻樑不是一片玻璃，所以邊界要軟、要不規則。
// 原本寫成筆直的 smoothstep(0.74,0.46)，等黑幕爬過這條線之後，
// 玩家看到的黑色邊界就會被釘在這條直線上，不規則的黑幕邊緣整個被蓋掉，
// 看起來就變成「直直一條線」。
'  float nose=0.060*sin(f.y*2.6+0.9)+0.032*sin(f.y*5.1-1.7)+0.018*sin(f.y*8.3+2.4);',
'  float fieldL=smoothstep(0.88+nose,0.38+nose,f.x);',
'  float fieldR=smoothstep(-0.88-nose,-0.38-nose,f.x);',
'  float seeL=fieldL*(1.0-eyeLoss(f,-1.0,uDetach.x,uFloat.x,uGlauc.x,uAmd.x,uDr.x,uTime,0.0));',
'  float seeR=fieldR*(1.0-eyeLoss(f, 1.0,uDetach.y,uFloat.y,uGlauc.y,uAmd.y,uDr.y,uTime,1.37));',
'  float vis=max(seeL,seeR);',
'  float mono=clamp(vis-min(seeL,seeR),0.0,1.0);',
'  if(mono>0.01){',
'    float disp=0.018;',
'    if(uDepthOn>0.5){ float dz=texture2D(tDepth,uv).x;',
'      float lin=(2.0*uNear*uFar)/(uFar+uNear-(2.0*dz-1.0)*(uFar-uNear));',
'      disp=clamp(0.055/max(lin,0.6),0.0,0.055);}',
'    float dir=(seeL>seeR)?1.0:-1.0; vec2 off=vec2(disp*dir,0.0);',
// 患眼那一張影像不只是位移。文獻上 macula-off 剝離術後絕大多數人有變形視，
// 而且過半數有**不等像**——患眼看到的影像比較小（micropsia），
// 加上對比與色彩恢復不完全。兩眼送上來的影像大小與形狀對不起來，
// 大腦融合不了，這正是「疊影與視差」的來源。
'    vec2 gu=vec2(0.5)+(uv-vec2(0.5))*(1.0+uDetQ.x);',
'    gu+=vec2(sin(f.y*9.0),cos(f.x*7.0))*uDetQ.y;',
'    vec3 g1=expose(texture2D(tDiffuse,gu+off).rgb);',
'    vec3 g2=expose(texture2D(tDiffuse,gu+off*0.5).rgb);',
'    vec3 gh=g1*0.58+g2*0.42;',
'    float lg2=dot(gh,vec3(0.299,0.587,0.114));',
'    gh=mix(gh,vec3(lg2),uDetQ.w);',
'    gh=(gh-0.5)*(1.0-uDetQ.z)+0.5;',
'    col=mix(col,gh,0.50*mono);',
'    float lum=dot(col,vec3(0.299,0.587,0.114));',
'    col=mix(col,vec3(lum),0.09*mono); col=mix(col,col*0.91,mono);}',
'  col=mix(vec3(0.014,0.014,0.020),col,clamp(vis,0.0,1.0));',

// 槍口致盲。跟病程閃光刻意做得完全不一樣：位置在準心偏右下、形狀是一個圓斑、
// 而且真正讓你看不見的不是白光，是白光退掉之後留下的那塊暗斑（後像）。
// 暗斑固定在畫面上不會因為轉頭而甩掉——後像是貼在視網膜上的。
// 白光要乘上 vis：黑幕那塊視網膜沒在工作，外面再亮它也不會亮。
'  if(uMuzz.x>0.001||uMuzz.y>0.001){',
'    vec2 mp=f-vec2(0.20,-0.16);',
// uMuzz.z 是斑的大小倍率。手槍是 1.0，霰彈槍大得多——
// 它的火光整個把準心附近吃掉，這是「粗略方向就夠」換來的代價
'    float msz=max(uMuzz.z,0.20);',
'    float sp=exp(-dot(mp,mp)*3.0/(msz*msz));',
'    col+=vec3(1.00,0.90,0.72)*uMuzz.x*(0.35+0.85*sp)*clamp(vis,0.0,1.0);',
// 後像**不能只是把畫面調暗**。停車場本來就暗，暗上加暗等於什麼都沒發生。
// 它是一塊不透明的斑蓋在視野上，把底下的細節整個吃掉：
// 亮的地方看起來是暗斑，暗的地方看起來是浮在眼前的髒污。兩種都擋住東西。
'    float amt=clamp(uMuzz.y*sp,0.0,0.96);',
'    vec3 tgt=vec3(0.058,0.078,0.074)+col*0.10;',
'    col=mix(col,tgt,amt);}',

'  if(uFlash>0.001){',                       // 閃光 · 作者版：整片視野閃一下，周邊略強
'    float shape=0.62+0.50*smoothstep(0.15,1.25,length(f));',
'    shape*=1.0+0.30*smoothstep(-0.3,1.0,f.x);',
'    col+=vec3(0.86,0.92,1.0)*uFlash*shape;}',

// 閃光 · 文獻版：顳側周邊的一道弧光（像相機閃燈從眼角掃過去）。
// 玻璃體對視網膜的牽引就發生在周邊，所以它有位置、有形狀，不是整片。
// 這是視網膜自己產生的光，所以**不乘 vis**——它可以出現在黑幕裡面。
'#if DIS==0',   // 顳側弧光
'  if(uArc.x>0.001){',
'    float xs=f.x*mix(1.0,1.6,uArcP.w);',
'    float rA=uArcP.x*(1.0+0.10*sin(atan(f.y,f.x)*3.0+1.9));',
'    float d=abs(length(vec2(xs,f.y)*vec2(0.80,1.0))-rA);',
'    float a=exp(-pow(d/max(uArcP.y,0.02),2.0));',
// 每一次只出現在弧的**一小段**上，而且位置每次不一樣（uArc.y）。
// 整圈都亮起來會很像特效；真實的牽引只發生在某一處
'    float aa=atan(f.y,f.x);',
'    float dA=abs(mod(aa-uArc.y+3.14159265,6.28318531)-3.14159265);',
'    a*=exp(-pow(dA/0.52,2.0));',
'    a*=smoothstep(-0.25,0.45,f.x);',        // 仍然偏顳側（右眼＝畫面右側）
'    a*=0.60+0.40*sin(f.y*7.0+uTime*2.3);',  // 弧不是均勻的，會有明暗
'    col+=vec3(0.90,0.94,1.0)*uArc.x*a*uArcP.z;}',
'#endif',
'  col*=(1.0-uFade);',
'  gl_FragColor=vec4(col,1.0);}'
].join('\n')});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));
var DIS_IDX={detach:0,glauc:1,amd:2,cat:3,dr:4};
function setDiseaseShader(key){
  var v=DIS_IDX[key]; if(v===undefined) v=0;
  if(postMat.defines.DIS===v) return;
  postMat.defines.DIS=v; postMat.needsUpdate=true;   // 換病＝重新編譯一次
}

// ================================================================ 資產來源
// 同一份原始碼支援兩種建置方式（詳見 build/README.md）：
//
//   發佈模式  python3 4_pack.py        → slice-model.html（單一檔，可雙擊開）
//             模型與音效全部 base64 內嵌。用 file:// 開啟時瀏覽器不讓讀旁邊的
//             檔案（CORS），所以「可雙擊開啟」和「內嵌」是同一件事的兩面。
//
//   開發模式  python3 4_pack.py --dev          → dist/index.html + dist/assets/
//             python3 4_pack.py --dev --flat   → dist-flat/（資產跟 index.html 同一層）
//             模型與音效用網址抓。**只有 http(s) 底下有效。**
//             改程式只要重傳 index.html（約 0.4 MB），資產（約 2.25 MB）
//             由瀏覽器快取，不會重新下載。
//             攤平版是給手機用的：手機的 GitHub 網頁沒辦法拖曳資料夾。
//
// 兩種模式唯一的差別是「這幾個位元組從哪裡來」。拿到 ArrayBuffer 之後的路
// 完全一樣，所以分岔只發生在 assetBuf() 這一個函式裡。
var A_MODE=(typeof ASSETS==='object'&&ASSETS&&ASSETS.mode)||'embed';
var A_BASE=(typeof ASSETS==='object'&&ASSETS&&ASSETS.base)||'';
// 資產放哪裡，只用來組診斷訊息。--flat 建置的資產跟 index.html 同一層，
// 這時候如果訊息還在講「assets/」，會叫人去找一個根本不存在的資料夾
var A_WHERE=A_BASE||'跟 index.html 同一層';

// 開發模式的音效**不是 100 個獨立的檔，是兩包連在一起的二進位檔**：
//   sfx.bin＝喪屍叫聲 16 段、snd.bin＝aud2/ 的 84 段。
// 兩個實際理由：
//   1. GitHub 的網頁上傳一次最多 100 個檔。拆開來是 104 個，會被直接擋下來
//   2. 手機第一次載入要發一百個請求，掉了任何一個就少一種聲音，
//      而且不會有錯誤訊息——那正是最難查的一種壞法
// 每一段在包裡的位移與長度存在 index.html 裡（很小），所以改程式時會一起更新。
var BIN={}, BIN_ERR=[];

// 正規化：把兩種模式的清單變成同一個形狀，下游程式碼看到的東西一模一樣
//   {src, off 起音位置, dur 播放上限, gain 響度增益}
// src 在發佈模式是 base64 字串，在開發模式是 [在包裡的位移, 長度]。
var SFX={}, SND={};
(function(){
  var emb=(A_MODE==='embed'), A=(typeof ASSETS==='object'&&ASSETS)||{};
  Object.keys(A.sfx||{}).forEach(function(k){
    SFX[k]=A.sfx[k].map(function(e){
      return {src:(emb?e:[e[0],e[1]]), off:0, dur:0, gain:1}; });
  });
  Object.keys(A.snd||{}).forEach(function(k){
    SND[k]=A.snd[k].map(function(e){
      return emb ? {src:e[0], off:e[1]||0, dur:e[2]||0, gain:(e[3]===undefined?1:e[3])}
                 : {src:[e[0],e[1]], off:e[2]||0, dur:e[3]||0, gain:(e[4]===undefined?1:e[4])};
    });
  });
})();

function b64buf(s){
  var bin=atob(s),n=bin.length,u=new Uint8Array(n);
  for(var k=0;k<n;k++)u[k]=bin.charCodeAt(k);
  return u.buffer;
}
// 取出一段音效的位元組。**每次都必須是一份新的 ArrayBuffer**：
// decodeAudioData 會把傳進去的 buffer 吃掉（detach），同一份傳第二次會是空的。
// b64buf 每次新建一個，slice() 也是新的一份，兩條路都符合。
function assetBuf(which,e){
  if(A_MODE==='embed') return b64buf(e.src);
  var b=BIN[which]; if(!b) return null;
  return b.slice(e.src[0], e.src[0]+e.src[1]);
}
function binsReady(w){ return A_MODE==='embed' || !!BIN[w]; }

// 開發模式：一進頁面就開始抓兩個音效包，跟模型平行下載。
// 抓回來時如果 AudioContext 已經開了（玩家已經碰過畫面），要補叫一次解碼——
// 不然 loadSND() 那一次因為包還沒到而空手而回，之後就再也沒有人叫它了
function fetchBin(which,file,bytes){
  var t0=Date.now();
  fetch(A_BASE+file).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.arrayBuffer();
  }).then(function(ab){
    BIN[which]=ab;
    // 長度對不上＝資產跟 index.html 不是同一次建置出來的。
    // 這是換掉送檔方式之後**唯一新增的失敗模式**，而它的症狀是
    // 「聲音怪怪的」而不是錯誤訊息，所以一定要主動驗、主動報
    if(bytes&&ab.byteLength!==bytes){
      BIN_ERR.push(file+' 長度不符');
      log('音效包 '+file+' 長度不對：拿到 '+ab.byteLength+' 位元組、應該是 '+bytes+
          '　→ 資產是舊的（'+A_WHERE+'），要跟 index.html 一起重傳','bad');
    } else {
      log('音效包 '+file+'：<b>'+Math.round(ab.byteLength/1024)+' KB</b>　'+
          (Date.now()-t0)+' ms','ok');
    }
    if(AC){ loadVoices(); loadSND(); }
  }).catch(function(e){
    BIN_ERR.push(file+'（'+(e&&(e.message||e))+'）');
    log('音效包 '+file+' 抓不到：'+(e&&(e.message||e))+'　→ 這一局'+
        (which==='sfx'?'喪屍沒有叫聲':'沒有腳步與武器的聲音'),'bad');
  });
}
if(A_MODE==='url'){
  fetchBin('sfx',ASSETS.sfxBin,ASSETS.sfxBytes);
  fetchBin('snd',ASSETS.sndBin,ASSETS.sndBytes);
}

// ================================================================ audio
var AC=null,master=null,sfxBus=null,ambBus=null;
// 兩條匯流排：短音效走 sfxBus、環境音走 ambBus。
// 分開的理由是環境音要能單獨壓低——它是一直在響的東西，
// 音量只要高一點點就會把腳步聲蓋掉，而腳步聲是這個遊戲的感官。
function initAudio(){
  // 已經開過就只要確認它沒有被系統暫停。手機切到別的 App 再回來會停住，
  // 環境音是循環播放的，停住之後不 resume 就整關沒有聲音
  if(AC){ if(AC.state==='suspended'){ try{AC.resume();}catch(e){} } return; }
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
    sfxBus=AC.createGain();sfxBus.gain.value=1;sfxBus.connect(master);
    ambBus=AC.createGain();ambBus.gain.value=1;ambBus.connect(master);
    loadVoices();loadSND();applyMix();}catch(e){} }
addEventListener('visibilitychange',function(){
  if(!document.hidden) initAudio();
});
var GBUF={};
function loadVoices(){
  if(!AC||GBUF.loaded) return;
  if(!binsReady('sfx')) return;      // 包還沒到。fetchBin 抓回來之後會再叫一次
  GBUF.loaded=true;
  Object.keys(SFX).forEach(function(bank){
    GBUF[bank]=[];
    SFX[bank].forEach(function(e,i){
      try{
        var ab=assetBuf('sfx',e); if(!ab) return;
        AC.decodeAudioData(ab,function(buf){GBUF[bank][i]=buf;},function(){});
      }catch(err){}
    });
  });
}
// ================================================================ 素材音效庫（aud2/）
// SND 是建置時內嵌進來的：{ 組名: [ [base64, 起音位置, 播放上限, 響度增益], ... ] }
// 「起音位置」是因為有幾個素材前面還留著一段靜音（gun_pistol_1 前面有 1.19 秒）。
// 直接播的話按下去到聽見會慢半拍——那是最容易被誤判成「按鈕沒反應」的一種延遲。
// 「播放上限」是因為 gun_sg_3 原檔是「一槍＋泵動」，而遊戲自己會播泵動，不截掉會聽到兩次。
// 「響度增益」是因為素材是**依峰值**正規化的，而峰值跟「聽起來多大聲」是兩回事：
// step_in_3 的峰值跟兄弟們一樣，實際響度卻是它們的 3.2 倍——抽到它就會聽成
// 「突然重踩一下」。這個值把同一組裡的每個檔拉到同一個水平。
var SBUF={}, SND_ERR=0;
function decodeBank(k){
  if(!AC||SBUF[k]||!SND[k]) return;
  if(!binsReady('snd')) return;      // 包還沒到。抓回來之後、或下一次呼叫時會補
  SBUF[k]=[];
  SND[k].forEach(function(e,i){
    try{
      var ab=assetBuf('snd',e); if(!ab){ SND_ERR++; return; }
      AC.decodeAudioData(ab,
        function(buf){ SBUF[k][i]={buf:buf,off:e.off,dur:e.dur,gain:e.gain}; },
        function(){ SND_ERR++; });
    }catch(err){ SND_ERR++; }
  });
}
function loadSND(){
  if(!AC||SBUF.__done) return;
  if(!binsReady('snd')) return;
  SBUF.__done=true;
  // 環境音與心跳是長檔（20 秒），解碼出來很佔記憶體，等真的用到那一關再解。
  // 短音效全部先解，因為它們是「按下去就要響」的東西，不能等
  Object.keys(SND).forEach(function(k){
    if(k.indexOf('amb_')===0 || k==='heartbeat') return;
    decodeBank(k);
  });
}
// 素材播放。**素材本身是乾的單聲道**，左右定位與距離衰減全部在這裡做，
// 走的是跟合成音完全一樣的那條路（panOf → pan / vol / near）。
var SLAST={};
function snd(bank,o){
  o=o||{};
  if(!AC||!sfxBus) return null;
  var arr=SBUF[bank]; if(!arr||!arr.length) return null;
  var vol=(o.vol===undefined?1:o.vol);
  if(vol<=0.004) return null;
  var e;
  // pool = 只用前 N 段。用在「同一組裡混進了不合用的那一段」——
  // 例如 axe_chop_5 其實是碗放到桌上的聲音，砍進身體時它一出來就整個出戲
  var n=Math.min(arr.length, o.pool||arr.length);
  if(o.idx!==undefined){ e=arr[((o.idx|0)%arr.length+arr.length)%arr.length]; }
  else {
    // **不要連續抽到同一段**。腳步聲最明顯：同一個檔連放兩次，
    // 耳朵會把它聽成「這是循環播放的音檔」而不是「有人在走路」
    var p=Math.floor(Math.random()*n);
    if(n>1 && p===SLAST[bank]) p=(p+1+Math.floor(Math.random()*(n-1)))%n;
    SLAST[bank]=p; e=arr[p];
  }
  if(!e||!e.buf) return null;
  vol*=(e.gain===undefined?1:e.gain);              // 響度校正，見上面的說明
  var rate=o.rate||1, t0=AC.currentTime+(o.delay||0);
  var s=AC.createBufferSource(); s.buffer=e.buf; s.playbackRate.value=rate;
  var node=s;
  // near =「有多近」（0~1）。遠的悶、近的亮——距離感主要靠這個，不是只靠音量。
  // 這一段是從 splash() 搬過來的，邏輯完全一樣
  if(o.near!==undefined){
    var nr=Math.max(0,Math.min(1,o.near));
    var lo=(o.lpLo===undefined?420:o.lpLo), hi=(o.lpHi===undefined?9000:o.lpHi);
    var f=AC.createBiquadFilter(); f.type='lowpass';
    f.frequency.value=lo+(hi-lo)*Math.pow(nr,0.65);
    node.connect(f); node=f;
  } else if(o.lp){
    var f2=AC.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=o.lp;
    node.connect(f2); node=f2;
  }
  if(o.hp){ var f3=AC.createBiquadFilter(); f3.type='highpass'; f3.frequency.value=o.hp;
    node.connect(f3); node=f3; }
  var g=AC.createGain(); g.gain.value=vol; node.connect(g);
  if(AC.createStereoPanner){
    var pp=AC.createStereoPanner(); pp.pan.value=Math.max(-1,Math.min(1,o.pan||0));
    g.connect(pp); pp.connect(sfxBus);
  } else g.connect(sfxBus);
  var dur=(o.dur||e.dur||0);
  if(dur>0){
    // 截斷一定要淡出，直接切會「喀」一聲——那一聲聽起來就是程式壞了
    var end=t0+dur/rate;
    try{ g.gain.setValueAtTime(vol,Math.max(t0,end-0.06));
         g.gain.linearRampToValueAtTime(0.0001,end); }catch(err){}
    s.start(t0,e.off||0,dur+0.03);
  } else s.start(t0,e.off||0);
  return s;
}
// 音效的載入診斷。哪幾組解出來了、哪幾組沒有、AudioContext 現在是什麼狀態。
// 手機上「沒有聲音」有三種完全不同的原因：AudioContext 被暫停、素材沒解碼、
// 或是音量被拉到 0。沒有這份報告的話三種在畫面上長得一模一樣
function sndReport(){
  // 開發模式多了第四種「沒有聲音」的原因：音效包根本沒下載下來。
  // 前三種是 AudioContext 被暫停、素材沒解碼、音量被拉到 0
  if(A_MODE==='url'){
    log('音效包：sfx '+(BIN.sfx?Math.round(BIN.sfx.byteLength/1024)+' KB':'未到')+
        '　snd '+(BIN.snd?Math.round(BIN.snd.byteLength/1024)+' KB':'未到'),
        (BIN.sfx&&BIN.snd&&!BIN_ERR.length)?'ok':'bad');
    if(BIN_ERR.length) log('　音效包的問題：'+BIN_ERR.join('、'),'bad');
  }
  if(!AC){ log('音效：AudioContext 還沒建立（要先碰一下畫面）','bad'); return; }
  var ok=0,miss=[],tot=0;
  Object.keys(SND).forEach(function(k){
    var n=SND[k].length; tot+=n;
    var got=(SBUF[k]||[]).filter(function(e){return e&&e.buf;}).length;
    ok+=got;
    if(got<n && k.indexOf('amb_')!==0 && k!=='heartbeat') miss.push(k+' '+got+'/'+n);
  });
  log('音效：解碼 <b>'+ok+'/'+tot+'</b>　狀態 <b>'+AC.state+'</b>　失敗 <b>'+SND_ERR+'</b>',
      (SND_ERR||miss.length)?'bad':'ok');
  if(miss.length) log('　沒解出來的組：'+miss.join('、'),'bad');
  log('　音量 sfx='+TUNE.sfxVol.toFixed(2)+' amb='+TUNE.ambVol.toFixed(2)+
      ' 自己腳步='+TUNE.stepVol.toFixed(2)+' 喪屍腳步='+TUNE.zStepVol.toFixed(2));
}

// ---- 環境音（新的一層）----
// 每一關一段循環，進關淡入、離關淡出。**音量刻意壓得很低**：
// 它的功用是讓空間有底，不是讓玩家聽到它。一旦蓋過腳步聲，
// 「聽聲辨位比看更可靠」那條主軸就被自己的環境音打壞了。
// 第四欄是「低通要疊幾層」。一層是 -12dB/oct，兩層 -24dB/oct。
// Day 2 的素材裡整段都有鳥叫（2.5~7 kHz），而且是均勻分布的，
// 找不到一段沒有鳥的可以拿來循環——只能用濾波把那一帶壓掉。
// 兩層 1500 Hz 之後，3 kHz 衰減 24dB、6 kHz 衰減 48dB，鳥就聽不見了，
// 剩下的低頻隆隆聲反而更像「這條街已經沒有人了」
var AMB_FOR={
  1:['amb_street',   0.13, 480,  1],  // 公寓：外面已經亂了，但隔著窗——所以要悶
  2:['amb_street',   0.20, 1500, 2],  // 壓掉鳥叫，音量也調小
  3:['amb_pharmacy', 0.30, 0,    0],
  4:['amb_garage',   0.32, 0,    0],
  5:['amb_sewer',    0.38, 0,    0],
  // Day 6 沒有新素材（新增素材要重跑 5_onsets.py 並更新 CREDITS.md）。
  // 用街道那一段再壓一次低通：更遠、更空，像從很大的空地上傳過來的
  6:['amb_street',   0.16, 900,  2]
};
var ambSrc=null, ambGain=null, ambKey=null;
function ambStop(fade){
  ambKey=null;
  if(!ambSrc||!AC){ ambSrc=null; ambGain=null; return; }
  var s=ambSrc, g=ambGain, f=(fade===undefined?0.8:fade), t=AC.currentTime;
  ambSrc=null; ambGain=null;
  try{ g.gain.cancelScheduledValues(t);
       g.gain.setValueAtTime(Math.max(0.0001,g.gain.value),t);
       g.gain.exponentialRampToValueAtTime(0.0001,t+f); }catch(e){}
  setTimeout(function(){ try{s.stop();}catch(e){} }, f*1000+150);
}
function ambPlay(day){
  var cfg=AMB_FOR[day];
  ambStop(0.4);
  if(!AC||!cfg) return;
  var key=cfg[0], vol=cfg[1], lp=cfg[2], stages=cfg[3]||1;
  // 環境音是 20 秒的長檔，解碼出來一段就要 3.8 MB。四關全部留著＝15 MB，
  // 在便宜的手機上那是會被系統回收整個分頁的量。換關就把上一關那一段丟掉
  Object.keys(SBUF).forEach(function(k){
    if(k.indexOf('amb_')===0 && k!==key) delete SBUF[k];
  });
  ambKey=key;
  var tries=0;
  (function go(){
    if(ambKey!==key) return;                    // 中途換關就放棄，不要疊上去
    // decodeBank 要在迴圈**裡面**叫：開發模式下音效包可能還在路上，
    // 只叫一次的話那一次會空手而回，這一關就永遠沒有環境音。
    // 重複呼叫是安全的（已經在解的話 SBUF[k] 已存在，會直接返回）
    decodeBank(key);
    var e=SBUF[key]&&SBUF[key][0];
    if(!e||!e.buf){ if(tries++<80) setTimeout(go,120); return; }
    var s=AC.createBufferSource(); s.buffer=e.buf; s.loop=true;
    var node=s;
    for(var si=0; lp && si<stages; si++){
      var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp;
      node.connect(f); node=f;
    }
    var g=AC.createGain(); g.gain.value=0.0001; node.connect(g); g.connect(ambBus);
    try{ g.gain.exponentialRampToValueAtTime(Math.max(0.002,vol),AC.currentTime+2.0); }
    catch(err){ g.gain.value=vol; }
    s.start(); ambSrc=s; ambGain=g;
  })();
}
// 兩條匯流排的音量。調參面板拉滑桿時直接呼叫，環境音正在響也會立刻跟著變
function applyMix(){
  if(!AC) return;
  if(sfxBus) sfxBus.gain.value=TUNE.sfxVol;
  if(ambBus) ambBus.gain.value=TUNE.ambVol;
}
// ---- 心跳 ----
// 素材是整數四拍，所以直接循環不會偏拍。血少的時候淡入，越少越快、越大聲。
// 這是遊戲裡唯一一個「不是從場景來的聲音」——它在你的耳朵裡，不在世界裡
var hbSrc=null, hbGain=null, hbNow=0;
function heartUpdate(dt){
  if(!AC||!ambBus) return;
  var want=0;
  if(S.phase==='run' && !TUNE.god && S.hp<48) want=Math.min(1,(48-S.hp)/38);
  hbNow += (want-hbNow)*Math.min(1,dt*1.6);
  if(hbNow>0.02 && !hbSrc){
    decodeBank('heartbeat');
    var e=SBUF.heartbeat&&SBUF.heartbeat[0];
    if(e&&e.buf){
      var s=AC.createBufferSource(); s.buffer=e.buf; s.loop=true;
      var g=AC.createGain(); g.gain.value=0.0001;
      s.connect(g); g.connect(ambBus); s.start();
      hbSrc=s; hbGain=g;
    }
  }
  if(hbSrc){
    hbGain.gain.value=Math.max(0.0001,hbNow*0.55*TUNE.hbVol);
    hbSrc.playbackRate.value=0.92+0.55*hbNow;
    if(hbNow<=0.02){ try{hbSrc.stop();}catch(e){} hbSrc=null; hbGain=null; }
  }
}
function heartStop(){ hbNow=0; if(hbSrc){ try{hbSrc.stop();}catch(e){} hbSrc=null; hbGain=null; } }

// 喪屍的聲音：遠的悶、近的清楚，左右耳定位
var lastIdleVoice=0;
function voice(bank,idx,vol,pan,rate){
  if(!AC||vol<=0||!GBUF[bank]) return;
  var arr=GBUF[bank]; var b=arr[idx%(arr.length||1)]; if(!b) return;
  var s=AC.createBufferSource(); s.buffer=b;
  s.playbackRate.value=rate||1;
  var f=AC.createBiquadFilter(); f.type='lowpass';
  f.frequency.value=(bank==='idle'?420:700)+(bank==='idle'?1400:4200)*Math.min(1,vol*2.6);
  var g=AC.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g);
  if(AC.createStereoPanner){var p=AC.createStereoPanner();p.pan.value=pan||0;g.connect(p);p.connect(master);}
  else g.connect(master);
  s.start(); return s;
}
function noise(dur,freq,vol,pan){
  if(!AC||vol<=0)return;
  var len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
  var n=AC.createBufferSource(); n.buffer=buf;
  var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  var g=AC.createGain(); g.gain.value=vol;
  n.connect(f); f.connect(g);
  if(AC.createStereoPanner){var p=AC.createStereoPanner();p.pan.value=pan||0;g.connect(p);p.connect(master);}
  else g.connect(master);
  n.start();
}
function chime(){ if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.frequency.value=660;o.type='triangle';
  g.gain.setValueAtTime(.16,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.4);
  o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+.42);}
// 金屬撞擊：砍到柱子或牆的時候用，跟砍空的風聲完全不一樣
function clang(vol,pan){ if(!snd('hit_metal',{vol:vol*1.15,pan:pan||0,
    rate:0.93+Math.random()*0.16})) return; }
// 玻璃碎裂：誘餌的落點。刻意做得尖銳、傳很遠，眼睛壞掉時要靠它定位。
// near 給 1 是刻意的：碎裂聲的高頻本來就傳得遠，這正是它當誘餌的理由
function smash(vol,pan){ snd('glass',{vol:vol*1.05,pan:pan||0,
  rate:0.95+Math.random()*0.12}); }
// 槍聲：又尖又悶的一聲，尾巴留一點空間的回音。
// 刻意做得比任何一把冷兵器都大聲——槍的代價之一就是它會把整層樓叫醒
// 兩段素材疊起來：gun_pistol_b 是短促的爆音（頭），gun_pistol 是室內的回音（尾）。
// 分兩層而不是找一個「完整」的檔，是因為兩把槍的差別要做得出來——
// 霰彈槍要更低更厚更長，只有分層才調得動
function bang(vol){ vol=vol||1;
  var r=0.97+Math.random()*0.07;                 // 每一發都不完全一樣
  snd('gun_pistol_b',{vol:1.00*vol,rate:r});
  snd('gun_pistol',  {vol:0.55*vol,rate:r*0.99});
}
// 霰彈槍：比手槍更低、更厚、尾巴拖更長的一聲。
// 聲音的差別本身就是資訊——後期眼睛壞掉時，玩家是靠耳朵在確認自己拿的是哪一把
function boom(vol){ vol=vol||1;
  // rate 壓到 0.9 附近：同一批素材放慢就會變低變厚變長，
  // 這是讓它跟手槍拉開距離最直接的一刀
  snd('gun_sg',{vol:1.10*vol,rate:0.88+Math.random()*0.05});
}
// 泵動：喀—啦兩聲金屬滑動
function pump(){ snd('sg_pump',{vol:0.85,rate:0.96+Math.random()*0.10}); }
// 一發霰彈推進彈倉。一發一發填的時候會一直聽到這個，
// 那個節奏本身就是「我現在很脆弱」的計時器
function shellIn(){ snd('shell_in',{vol:0.85,rate:0.96+Math.random()*0.10}); }
// 空槍的「喀」。這一聲要能一聽就懂，不然玩家會以為是按鈕沒反應
// ---- 涉水 ----
// **這一關真正的新東西是聲音，不是場景。** 沒有腳步聲，玩家只知道「右邊有東西」，
// 沒辦法追蹤它走到哪；有了腳步聲，耳朵才變成可用的感官，
// 「聽聲辨位比看更可靠」這件事才成立。
// 每一步都走 panOf 做距離衰減與左右定位——跟玻璃瓶碎裂聲同一條路。
// 踩進水裡的聲音。用 bandpass 掃頻做——水花的特徵是**共振點很快往上跑再散掉**，
// 單純的 lowpass 白噪音聽起來只會像「噗」，不像水。
// near 是「有多近」（0~1），近的明亮、遠的悶——距離感主要靠這個，不是只靠音量。
// 現在只剩滴水聲在用（**沒有對應素材的就留著合成音**，硬拿腳步聲當滴水
// 只會聽成「有人在旁邊踩水」，那會把 Day 5 的聽聲辨位整個弄髒）
function splash(vol,pan,big,near){
  if(!AC||vol<=0) return;
  var nr=(near===undefined)?1:Math.max(0,Math.min(1,near));
  var dur=big?.34:.22;
  var len=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,len,AC.sampleRate),
      d=buf.getChannelData(0);
  for(var i=0;i<len;i++){
    var e=1-i/len;
    d[i]=(Math.random()*2-1)*Math.pow(e,big?2.6:3.4);
  }
  var n=AC.createBufferSource(); n.buffer=buf;
  var bp=AC.createBiquadFilter(); bp.type='bandpass';
  bp.Q.value=big?1.1:1.6;
  // 掃頻：起點低、很快往上、再落下來。遠的聲音上限低很多（空氣把高頻吃掉了）
  var top=(big?2600:3400)*(0.28+0.72*nr);
  bp.frequency.setValueAtTime(top*0.35,AC.currentTime);
  bp.frequency.exponentialRampToValueAtTime(top,AC.currentTime+dur*0.18);
  bp.frequency.exponentialRampToValueAtTime(top*0.28,AC.currentTime+dur);
  var lp=AC.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value=500+4200*nr*nr;              // 遠的整個悶掉
  var g=AC.createGain(); g.gain.value=vol*(big?.85:.62);
  n.connect(bp); bp.connect(lp); lp.connect(g);
  if(AC.createStereoPanner){var pp=AC.createStereoPanner();pp.pan.value=pan||0;g.connect(pp);pp.connect(master);}
  else g.connect(master);
  n.start();
  // 底下墊一層低頻的「咚」，走近的時候才聽得到
  if(nr>0.35) noise(big?.20:.13, 260, vol*(big?.30:.16)*nr, pan||0);
}
// 空槍的「喀」。這一聲要能一聽就懂，不然玩家會以為是按鈕沒反應
function clickDry(){ snd('dry_fire',{vol:0.85,rate:0.95+Math.random()*0.12}); }

// ---- 腳步 ----
// 素材依表面分開：室內、硬地、水。**玩家與喪屍用不同的素材組**，
// 不然近距離時「這是我自己的腳步還是牠的」會分不出來——
// 而那正是這個遊戲最需要玩家分得出來的一件事。
//   玩家：step_in（室內）／step_conc（室外硬地）／step_water（Day 5）
//   喪屍：step_drag（拖著走）／step_conc_b（跑起來）／step_water（Day 5）
function surfacePlayer(){ return (S.day===5)?'step_water':((S.day===1||S.day===3)?'step_in':'step_conc'); }
function stepPlayer(vol,pan,run){
  snd(surfacePlayer(),{vol:vol*TUNE.stepVol,pan:pan||0,
                       rate:(run?1.06:0.96)+Math.random()*0.10});
}
function stepZombie(vol,pan,near,run){
  if(S.day===5) snd('step_water',{vol:vol*1.2*TUNE.zStepVol,pan:pan,near:near,
                                  lpLo:520,lpHi:7000,rate:0.94+Math.random()*0.12});
  else if(run)  snd('step_conc_b',{vol:vol*1.15*TUNE.zStepVol,pan:pan,near:near,
                                  lpLo:400,lpHi:6500,rate:0.96+Math.random()*0.12});
  // 拖行只用前四段：step_drag_5 是 0.6 秒的低頻悶響，跟其他四段的
  // 「踩一步再拖」完整循環根本是兩種東西，混進來會變成每五次有一次只有一聲悶的。
  // **低通的下限拉到 900 Hz**：500 Hz 以下人耳幾乎判斷不出方向（那是物理），
  // 原本 360 Hz 的下限等於把遠處喪屍的方向資訊整個濾掉了
  else          snd('step_drag',  {vol:vol*1.35*TUNE.zStepVol,pan:pan,near:near,pool:4,
                                  lpLo:900,lpHi:7000,rate:0.94+Math.random()*0.10});
}
// 把世界座標換成「音量 + 左右」，聽聲辨位全部走這裡
function panOf(x,z,ref){
  var dx=x-camera.position.x, dz=z-camera.position.z;
  var d=Math.hypot(dx,dz);
  var rel=Math.atan2(dx,dz)-yaw;
  return {d:d, pan:Math.max(-1,Math.min(1,-Math.sin(rel))),
          vol:Math.max(0,1-d/(ref||22))};
}

                     // 美術拉皮等於替整個場景加了一層以前不存在的光。
                     // 這個值可以單獨把那一層收掉（0 = 完全沒有高光，回到 Lambert 的感覺），
                     // 用來分辨「變亮」是來自高光還是來自逐片元的光錐
  lampFlick:0.26,    // 燈的閃爍幅度，**比例制**（0.26 = 上下各 26%，0 = 完全不閃）。
                     // 舊版是絕對值 0.30，換算成相對擺幅是 22%~33% 不等；
                     // 0.26 落在中間，所以整體感覺跟舊版接近，只是各關一致了
  allLamps:false,    // 診斷用：停車場的燈全部是好的（正常每盞有機率壞掉）
  noNormal:false,    // 診斷用：關掉程序化材質的法線貼圖（Day 4 全黑時先按這個）
  zFlash:0.10,       // 受擊閃光的強度（emissive，加上去的光，不受場景亮度影響）
  zFlashSpd:4.20,    // 閃光退掉的速度。太慢會變成「一直是紅的」

  zIdleAmp:0.30,     // 晃動幅度

  d4Spawn:5,         // 停車場最多再補生幾隻（開場已有兩隻）
  // ---- Day 6 醫院外圍 ----
  // 「來得及」的門檻。**2026-09 已用六關的實測時間校準定案**（不再是暫定值）。
  // 校準的做法：把每一種病的 day1/day4 調到「一般玩法（讀完、打完、不衝刺）
  // 走完六關剛好落在 0.88」，五種病都對齊到同一個終點。
  // 門檻放 0.94，所以走完之後還要再被打中頭這麼多次才會來不及：

  // 作者的要求是「保持罕見」，而且**最容易來不及的是剝離**——
  // 那是五種病裡唯一真正的急症，這個排序本身就是衛教。
  inTime:0.94,

  // 尺度與亮度這兩件事我在這裡算不準，只有真機說了算，所以做成可拉的
  handScale:1.00, handBright:0.49, handShine:6,
  d6Zomb:6,          // Day 6 全關的喪屍總數（定點，不補生）
  d6Gate:2.4,        // 撬開圍籬要按住幾秒
  d6GatePad:1.15,    // 門還鎖著時，喪屍要離門板多遠（防止伸手穿過薄門片）
  zStop:0.62,        // 薄板（圍籬、門片）額外的**硬**碰撞邊界，只對喪屍生效。

  lampDead:0.30,     // 停車場每盞燈壞掉的機率。連續兩盞不會同時壞（見 buildDay4）
  tapFire:true,      // 手機：輕點右半螢幕就開槍（拇指不用離開瞄準區）
  gunLook:0.72,      // 拿槍時的轉頭靈敏度倍率——慢一點才瞄得準
  muzzAmp:1.00,      // 槍口致盲的強度

  torchInt:1.90,     // 開著時的光強度（以前 Day 4 白送的是 1.50，常亮）

  torchWalk:0.18,    // 走路的晃幅（隨腳步上下）
  torchRun:0.95,     // 衝刺的晃幅——要晃到幾乎照不穩，呼應「跑起來就看不清」
  torchSwing:1.45,   // 右手揮擊時光束往反方向甩多遠

  sfxVol:1.00,       // 所有短音效的總音量

// ---- 模型資產：單一 GLB，內含骨架與六段動作 ----
var ZTPL=null, ZCLIPS={}, ZREADY=false;

// 有些環境會擋掉 blob: 的 fetch，暫時關閉 createImageBitmap 可改走 <img> 路徑
function parseGLB(ab,ok,err){
  var saved=window.createImageBitmap;
  try{ window.createImageBitmap=undefined; }catch(e){}
  function restore(){ try{ window.createImageBitmap=saved; }catch(e){} }
  try{
    new THREE.GLTFLoader().parse(ab,'',
      function(g){ restore(); ok(g); },
      function(e){ restore(); err(e); });
  }catch(e){ restore(); err(e); }
}

// 最後手段：把貼圖從 GLB 中拆掉，只留幾何與骨架
function stripTextures(ab){
  var dv=new DataView(ab);
  var jsonLen=dv.getUint32(12,true);
  var json=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,20,jsonLen)));
  delete json.images; delete json.textures; delete json.samplers;
  (json.materials||[]).forEach(function(m){
    var p=m.pbrMetallicRoughness||(m.pbrMetallicRoughness={});
    delete p.baseColorTexture; delete p.metallicRoughnessTexture;
    p.baseColorFactor=[0.40,0.44,0.38,1];
    delete m.normalTexture; delete m.occlusionTexture; delete m.emissiveTexture;
  });
  var js=JSON.stringify(json);
  while(js.length%4) js+=' ';
  var jb=new TextEncoder().encode(js);
  var binOff=20+jsonLen, binLen=dv.getUint32(binOff,true);
  var total=12+8+jb.length+8+binLen;
  var out=new ArrayBuffer(total), o=new DataView(out), u=new Uint8Array(out);
  o.setUint32(0,0x46546C67,true); o.setUint32(4,2,true); o.setUint32(8,total,true);
  o.setUint32(12,jb.length,true); o.setUint32(16,0x4E4F534A,true);
  u.set(jb,20);
  o.setUint32(20+jb.length,binLen,true); o.setUint32(24+jb.length,0x004E4942,true);
  u.set(new Uint8Array(ab,binOff+8,binLen),28+jb.length);
  return out;
}

function adopt(g){
  ZTPL=g.scene;
  ZTPL.traverse(function(o){ if(o.isMesh||o.isSkinnedMesh) o.frustumCulled=false; });
  g.animations.forEach(function(c){
    c.tracks.forEach(function(tr){
      if(tr.name.indexOf('Hips')>=0 && tr.name.indexOf('.position')>=0){
        var v=tr.values; for(var k=0;k<v.length;k+=3){ v[k]=v[0]; v[k+2]=v[2]; }
      }
    });
    ZCLIPS[c.name]=c;
  });
  ZREADY=true;
}
// 取得模型的位元組。發佈模式是 base64 解碼（同步），開發模式是抓網址（非同步）。
// 兩條路都經由 ok(ArrayBuffer) 交出去，所以下面解析的部分不用分岔。
function zombieBytes(ok,err){
  if(A_MODE==='embed'){
    log('模型資料：<b>'+Math.round(ASSETS.zombie.length/1024)+' KB</b> base64（內嵌）');
    var t0=Date.now();
    try{
      var bin=atob(ASSETS.zombie),len=bin.length,buf=new Uint8Array(len);
      for(var i=0;i<len;i++) buf[i]=bin.charCodeAt(i);
      log('解碼完成：'+Math.round(len/1024)+' KB，耗時 '+(Date.now()-t0)+' ms','ok');
      ok(buf.buffer);
    }catch(e){ err(e); }
    return;
  }
  var url=A_BASE+ASSETS.zombie, t1=Date.now();
  log('模型資料：從 <b>'+url+'</b> 下載');
  fetch(url).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.arrayBuffer();
  }).then(function(ab){
    log('下載完成：'+Math.round(ab.byteLength/1024)+' KB，耗時 '+(Date.now()-t1)+
        ' ms'+(Date.now()-t1<60?'（快取）':''),'ok');
    ok(ab);
  }).catch(function(e){ err(e); });
}
