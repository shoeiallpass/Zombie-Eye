// Mixamo 的骨骼在 GLTFLoader 裡會被改名（冒號會被拿掉），所以用結尾比對，
// 兩種寫法都吃得到。找不到就回傳 null，程式其他地方要能接受沒有骨骼的情況
function findBone(g,suffix){
  var r=null, re=new RegExp(suffix+'$','i');
  g.traverse(function(o){ if(!r && (o.isBone||o.type==='Bone') && re.test(o.name)) r=o; });
  return r;
}
// 待機時的垂頭與微晃。
// **Mixamo 的 idle 是給活人用的**——站得很直、幾乎不動，套在喪屍身上就是一塊立牌。
// 我們沒有第七段動畫素材，所以改成在動畫之上再疊一層程序化的動作：
// 頭往下垂、上半身很慢地左右晃、重心輕微上下浮，三個週期刻意不同步，
// 那個「對不齊」才是活體跟立牌的差別。
//
// 疊加而不是換動畫的另一個好處：走路、攻擊時只要把權重降到 0，
// 不用處理動畫之間的切換與淡入淡出。
//
// 軸向是量過的：這副骨架在靜止姿勢下，Head / Neck / Spine 的區域座標
// 跟世界座標完全對齊，而模型面向 +Z——所以**繞 X 軸轉正值就是低頭**。
function idleSway(z,dt,t){
  if(!z.mixer) return;
  var want=(z.dead||z.busy>0||z.stagger>0)?0:(z.idleWant||0);
  z.idleAmt=(z.idleAmt===undefined?want:z.idleAmt);
  z.idleAmt+=(want-z.idleAmt)*Math.min(1,dt*3.5);      // 淡入淡出，不然切換會一頓
  var a=z.idleAmt;
  if(a<0.01) return;
  if(z.bHead===undefined){
    z.bHead=findBone(z.g,'Head')||null;
    z.bNeck=findBone(z.g,'Neck')||null;
    z.bSpine=findBone(z.g,'Spine1')||findBone(z.g,'Spine')||null;
  }
  var ph=z.voice*1.7+z.rate*3.1;                       // 每一隻的相位都不一樣
  var A=TUNE.zIdleAmp, sp=TUNE.zIdleSpd;
  // 垂頭：脖子承擔大部分，頭再補一點——只轉頭會像頭掉下來，脖子沒動
  if(z.bNeck){
    z.bNeck.rotation.x+=a*TUNE.zDroop*0.62;
    z.bNeck.rotation.y+=a*A*0.55*Math.sin(t*0.41*sp+ph);
    z.bNeck.rotation.z+=a*A*0.40*Math.sin(t*0.29*sp+ph*1.7);
  }
  if(z.bHead){
    z.bHead.rotation.x+=a*TUNE.zDroop*0.38;
    z.bHead.rotation.y+=a*A*0.75*Math.sin(t*0.33*sp+ph*0.6);
    z.bHead.rotation.z+=a*A*0.50*Math.sin(t*0.47*sp+ph*2.3);
  }
  // 上半身：慢一點、幅度小一點。這是「站不太穩」而不是「在跳舞」
  if(z.bSpine){
    z.bSpine.rotation.z+=a*A*0.45*Math.sin(t*0.23*sp+ph*1.3);
    z.bSpine.rotation.x+=a*A*0.30*Math.sin(t*0.19*sp+ph*0.9);
  }
  // 重心的上下浮動。**週期跟上面三個都不一樣**，對齊了就會看出是程式在動
  z.g.position.y=a*A*0.09*Math.sin(t*0.61*sp+ph*1.1);
}

function playClip(z,name,fade){
  if(!z.mixer||!z.acts[name]||z.cur===name) return;
  var prev=z.acts[z.cur];
  z.acts[name].reset().setEffectiveWeight(1).fadeIn(fade===undefined?0.22:fade).play();
  if(prev) prev.fadeOut(fade===undefined?0.22:fade);
  z.cur=name;
}

function makeZombie(x,z,speed,hp){
  var g,mats=[],arms=[],mixer=null,acts={};
  if(ZREADY&&ZTPL&&THREE.SkeletonUtils){
    g=THREE.SkeletonUtils.clone(ZTPL);
    g.traverse(function(o){
      if(o.isMesh||o.isSkinnedMesh){
        o.material=o.material.clone();          // 每隻一份，受擊變色才不會互相影響
        o.material.color.multiplyScalar(0.94);
        o.material.userData.base=o.material.color.clone();
        // 受擊閃光是用 emissive 做的，所以原始值也要留一份（見 hurtZombie）
        if(o.material.emissive) o.material.userData.emiBase=o.material.emissive.clone();
        mats.push(o.material);
      }
    });
    mixer=new THREE.AnimationMixer(g);
    ['idle','walk','run','attack','death','scream'].forEach(function(nm){
      if(ZCLIPS[nm]) acts[nm]=mixer.clipAction(ZCLIPS[nm]);
    });
    if(acts.death){ acts.death.setLoop(THREE.LoopOnce,1); acts.death.clampWhenFinished=true; }
    if(acts.attack){ acts.attack.setLoop(THREE.LoopOnce,1); acts.attack.clampWhenFinished=true; }
    if(acts.scream){ acts.scream.setLoop(THREE.LoopOnce,1); acts.scream.clampWhenFinished=true; }
  } else {
    g=new THREE.Group();
    var part=function(geo,pos,rot){
      var m=new THREE.MeshLambertMaterial({color:0x4a5347});
      m.userData.base=m.color.clone();
      if(m.emissive) m.userData.emiBase=m.emissive.clone();
      var o=new THREE.Mesh(geo,m);o.position.set(pos[0],pos[1],pos[2]);
      if(rot)o.rotation.set(rot[0],rot[1],rot[2]);g.add(o);mats.push(m);return o;};
    part(new THREE.CylinderGeometry(.24,.3,1.15,10),[0,.98,0]);
    part(new THREE.SphereGeometry(.2,12,10),[0,1.72,0]);
    [-1,1].forEach(function(s){
      arms.push(part(new THREE.CylinderGeometry(.075,.065,.82,8),[s*.30,1.28,.22],[-1.15,0,0]));
      part(new THREE.CylinderGeometry(.1,.085,.85,8),[s*.13,.42,0]);});
  }
  g.position.set(x,0,z); level.add(g);
  var o={g:g,mats:mats,arms:arms,mixer:mixer,acts:acts,cur:null,
         hp:hp||100,speed:speed||1.15,stagger:0,cd:1.4,dead:0,
         growl:Math.random()*2,hesitate:0,busy:0,swungAt:0,
         side:Math.random()<.68?1:-1,
         voice:Math.floor(Math.random()*4),rate:0.88+Math.random()*0.26,
         alert:false,freeze:3.0,
         lureT:0,lureX:0,lureZ:0,dodge:0,dodgeSide:1};
  zs.push(o);
  if(mixer) playClip(o,'idle',0);
  return o;
}

var BASECOL=new THREE.Color(0x4a5347);
var FLASHC=new THREE.Color(0xff9a86);          // 受擊時 color 要往「比原色亮」的方向拉
var fwd=new THREE.Vector3(),right=new THREE.Vector3(),tmp=new THREE.Vector3(),
    tmp2=new THREE.Vector3(),want=new THREE.Vector3(),UPV=new THREE.Vector3(0,1,0);

function updateZombie(z,n,dt,t){
  if(z.mixer) z.mixer.update(dt);
  // ---- 受擊閃光 ----
  // 原本是把 color 設成 0x9a5a4a 再淡回去。問題是**那個顏色比模型本身還暗**：
  // 模型的底色是 0.8 灰再乘 0.94 ≈ 0.75，而 0x9a5a4a 的紅色通道只有 0.60，
  // 三個通道全部比底色低——所以打下去不是「閃一下紅」，是「暗了一下、偏褐」。
  // 在 Day 1 那種明亮的房間裡，那個變化幾乎看不見。
  //
  // 改用 **emissive**（自體發光）：它是加上去的，不受場景亮度影響，
  // 所以在早上的公寓和全黑的隧道裡強度一樣。color 也一起往比底色更亮的方向拉一點。
  if(z.flash>0 || z.flashOn){
    z.flash=Math.max(0,(z.flash||0)-dt*TUNE.zFlashSpd);
    var ff=z.flash; z.flashOn=(ff>0.004);
    z.mats.forEach(function(m){
      var b=m.userData.base||BASECOL;
      m.color.copy(b).lerp(FLASHC,ff*0.85);
      if(m.emissive){
        var e=m.userData.emiBase, k=ff*TUNE.zFlash;
        m.emissive.setRGB((e?e.r:0)+k, (e?e.g:0)+k*0.10, (e?e.b:0)+k*0.06);
      }
    });
  }

  // ---- 側管裡的休眠（Day 5）----
  // **牠站在支管裡不動，但一直在出聲。** 玩家因此可以先站著聽、
  // 判斷有幾隻、在哪一邊，再決定要不要開燈或換槍——
  // 那一刻就是「聽覺補償」真正被使用的時候。
  // 走太近、或聽到槍聲／涉水聲，牠才醒。
  if(z.dorm && !z.dead){
    var ddx=camera.position.x-z.g.position.x, ddz=camera.position.z-z.g.position.z;
    var dw=Math.hypot(ddx,ddz);
    z.g.rotation.y+=Math.sin(t*0.7+z.voice)*dt*0.25;      // 只是輕輕晃，不移動
    z.dormT=(z.dormT||Math.random()*3)-dt;
    if(z.dormT<=0){
      z.dormT=2.2+Math.random()*3.4;
      var pd=panOf(z.g.position.x,z.g.position.z,26);
      if(pd.vol>0.02){
        voice('idle',z.voice,.55*pd.vol,pd.pan,z.rate*0.94);
        snd('step_water',{vol:pd.vol*pd.vol*1.5,pan:pd.pan,near:pd.vol,
                          lpLo:520,lpHi:7000,rate:0.88});   // 在水裡挪了一下腳
      }
    }
    // 醒來前先有一個「牠動了」的預告：出一次比較大的聲、停半秒再走出來。
    // 直接從靜止切成撲擊，玩家只會覺得是跳出來嚇人，不是他自己走太近
    if(z.stir===undefined && (dw<TUNE.dormWake+2.2 || z.alert)){
      z.stir=0.65;
      voice('idle',z.voice,.95,panOf(z.g.position.x,z.g.position.z,20).pan,z.rate*0.88);
      snd('step_water',{vol:0.70,pan:panOf(z.g.position.x,z.g.position.z,20).pan,
                        near:0.85,rate:0.86});
    }
    z.idleWant=1; idleSway(z,dt,t);      // 站著不動的那一隻最需要，不然就是一塊立牌
    if(z.stir>0){ z.stir-=dt; return; }
    if(dw<TUNE.dormWake || z.alert || z.stir<=0){
      z.dorm=false; z.alert=true;
      // 先走到管口（主管中線那一側），再開始追玩家
      if(z.pipeZ!==undefined){ z.wayX=z.pipeSide*(S.tunR-0.55); z.wayZ=z.pipeZ; z.wayT=6; }
      voice('idle',z.voice,.85,0,z.rate*1.1);
      snd('step_water',{vol:0.95,pan:0,near:1,rate:0.84});  // 踏出來的第一步，聲音大一點
    }
    else return;                                          // 還沒醒：不動、不攻擊（姿態上面已經處理）
  }

  if(z.dead){
    z.dead+=dt; z.idleWant=0; z.g.position.y=0;
    if(z.mixer){ playClip(z,'death',0.15); }
    else{
      z.g.rotation.x=-Math.min(Math.PI/2,z.dead*3.5);
      z.g.position.y=-Math.min(.35,z.dead*.66);
    }
    if(z.dead>4.2){
      if(z.mixer) z.mixer.stopAllAction();
      level.remove(z.g); zs.splice(n,1);
    }
    return;
  }

  tmp.subVectors(camera.position,z.g.position); tmp.y=0;
  var dist=tmp.length();
  // ---- 誘餌：聲音會蓋過玩家，成為暫時的目標 ----
  var lured=false, lureD=0;
  if(z.lureT>0 && S.phase==='run' && !TUNE.pause){
    z.lureT-=dt;
    lureD=Math.hypot(z.lureX-z.g.position.x, z.lureZ-z.g.position.z);
    lured=true;
  }
  if(lured && lureD>0.7)
    z.g.rotation.y=Math.atan2(z.lureX-z.g.position.x, z.lureZ-z.g.position.z);
  else
    z.g.rotation.y=Math.atan2(tmp.x,tmp.z);
  if(z.dodge>0){                                 // 「差一點」被砍到時的側身
    z.dodge-=dt;
    // 這裡以前也是直接寫座標，一樣沒有碰撞——側身閃避可以把牠推進牆裡
    zMove(z, right.x*z.dodgeSide*1.9*dt, right.z*z.dodgeSide*1.9*dt);
  }
  z.stagger=Math.max(0,z.stagger-dt);
  z.hesitate=Math.max(0,z.hesitate-dt);
  z.busy=Math.max(0,z.busy-dt);

  tmp2.copy(tmp).multiplyScalar(-1).normalize();
  var looked = tmp2.dot(fwd) > 0.90 && dist > 4.5;

  // 一旦被驚動就不再假裝靜止，會一路追到底
  if(!z.alert && !lured && (dist<9 || z.hp<100)) {
    z.alert=true;
    if(dist<13) voice('attack',(z.voice+1)%4,.42,0,z.rate*0.92);
  }
  // 潛行的額度有限，用完就算被盯著也會繼續逼近
  if(!z.alert && looked && z.freeze>0) z.freeze-=dt;
  else if(!looked) z.freeze=Math.min(3.0,z.freeze+dt*0.4);
  var observed = !z.alert && looked && z.freeze>0;

  // ---- 攻擊：先有預備動作，傷害落在動作中段，格擋才有意義 ----
  // **中間有東西擋著就不能揮。**
  // 這是「近戰穿過柱子打到人」那個坑的**反面**：當時只修了玩家這一側，
  // 喪屍這一側從來沒有加過 losBlocked，只是關卡裡很少把喪屍擺在薄牆邊，
  // 所以一直沒被發現——直到 Day 6 的圍籬門。
  // 作者看到的是「手穿過門」，但真正的問題是**牠隔著門真的扣得到血**。
  // 加上這一條之後，Day 4 的柱子、Day 3 的貨架、Day 6 的圍籬全部一起修好
  var losOK=!losBlocked(z.g.position.x,z.g.position.z,camera.position.x,camera.position.z);
  if(dist<TUNE.zReach && z.cd<=0 && z.stagger<=0 && S.phase==='run' && z.busy<=0 && losOK){
    // 傷害時間點跟著攻擊動畫的長度算，落在動作揮出去的那一段，
    // 而不是固定 0.42 秒——固定值會落在舉手預備的階段，看起來像還沒打到就扣血
    var adur=(z.acts&&z.acts.attack&&z.acts.attack.getClip())?z.acts.attack.getClip().duration:1.05;
    z.cd=2.0; z.busy=adur; z.swungAt=t+adur*TUNE.hitFrac;
    if(z.mixer){ z.acts.attack && z.acts.attack.reset(); playClip(z,'attack',0.10); }
    voice('attack',z.voice,.60,0,z.rate*1.06);
  }
  if(z.swungAt>0 && t>=z.swungAt){
    z.swungAt=0;
    // **傷害落點要重新判定一次，不能只看它有沒有揮**。
    // 喪屍舉手到揮到大約 0.65 秒，玩家退一步就已經超出手臂長度了，
    // 但畫面上手還是揮過去、血還是扣——玩家會判斷成「延遲」而不是「我沒躲掉」。
    // 三個條件缺一不可：距離還在手臂內、它還面對著你、而且沒有被打斷。
    var faceOK=true;
    tmp2.subVectors(camera.position,z.g.position); tmp2.y=0;
    if(tmp2.lengthSq()>1e-6){ tmp2.normalize();
      faceOK=(Math.sin(z.g.rotation.y)*tmp2.x+Math.cos(z.g.rotation.y)*tmp2.z)>TUNE.zHitArc; }
    // 落點也要再檢查一次視線：揮到一半你躲到柱子後面，那一下就該落空
    if(dist<TUNE.zHitR && faceOK && losOK && z.stagger<=0 && S.phase==='run')
      hurt(TUNE.zDmg,Math.random()<0.45);
    else if(S.phase==='run'){
      // 躲掉了要聽得出來。沒有聲音的話「我躲掉了」跟「它本來就沒打中」分不出來
      var pn=panOf(z.g.position.x,z.g.position.z,7);
      noise(.13,760,.22*pn.vol,pn.pan);
    }
  }
  z.cd-=dt;

  var moving=false;
  if(S.phase==='run' && z.stagger<=0 && z.busy<=0 && (lured ? lureD>0.7 : dist>1.30)){
    if(z.wayT>0){
      // **剛從側管醒過來的，要先走到管口再說。**
      // 不給這個路徑點的話，牠會直接朝玩家走——而側管的牆不是碰撞箱，
      // 所以牠會從牆裡穿出來，看起來像憑空蹦出來，不像從管子裡走出來。
      z.wayT-=dt;
      var wdx=z.wayX-z.g.position.x, wdz=z.wayZ-z.g.position.z;
      if(wdx*wdx+wdz*wdz<0.55) z.wayT=0;
      else want.set(z.wayX,0,z.wayZ);
    }
    else if(lured){
      want.set(z.lureX,0,z.lureZ);
    } else {
      var flank=Math.min(1,Math.max(0,(dist-2.6)/6));
      var ring=Math.min(dist*0.6,3.4);
      want.copy(camera.position)
          .addScaledVector(right, z.side*ring*0.95*flank)
          .addScaledVector(fwd,  -ring*0.25*flank);
    }
    want.y=0;
    tmp2.subVectors(want,z.g.position); tmp2.y=0;
    if(tmp2.length()<0.3) tmp2.copy(lured?tmp2:tmp);
    tmp2.normalize();
    for(var k=0;k<zs.length;k++){
      if(k===n||zs[k].dead)continue;
      var dx=z.g.position.x-zs[k].g.position.x, dz=z.g.position.z-zs[k].g.position.z;
      var dd=Math.hypot(dx,dz);
      if(dd<1.5&&dd>0.01){ tmp2.x+=dx/dd*0.7; tmp2.z+=dz/dd*0.7; }
    }
    // 避開場景物件。**這裡的邊界不能給太寬**：`solids` 的 hw/hd 本來就已經
    // 幫玩家多留了 0.35，喪屍再加 0.5 等於離箱子 0.85 公尺就被推開——
    // 藥局兩側 1.85 公尺寬的走道，喪屍會被兩邊同時推著進不去，
    // 玩家就可以站在那條窄走道裡安全輸出。實測回報就是這件事。
    // 改成：邊界縮小，而且推力**隨接近程度**長大，走道中間完全不推。
    for(var s=0;s<solids.length;s++){
      var o=solids[s];
      var ox=z.g.position.x-o.x, oz=z.g.position.z-o.z;
      var mx=Math.abs(ox)-o.hw, mz=Math.abs(oz)-o.hd;
      // 每個碰撞箱可以自己要求更大的閃避距離（zpad）。
      // 預設 TUNE.zAvoid 是為了「擠得進窄走道」調的，很小——
      // 對厚牆沒問題，但對**薄板**（圍籬、門片）不夠：喪屍會停在離板面
      // 三四十公分的地方，而牠伸手的動畫比那還長，手就穿出去了。
      // 薄板由關卡自己標 zpad，不動全域值（動全域值會讓喪屍擠不進走道）
      var AV=o.zpad||TUNE.zAvoid;
      if(mx<AV && mz<AV){
        var deep=Math.max(0,(AV-Math.max(mx,mz))/AV);      // 0 = 剛好在邊界，1 = 已經在箱子裡
        var mm=Math.hypot(ox,oz)||1;
        tmp2.x+=ox/mm*1.35*deep; tmp2.z+=oz/mm*1.35*deep;
      }
    }
    // 卡在凹角時暫時改走切線方向（把想走的方向轉 90 度），繞出去之後就恢復
    if(z.slideT>0){ z.slideT-=dt;
      var sx=tmp2.x, sz=tmp2.z; tmp2.x=-sz*z.slide; tmp2.z=sx*z.slide; }
    tmp2.y=0; tmp2.normalize();
    var sp=z.speed*TUNE.zSpeed*(observed&&!lured?0.20:1)*(z.hesitate>0&&!lured?0.25:1);
    if(!lured && !observed && z.hesitate<=0 && !z.alert && Math.random()<0.12*dt) z.hesitate=0.5+Math.random();
    zMove(z,tmp2.x*sp*dt,tmp2.z*sp*dt);      // 以前是 addScaledVector，完全沒有碰撞
    moving = sp>0.25;
    // 喪屍的腳步。Day 5 是水聲，其餘關卡是悶悶的踩地聲——
    // 聲音的差別本身就是資訊，玩家靠它判斷「牠在哪、走多快」
    if(moving){
      // 走路用的是「踩一步再拖一下」的完整循環（約 1.8 秒），所以間隔要跟著素材走；
      // 跑起來換成硬地的快步，維持原本的快節奏。
      // **兩者的節奏差別本身就是資訊**——玩家不用看就知道牠開始跑了
      var run=(sp>2.0);
      z.stepT=(z.stepT||0)-dt*(run?2.9:0.52);
      if(z.stepT<=0){
        // **不能太規律**：真的腳步是一輕一重、間隔也不齊。
        // 完全等距的節拍聽起來像節拍器，不像有人在走
        z.stepOdd=!z.stepOdd;
        z.stepT=(z.stepOdd?1.12:0.88)*(0.88+Math.random()*0.24);
        var pf=panOf(z.g.position.x,z.g.position.z,S.day===5?20:14);
        // **距離感不能用線性音量**。1−d/20 在 10 公尺處還有一半音量，
        // 聽起來就是「一直都那麼大聲」。改成三次方，而且用 near 去暗化音色——
        // 遠的悶、近的亮，這比音量更能讓人判斷「牠在靠近」
        var nr=pf.vol*pf.vol*pf.vol;
        var lv=(z.stepOdd?1:0.72)*nr;              // 一輕一重
        if(lv>0.01) stepZombie(lv,pf.pan,pf.vol,run);
      }
    }
    if(bounds){
      z.g.position.x=Math.max(bounds[0]+.5,Math.min(bounds[1]-.5,z.g.position.x));
      z.g.position.z=Math.max(bounds[2]+.5,Math.min(bounds[3]-.5,z.g.position.z));
    }
  }

  if(z.mixer){
    if(z.busy<=0 && z.stagger<=0){
      if(moving){
        playClip(z, z.speed>2.0?'run':'walk');
        var base=z.speed>2.0?3.2:1.25;
        if(z.acts[z.cur]) z.acts[z.cur].timeScale=Math.max(.5,Math.min(1.8,z.speed/base));
        z.idleWant=0;
      } else { playClip(z,'idle'); z.idleWant=1; }
    }
  } else {
    z.g.position.y=Math.abs(Math.sin(t*3+n))*0.04;
    z.arms.forEach(function(a,ai){a.rotation.x=-1.15+Math.sin(t*3+ai*2)*0.12;});
  }

  z.growl-=dt;
  if(z.growl<=0 && t-lastIdleVoice>2.2){
    z.growl=5.5+Math.random()*6.5;
    lastIdleVoice=t;
    var rel=Math.atan2(tmp.x,tmp.z)-yaw;
    voice('idle', z.voice, Math.max(0,(observed?.16:.40)-dist*.014),
          Math.max(-1,Math.min(1,-Math.sin(rel))), z.rate*(0.92+Math.random()*0.20));
  } else if(z.growl<=0){ z.growl=1.2; }
  // **一定要在 mixer.update 之後**（它在這個函式的第一行），
  // 不然疊上去的角度會在同一格被動畫蓋掉，看起來像完全沒作用
  idleSway(z,dt,t);
  // 腳步聲統一由上面那一組 z.stepT 負責（含距離、左右、一輕一重）。
  // 這裡原本還有一組舊的 z.step，兩組會同時響——聽起來是「腳步很雜」，
  // 其實是同一隻喪屍在放兩套聲音。已移除
}

// ================================================================ 可檢視的物品
// 說明文字一定要畫在 3D 平面上，不能用 HUD。
// 後製 shader 只作用在 3D 畫面，DOM 疊上去的字不會被症狀吃到，
// 那樣「看不清楚說明」就會變成假的。

var LABELS=[];                                  // 字體晚一點載入完要重畫
function labelTex(draw){
  var c=document.createElement('canvas'); c.width=384; c.height=540;   // 畫的時候仍用 512x720 的座標
  var t=new THREE.CanvasTexture(c);
  t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy?renderer.capabilities.getMaxAnisotropy():1;
  function run(){ var x=c.getContext('2d');
    x.setTransform(c.width/512,0,0,c.height/720,0,0);
    draw(x,512,720); t.needsUpdate=true; }
  run(); LABELS.push(run);
  return t;
}
var FONT='"IBM Plex Sans TC","Noto Sans TC",system-ui,sans-serif';
// 逐字換行，中文沒有空白可以斷
function wrap(x,text,maxw){
  var out=[],line='';
  for(var i=0;i<text.length;i++){
    var ch=text.charAt(i);
    if(x.measureText(line+ch).width>maxw&&line){ out.push(line); line=ch; }
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
function frontTex(d){
  return labelTex(function(x,W,H){
    x.fillStyle='#EDE8DF'; x.fillRect(0,0,W,H);
    x.fillStyle=d.band||'#3E6B7A'; x.fillRect(0,0,W,120);
    x.fillStyle='#EDE8DF'; x.font='500 30px '+FONT; x.textBaseline='middle';
    x.fillText(d.brand||'處方藥局', 30, 60);
    x.fillStyle='#1B2124'; x.font='700 62px '+FONT;
    x.fillText(d.front[0], 30, 210);
    x.fillStyle='#39434A'; x.font='400 34px '+FONT;
    for(var i=1;i<d.front.length;i++) x.fillText(d.front[i], 30, 285+(i-1)*46);
    x.strokeStyle='#B9B0A2'; x.lineWidth=2; x.strokeRect(30,470,452,210);
    x.fillStyle='#6B6558'; x.font='400 26px '+FONT;
    x.fillText('翻面有詳細說明', 52, 512);
    for(var j=0;j<7;j++){                          // 假的條碼，讓盒子像盒子
      x.fillStyle='#1B2124';
      x.fillRect(60+j*52, 560, 6+((j*37)%14), 90);
    }
  });
}
function backTex(d){
  return labelTex(function(x,W,H){
    x.fillStyle='#F2EFE9'; x.fillRect(0,0,W,H);
    x.fillStyle='#1B2124'; x.font='700 30px '+FONT; x.textBaseline='top';
    x.fillText('說明', 34, 34);
    x.fillStyle='#20272B'; x.font='400 26px '+FONT;
    var y=88;
    for(var i=0;i<d.back.length;i++){
      var ls=wrap(x,d.back[i],442);
      for(var k=0;k<ls.length;k++){ x.fillText(ls[k],34,y); y+=36; }
      y+=16;
    }
  });
}
function makeItem(d){
  var side=new THREE.MeshLambertMaterial({color:d.color||0xd8d2c6});
  var m=new THREE.Mesh(new THREE.BoxGeometry(.17,.24,.07),[
    side,side,side,side,
    new THREE.MeshLambertMaterial({map:frontTex(d)}),
    new THREE.MeshLambertMaterial({color:0xF2EFE9})   // 背面等到真的翻過來才畫
  ]);
  return m;
}
var tweens=[];
function tweenY(obj,tgt,sp){ tweens.push({o:obj,t:tgt,s:sp||4}); }

var items=[];
function addItem(x,y,z,ry,d){
  var g=new THREE.Group(); g.position.set(x,y,z); g.rotation.y=ry||0;
  g.add(makeItem(d)); level.add(g);
  var o={g:g,d:d,taken:false,kind:'item'}; items.push(o); return o;
}

// ---- 櫃子：關著的時候看不出裡面有什麼，打開才知道 ----
function addCabinet(x,z,contents){
  var g=new THREE.Group(); g.position.set(x,0,z); level.add(g);
  // 櫃體本身要比外框淺，前面留一格空間放東西，不然物品會埋在實心方塊裡
  var body=new THREE.Mesh(new THREE.BoxGeometry(1.7,.95,.42),
    new THREE.MeshLambertMaterial({color:0x4a4f52}));
  body.position.set(0,.47,-.07); g.add(body);
  var plate=new THREE.Mesh(new THREE.BoxGeometry(1.5,.04,.44),
    new THREE.MeshLambertMaterial({color:0x3a3f42}));
  plate.position.set(0,.40,.06); g.add(plate);          // 櫃內的層板
  var doors=[];
  [-1,1].forEach(function(sd){
    var hinge=new THREE.Group(); hinge.position.set(sd*.82,.5,.28); g.add(hinge);
    var d=new THREE.Mesh(new THREE.BoxGeometry(.82,.8,.05),
      new THREE.MeshLambertMaterial({color:0x5c6265}));
    d.position.set(-sd*.41,0,0); hinge.add(d);
    // 把手。**沒有把手的櫃子看起來就是一個方塊**，玩家不會知道它打得開——
    // 實測回報就是「很容易忽略那兩個櫃子可以打開」
    var hd2=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.16),
      new THREE.MeshLambertMaterial({color:0xd8cf9a,emissive:0x554e2e,emissiveIntensity:.6}));
    hd2.position.set(-sd*.10,0,.06); hinge.add(hd2);
    // 紅十字**一定要掛在門上**，不能掛在櫃體上——不然門開了字還浮在原地。
    // 一邊門各畫半個，關起來才會合成一個完整的十字
    [[.18,.10,-sd*.09],[.05,.36,-sd*.025]].forEach(function(w2){
      var m2=new THREE.Mesh(new THREE.PlaneGeometry(w2[0],w2[1]),
        new THREE.MeshBasicMaterial({color:0xC4453A}));
      m2.position.set(-sd*.41+w2[2],.02,.032); d.add(m2);
    });
    doors.push({h:hinge,tgt:sd*1.7});
  });

  // 一盞小燈打在櫃子上。藥局的主燈在走道正中央，兩側的櫃子本來就是暗的
  var cl=new THREE.PointLight(0xffe0b0,.42,3.4,1.8); cl.position.set(0,1.35,.5);
  g.add(regLight(cl,.42));
  solids.push({x:x,z:z,hw:1.2,hd:.63,ry:0});
  var o={g:g,kind:'cab',taken:false,aimY:0.55,doors:doors,contents:contents||[],d:{front:['櫃子']}};
  items.push(o); return o;
}
function openCabinet(o){
  o.taken=true;                                   // 開過就不再是互動目標
  o.doors.forEach(function(d){ tweenY(d.h,d.tgt,5); });
  snd('cab_metal',{vol:0.75,rate:0.94+Math.random()*0.12});
  if(!o.contents.length){ toast('櫃子是空的'); return; }
  for(var i=0;i<o.contents.length;i++)
    addItem(o.g.position.x+(i-(o.contents.length-1)/2)*.5, .54, o.g.position.z+.19, 0, o.contents[i]);

// ---- 背包 ----
// 帶走的東西進背包，效果一律在「使用」的時候才發生。
// 這樣道具才有取捨：要現在用掉，還是留到更需要的時候。
var BAG_MAX=8;
function copyOf(d){ var o={}; for(var k in d) o[k]=d[k]; return o; }
function bagCount(){ var e=document.getElementById('bagbtn'); if(e) e.textContent='背包 '+(S.bag?S.bag.length:0); }
function bagAdd(d){
  if(!S.bag) S.bag=[];
  if(S.bag.length>=BAG_MAX){ toast('背包滿了 · 先用掉或丟掉一些'); return false; }
  S.bag.push(copyOf(d)); bagCount(); return true;
}
function bagRender(){
  var L=document.getElementById('baglist'); L.innerHTML='';
  if(!S.bag||!S.bag.length){
    var e=document.createElement('div'); e.id='bagempty'; e.textContent='背包是空的';
    L.appendChild(e); return;
  }
  S.bag.forEach(function(d,i){
    var r=document.createElement('div'); r.className='bagrow';
    var n=document.createElement('div'); n.className='nm'; n.textContent=d.front[0];
    var sb=document.createElement('div'); sb.className='sub';
    if(d.ammo){
      sb.textContent=(d.brand||'')+' · '+(d.ammo==='s'?'霰彈槍用':'手槍用')+
                     ' · 還有 '+(d.rounds|0)+' 發';
    } else {
      var use=(d.heal?'可處理傷口':(d.relief?'可緩解症狀':(d.slow?'可延緩病程':'')));
      sb.textContent=(d.brand||'')+(use?' · '+use+' · 還可以用 '+(d.uses||1)+' 次':'');
    }
    var ops=document.createElement('div'); ops.className='ops';
    [[d.ammo?'裝填':'使用',function(){bagUse(i);}],['丟棄',function(){bagDrop(i);}]].forEach(function(q){
      var b2=document.createElement('div'); b2.className='op'; b2.textContent=q[0];
      b2.addEventListener('touchstart',function(e2){e2.preventDefault();q[1]();},{passive:false});
      b2.addEventListener('click',q[1]);
      ops.appendChild(b2);
    });
    r.appendChild(n); r.appendChild(sb); r.appendChild(ops); L.appendChild(r);
  });
}
// 背包面板蓋住畫面中央，toast 會被壓在後面看不到，
// 所以使用的結果要寫在面板自己的訊息列上
function bagSay(m){
  var e=document.getElementById('bagmsg');
  e.textContent=m; e.classList.add('on');
  if(!S.bagOpen) toast(m);
}
function bagUse(i){
  var d=S.bag[i]; if(!d) return;
  var msg=null;
  // 彈藥走另一條路：它不是「用掉一次」，是把彈匣補滿，而且要花時間
  if(d.ammo){
    var sg=(d.ammo==='s');
    if(!S.weap||!S.weap[sg?'sg':'gun']){ bagSay('你身上沒有可以用這個的槍。'); return; }
    if(W().key!==(sg?'sg':'gun')){ bagSay('要先把'+(sg?'霰彈槍':'手槍')+'拿在手上。'); return; }
    if(magOf()>=magMax()){ bagSay(sg?'彈倉是滿的。':'彈匣是滿的。'); return; }
    bagHide(); startReload(d); return;
  }
  if(d.heal){
    if(S.hp>=100){ bagSay('你現在沒有傷口，留著吧。'); return; }
    var g2=Math.min(d.heal,100-S.hp); S.hp+=g2;
    msg='處理了傷口 · 體力 +'+Math.round(g2);
  } else if(d.relief){
    S.relief=d.relief;
    msg=d.useMsg||'舒服一點了 · 但病程不會因此變慢';
  } else if(d.slow){
    DZ.day1*=d.slow; DZ.day4*=d.slow;
    msg=d.takeMsg||'惡化會慢下來';
  } else { bagSay(d.useMsg||'這個現在派不上用場。'); return; }   // 沒效果就不消耗
  chime();
  d.uses=(d.uses||1)-1;                       // 一盒可以用好幾次，用完才不見
  if(d.uses<=0){ S.bag.splice(i,1); msg+=' · 用完了'; }
  else msg+=' · 還剩 '+d.uses+' 次';
  bagCount(); bagRender(); bagSay(msg);
}
function bagDrop(i){
  var d=S.bag[i]; if(!d) return;
  S.bag.splice(i,1); bagCount(); bagRender(); bagSay('丟掉了 '+d.front[0]);
}
function bagShow(){
  if(S.phase!=='run'||S.inspect) return;
  S.bagOpen=true; if(typeof unlockLook==='function') unlockLook(); bagRender();
  document.getElementById('bagmsg').classList.remove('on');
  document.getElementById('bag').classList.add('show');
  hud.classList.add('insp'); vx=vz=0; sprinting=false; blocking=false;
}
function bagHide(){
  S.bagOpen=false;
  document.getElementById('bag').classList.remove('show');
  if(!S.inspect) hud.classList.remove('insp');
}

// ---- 檢視模式 ----
// 檢視用的補光放在視線正上方一點點、正對物品，Lambert 的亮度是 N·L，
// 燈偏一邊就會讓半張標籤反白、半張偏暗，得轉到特定角度才讀得到
var inspLight=new THREE.PointLight(0xfff4e6,0,3.0,1.0); inspLight.position.set(0,.02,0);
camera.add(inspLight);
// 拿在手上的東西要畫在所有場景物件的前面，不然貼著櫃子檢視時盒子會插進櫃子裡。
// depthTest 關掉 → 不跟場景比深度，永遠畫在最上面；
// depthWrite 保留 → 仍然寫入自己的深度，後製的視差疊影才算得出「這東西很近」。
function setOverlay(mesh,on){
  mesh.renderOrder=on?999:0;
  for(var i=0;i<mesh.material.length;i++){
    mesh.material[i].depthTest=!on;
    mesh.material[i].depthWrite=true;
  }
}
// 標籤拿在手上時改成「不受光」：
//   把 color 設成黑色 → 受光的那一份歸零，正對鏡頭時不會再被燈打到過曝
//   改用 emissiveMap 顯示同一張貼圖 → 亮度固定 0.72，跟角度完全無關
// 放回架上就還原，架上的盒子仍然只靠環境光，不會自己發亮。
function setGlow(mesh,on){
  [4,5].forEach(function(i){
    var m=mesh.material[i]; if(!m||!m.map) return;
    if(on){
      if(m.emissiveMap!==m.map){ m.emissiveMap=m.map; m.needsUpdate=true; }
      m.color.setHex(0x000000);
      m.emissive.setHex(0xffffff); m.emissiveIntensity=.72;
    } else {
      m.color.setHex(0xffffff); m.emissiveIntensity=0;
    }
  });
}
var INSP={far:.46,near:.25};
function inspectStart(o){
  if(S.inspect) return;
  if(typeof unlockLook==='function') unlockLook();   // 檢視時要點「帶走／放回」
  var mesh=o.g.children[0];
  if(!o.backReady){                                  // 第一次檢視才產生背面說明
    var bm=mesh.material[5];
    bm.map=backTex(o.d); bm.color.setHex(0xffffff); bm.needsUpdate=true;
    o.backReady=true;
  }
  if(o.d.onSeen){ o.d.onSeen(); o.d.onSeen=null; }
  snd('paper',{vol:0.55,rate:1.00+Math.random()*0.10});   // 把盒子拿起來
  S.inspect={o:o,mesh:mesh,ry:0,rx:0,dist:INSP.far,zoom:false};
  camera.add(mesh);
  mesh.position.set(.02,-.05,-INSP.far); mesh.rotation.set(0,0,0);
  rightArm.visible=false; leftArm.visible=false;
  inspLight.intensity=.30*LM();          // 標籤已經不受光，這盞只是照側面
  setGlow(mesh,true); setOverlay(mesh,true);
  hud.classList.add('insp');
  document.getElementById('insp').classList.add('on');
  document.getElementById('itake').style.display=o.d.fixed?'none':'';
  document.getElementById('izoom').textContent='湊近';     // 每次都從「拉遠的狀態」開始
  vx=vz=0; sprinting=false; blocking=false;
}
function inspectEnd(take){
  if(!S.inspect) return;
  var I=S.inspect, o=I.o;
  camera.remove(I.mesh);
  setGlow(I.mesh,false); setOverlay(I.mesh,false);
  if(take && bagAdd(o.d)){
    o.taken=true; level.remove(o.g);
    if(o.d.onTake) o.d.onTake();
    toast('放進背包 · '+o.d.front[0]);
  } else {
    o.g.add(I.mesh);
    I.mesh.position.set(0,0,0); I.mesh.rotation.set(0,0,0);
  }
  S.inspect=null;
  rightArm.visible=true; leftArm.visible=true;
  inspLight.intensity=0;
  hud.classList.remove('insp');
  document.getElementById('insp').classList.remove('on');
}

// ---- Day 1 的程序化材質 ----
function day1Mats(){
  if(PTEX.d1) return PTEX.d1;
  return (PTEX.d1={
    floor:pmat('a_floor',function(){return cvWood('#4a4038');},1.0,8,0.55,0x1a1814),
    // 天花板從 Lambert 換成 Phong。**這是黑天花板的修正，不是美化**——
    // 理由見 buildDay1 裡的註解
    ceil :pmat('a_ceil', function(){return cvPlaster('#3a3c3a');},1.1,2,0.5),
    wall :pmat('a_wall', function(){return cvPlaster('#6b6558');},1.3,3,0.45),
    sofa :pmat('a_sofa', function(){return cvFabric('#5b4a3c');},1.0,2,1.6),
    bed  :pmat('a_bed',  function(){return cvFabric('#6a5c4c');},1.0,2,1.4),
    wood :pmat('a_wood', function(){return cvWood('#4a3f34');},0.9,5,1.2),
    met  :pmat('a_met',  function(){return cvMetal('#3f4441');},1.4,40,0.9,0x35352f),
    met2 :pmat('a_met2', function(){return cvMetal('#54595a');},1.4,40,0.9,0x35352f)});
}
function buildDay1(){
  clearLevel();
  var M=day1Mats();
  bounds=[-6,6,-10.5,0.5]; exitZone=null;
  var floor=plane(12,11,M.floor,0.55);
  floor.rotation.x=-Math.PI/2; floor.position.set(0,0,-5); level.add(floor);
  // ---- 天花板為什麼以前是全黑的 ----
  // 它是一整片 PlaneGeometry，只有**四個角**四個頂點，而 MeshLambertMaterial
  // 是逐頂點打光：光只在那四個角算一次，中間全部是內插出來的。
  // 客廳燈在 (-2, 2.4, -2.5)，正好在這片的**中間**——那裡沒有頂點，
  // 所以天花板最亮的那一點從頭到尾沒有被算過。
  // 實際量出來：四個角是 12~30 /255（≈ 黑），而燈正下方本來應該有 56 /255。
  // 換成 MeshPhongMaterial（逐片元）就修好了，跟第 6 節那條
  // 「MeshLambertMaterial 是逐頂點打光」是同一個坑，只是當時只檢查了牆和地板。
  var ceil=plane(12,11,M.ceil,0.5);
  ceil.rotation.x=Math.PI/2; ceil.position.set(0,2.6,-5); level.add(ceil);
  var wc=M.wall;
  box(.3,2.6,11,wc,-6,1.3,-5);  box(.3,2.6,11,wc,6,1.3,-5);
  box(12,2.6,.3,wc,0,1.3,-10.5);
  box(4.5,2.6,.3,wc,-3.75,1.3,0.4); box(4.5,2.6,.3,wc,3.75,1.3,0.4);
  // 隔間牆：客廳 / 走道 / 房間
  box(4.6,2.6,.25,wc,-3.7,1.3,-5,0,true); box(4.6,2.6,.25,wc,3.7,1.3,-5,0,true);
  box(.25,2.6,4,wc,2.2,1.3,-8.4,0,true);
  // 家具
  box(2.0,.5,1.0,M.sofa,-4.3,.25,-1.6,0,true);            // 沙發
  box(1.1,.42,.7,M.wood,-3.2,.21,-3.2,0,true);            // 茶几
  box(1.5,.5,2.1,M.bed,-3.8,.25,-8.2,0,true);             // 床
  box(.6,1.6,.5,M.met,4.6,.8,-2.6,0,true);                // 冰箱
  box(1.2,.85,.55,M.met2,4.2,.42,-7.4,0,true);            // 洗手台
  // 光：窗外的灰藍晨光 + 一盞客廳燈
  level.add(regLight(new THREE.AmbientLight(0x424c52,.72),.72));

// ---- Day 4 的程序化材質（2026-09 美術拉皮的第一關）----
// **幾何、光源、亂數、碰撞箱一律沒動，只換材質。**
// 每張貼圖的平均顏色都用 matchMean 校正回原本那個純色，所以這一關的明暗沒有變。
// 比較改前改後之前，記得先在調參面板打開「停車場的燈全亮」（`TUNE.allLamps`）——
// 燈是隨機壞的，不關掉這個變因，你比較到的會是燈不是材質（見第 6 節）。
// ---- 停車場的車（2026-09）----
// 全部用基本幾何體組，**不引入模型檔**，跟五把武器同一種做法。
// 做兩種給作者同時比較：
//   轎車   全高 1.45 —— 真實比例，但比原本的貨箱高 0.40，會擋住視線
//   掀背車 全高 1.25 —— 妥協版，仍看得過去
// **高度是玩法問題不是美術問題**：這一關原本場上的東西刻意都做矮（1.05 以下），
// 為的是「不開手電筒也能看出動線」。車子有多高就吃掉多少那個前提。
var CARCOL=['#6b2f2c','#2f4257','#5a5f62','#3f4a3c','#6a6258','#7a7268'];
function carMats(hex){
  return {
    // **不能用 cvMetal**：它在貼圖正中央烤了一個十字接縫（那是給貨櫃、鐵板用的）。
    // 車頭的正面寬 1.8 公尺 × per 0.55 ≈ 剛好一格貼圖，
    // 於是那條縫就正正落在車頭中央——作者看到的「中間都有一橫」就是它。
    // 車漆要的是平滑面 + 一點橘皮和髒污，接縫不能用貼圖假造（位置一定會錯）
    body:pmatT('c_car',function(){return cvCarPaint('#808080');},hex,1.1,64,0.55,0x5a5a52),
    glass:pt('m_glass',function(){
      return new THREE.MeshPhongMaterial({color:0x14181a,shininess:110,specular:0x6a7276});}),
    dark:pt('m_tyre',function(){
      return new THREE.MeshPhongMaterial({color:0x141514,shininess:3});}),
    // 熄滅的頭燈不是白色的，是帶灰的玻璃——但手電筒掃到會很亮。
    // 這就是「反光的位置」比「面數」重要的地方：黑暗裡你先看到的是這兩點
    lampW:pt('m_lampw',function(){
      return new THREE.MeshPhongMaterial({color:0xa8a89c,shininess:130,specular:0xffffff});}),
    lampR:pt('m_lampr',function(){
      return new THREE.MeshPhongMaterial({color:0x5a1418,shininess:115,specular:0xff7068});})
  };
}

// 把一堆盒子合併成一個 BufferGeometry。
// **這是這一版真正的重點**：細節從 8 個網格變成 20 個零件，
// 但合併之後每台車只剩 5 個網格（車身色／玻璃／深色／白燈／紅燈），
// **比原本的 8 個還少**。一個網格就是一次繪製呼叫，手機上那是有預算的。
// Three.js r128 的 BufferGeometryUtils 在 examples 裡、這個專案沒有載，所以自己寫。
function mergeGeos(list){
  var pos=[],nor=[],uvs=[];
  for(var i=0;i<list.length;i++){
    var g=list[i]; if(g.index) g=g.toNonIndexed();
    var P=g.attributes.position.array, N=g.attributes.normal.array, U=g.attributes.uv.array;
    for(var a=0;a<P.length;a++) pos.push(P[a]);
    for(var b=0;b<N.length;b++) nor.push(N[b]);
    for(var c=0;c<U.length;c++) uvs.push(U[c]);
  }
  var out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',  new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute('uv',      new THREE.Float32BufferAttribute(uvs,2));
  return out;
}

// 車的幾何**每種車型只算一次**就快取起來（顏色是材質的事，跟幾何無關），
// 所以場上八台車不會算八次
var CARGEO={};
function carGeo(kind){
  if(CARGEO[kind]) return CARGEO[kind];
  var sedan=(kind==='sedan');
  var W=sedan?1.80:1.72, L=sedan?4.30:3.90;
  var wr=sedan?0.32:0.30;
  var top=sedan?1.45:1.25;                       // 目標全高，反推其餘尺寸
  var sy0=0.20, sy1=0.78;                        // 下半身（門檻到腰線）
  // 車艙高精準等於「目標全高 − 腰線」。多給 0.02 的話，
  // 加上斜擋風玻璃探出來的部分，量出來會變成 1.467 而不是 1.45
  var cH=top-sy1, cY=(sy1+top)/2;                // 車艙
  var cL=sedan?2.05:2.20, cZ=sedan?-0.18:0.05;
  var G={body:[],glass:[],dark:[],lampW:[],lampR:[]};
  function put(bin,w,h,d,px,py,pz,rx,per){
    var g=new THREE.BoxGeometry(w,h,d); uvBox(g,w,h,d,per||0.55);
    var m=new THREE.Matrix4();
    if(rx) m.makeRotationX(rx);
    m.setPosition(px,py,pz);
    g.applyMatrix4(m);                           // 位置與法線一起變換
    G[bin].push(g);
  }
  // 下半身**比 L 短 0.06**，前後各留 0.03 給車燈凸出來。
  // 不留的話車燈盒子的前緣會跟車身前緣**完全共面**，
  // 兩個面搶同一個深度值 → 手電筒一照就開始閃爍、消失（作者實測看到的）。
  // 留了之後車燈外緣仍剛好落在 L/2，車長維持 4.30 不變
  put('body',W,sy1-sy0,L-0.06,0,(sy0+sy1)/2,0);                  // 下半身
  put('body',W-0.16,cH,cL,0,cY,cZ);                              // 車艙
  // 引擎蓋與行李廂：薄板 + 一點傾斜。**輪廓就是靠這兩片**——
  // 沒有它們，車頂到車頭是一刀切下去的，看起來就是個箱子
  var fz0=cZ+cL/2, fz1=L/2, bz0=-L/2, bz1=cZ-cL/2;
  put('body',W-0.08,0.10,fz1-fz0,0,sy1+0.02,(fz0+fz1)/2,-0.045);
  put('body',W-0.08,0.10,bz1-bz0,0,sy1+0.02,(bz0+bz1)/2, 0.035);
  // 保險桿要**內縮半個厚度**，讓外緣剛好落在 L/2。
  // 寫成 L/2−0.06 的話車會變成 4.40 長，而 4.30 才是我要拿去對停車格的數字
  put('body',W+0.02,0.18,0.22,0,0.40, L/2-0.11);                 // 前保險桿
  put('body',W+0.02,0.18,0.22,0,0.40,-L/2+0.11);                 // 後保險桿
  [-1,1].forEach(function(sx){
    put('body',0.17,0.07,0.10,sx*(W/2+0.07),sy1+cH*0.42,cZ+cL/2-0.20);   // 後照鏡
  });
  // 玻璃：前後擋是斜的，側窗兩片
  put('glass',W-0.26,cH*1.05,0.03,0,cY,cZ+cL/2+0.01,-0.52);
  put('glass',W-0.26,cH*1.02,0.03,0,cY,cZ-cL/2-0.01, sedan?0.46:0.86);
  [-1,1].forEach(function(sx){
    put('glass',0.03,cH-0.20,cL-0.50,sx*((W-0.16)/2+0.01),cY+0.03,cZ);
  });
  // 輪子與輪拱。輪拱是深色的凹陷，在黑暗裡它比輪子本身更能說明「這裡有輪子」
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(function(q){
    var t=new THREE.CylinderGeometry(wr,wr,0.22,12);
    var m=new THREE.Matrix4().makeRotationZ(Math.PI/2);
    m.setPosition(q[0]*(W/2-0.05), wr, q[1]*(L/2-0.85));
    t.applyMatrix4(m); G.dark.push(t);
    put('dark',0.10,0.34,wr*2+0.16,q[0]*(W/2-0.02),wr+0.16,q[1]*(L/2-0.85));
  });
  [-1,1].forEach(function(sx){
    put('lampW',0.34,0.13,0.06,sx*(W/2-0.32),0.66, L/2-0.03);    // 頭燈
    put('lampR',0.30,0.11,0.06,sx*(W/2-0.28),0.70,-L/2+0.03);    // 尾燈
  });
  var out={W:W,L:L,top:top};
  for(var k in G) out[k]=mergeGeos(G[k]);
  return (CARGEO[kind]=out);
}

function makeCar(x,z,ry,kind,hex){
  var G=carGeo(kind), M=carMats(hex), g=new THREE.Group();
  ['body','glass','dark','lampW','lampR'].forEach(function(k){
    g.add(new THREE.Mesh(G[k], k==='body'?M.body:k==='glass'?M.glass:
                                k==='dark'?M.dark:k==='lampW'?M.lampW:M.lampR));
  });
  g.position.set(x,0,z); g.rotation.y=ry||0; level.add(g);
  // 碰撞箱只放一個，尺寸就是車的外框。**不放在群組裡**——
  // solids 是世界座標的 AABB，不吃旋轉（跟原本的貨箱一樣）
  solids.push({x:x,z:z,hw:G.W/2+.35,hd:G.L/2+.35,ry:ry||0});
  return {g:g,top:G.top};
}
function day4Mats(){
  if(PTEX.d4) return PTEX.d4;
  // 地板：油漬當高光遮罩，**只有那幾塊會反光**，其他地方是霧面。
  // 手電筒掃過去會先亮起幾塊油斑，那個比一整片均勻的亮斑好讀得多——
  // 玩家是靠反光的形狀在判斷地面往哪邊延伸
  var fm=pmat('c_floor',function(){return cvConcrete('#2a2c2b',{});},2.2,26,0.5,0x201e1a);
  fm.specularMap=mkTex(pt('c_oil',cvOil),1,1);
  return (PTEX.d4={
    floor:fm,
    // per = 每公尺幾個 tile。0.35 表示一塊貼圖鋪 2.86 公尺，
    // 模板痕大約每 0.71 公尺一道——真實的模板木板就是這個尺寸。
    // 調太密（per 大）會變成細條紋，而且水漬的重複會被一眼看出來
    wall :pmat('c_wall',function(){return cvConcrete('#3b3f3a',{form:true,streak:true});},2.6,6,0.35),
    ceil :pmat('c_ceil',function(){return cvConcrete('#191b1c',{form:true});},1.6,3,0.4),
    col  :pmat('c_col', function(){return cvConcrete('#33383a',{form:true});},2.6,6,0.35),
    bar  :pmat('c_bar', function(){return cvConcrete('#3c4144',{});},2.4,5,0.7),
    met  :pmat('c_met', function(){return cvMetal('#2b3134');},1.8,42,0.6,0x3a3a34),
    // 木頭的紋理密而且同方向，法線強度給 2.0 會變成浪板。0.9 才像木頭
    wod  :pmat('c_wod', function(){return cvWood('#4a4238');},0.9,4,0.9),
    // shininess 85 + 亮高光 = 只有手電筒掃到才會跳出來，沒光時跟柱子一樣暗
    band :pmat('c_band',cvHazard,1.0,85,1.6,0x8a7a3a),
    // 漆線刻意**不重複** u 方向：真正的停車場只有側邊有格線，中間的車道是空的
    bay  :new THREE.MeshPhongMaterial({map:mkTex(pt('c_bay',cvBay),1,19.6),
            transparent:true,depthWrite:false,shininess:14,specular:0x141414})});
}

function buildDay4(){
  clearLevel();
  var W=8,ZN=6,ZF=-92,L=ZN-ZF,mid=(ZN+ZF)/2;
  var M=day4Mats();
  bounds=[-W/2,W/2,ZF,ZN];
  // 同樣的理由改成 Phong：手電筒是聚光燈，逐頂點打光在大平面上會整片沒反應
  var f=plane(W,L,M.floor,0.5);
  f.rotation.x=-Math.PI/2; f.position.set(0,0,mid); level.add(f);
  // 停車格的漆線。獨立一層貼在地板上方 12 公釐（跟 Day 2 的陰影同一個做法），
  // 用 Phong 不用 Basic——它是油漆不是招牌，天黑了就該看不清楚，
  // 那正是這一關要玩家感覺到的事
  var bay=plane(W,L,M.bay);
  bay.rotation.x=-Math.PI/2; bay.position.set(0,0.012,mid); level.add(bay);
  var c=plane(W,L,M.ceil,0.5);
  c.rotation.x=Math.PI/2; c.position.set(0,3.4,mid); level.add(c);
  function wall(w,h,p,r){var m=plane(w,h,M.wall,0.6);
    m.position.set(p[0],p[1],p[2]);m.rotation.set(r[0],r[1],r[2]);level.add(m);}
  wall(L,3.4,[-W/2,1.7,mid],[0,Math.PI/2,0]); wall(L,3.4,[W/2,1.7,mid],[0,-Math.PI/2,0]);
  wall(W,3.4,[0,1.7,ZF],[0,0,0]); wall(W,3.4,[0,1.7,ZN],[0,Math.PI,0]);
  // 掩體。作者實測後要求增加——不是為了難度，是為了**讓玩家真的得繞路**，
  // 走的距離變長，這一關停留的時間才對得上它在病程曲線裡的位置。
  // 加的東西刻意都做矮（1.05 以下），才不會把「不開手電筒也要能走」這個前提弄掉。
  // 柱距從 7.5 縮到 6.2，中間再插一排矮的水泥護欄與雜物。
  for(var z=-4;z>ZF+6;z-=6.2){
    var side=(Math.random()<.5)?-1:1;
    box(.7,3.4,.7,M.col,side*2.5,1.7,z,0,true);
    // 警示帶：**不加碰撞**（第九個參數留空），純視覺，動線一格都沒變。
    // 高度 1.05 是實際停車場的位置——大約在保險桿到後照鏡之間
    box(.74,.30,.74,M.band,side*2.5,1.05,z,0,false);
    // 原本這裡是 1.7 × 1.05 × 3.7 的貨箱。換成車，佔地幾乎一樣（1.8 × 4.3）。
    // **兩種高度交替出現**，作者可以在同一局裡直接比較
    if(Math.random()<.62){
      // 2026-09 作者實測後決定：兩種車型隨機出現，不再交替
      var kind=(Math.random()<0.5)?'sedan':'hatch';
      makeCar(-side*2.2, z-2.2, (Math.random()-.5)*.3, kind,
              CARCOL[(Math.random()*CARCOL.length)|0]);
    }
    if(Math.random()<.45)                                    // 水泥護欄，蹲不下去但看得過去
      box(.55,.85,2.0,M.bar,side*(1.4+Math.random()*1.3),.42,z-3.6,(Math.random()-.5)*.4,true);
    if(Math.random()<.35)                                    // 疊起來的棧板／雜物
      box(1.0+Math.random()*.6,.75,1.0+Math.random()*.6,M.wod,
          -side*(1.5+Math.random()*1.4),.38,z-4.8,Math.random()*1.2,true);
  }
  level.add(regLight(new THREE.AmbientLight(0x2a3034,.40),.40));
  // 天花板燈：每盞有機率是壞的，所以每一局的暗度本來就不一樣。
  // **但不能讓兩盞連續壞掉**——燈距 11 公尺，連兩盞黑掉就是二十幾公尺
  // 什麼都看不見的走廊。作者實測的結論是「不開手電筒也要能走」，
  // 而那個前提只有在「燈不會壞掉一整段」的時候才成立。
  // 上一盞壞了就強制這一盞是好的：隨機性還在，但「整段全黑」這條尾巴被切掉了。
  var prevDead=false;
  for(var lz=-2;lz>ZF;lz-=11){
    var dead=(TUNE.allLamps||prevDead)?false:(Math.random()<TUNE.lampDead);
    prevDead=dead;
    var p=new THREE.PointLight(0xffb257,dead?0:1.25,21,1.7);
    p.position.set(0,3.1,lz); level.add(p); lamps.push({l:p,dead:dead,base:1.25});
  }
  var ed=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.6),new THREE.MeshBasicMaterial({color:0x2a3a30}));
  ed.position.set(0,1.3,ZF+.05); level.add(ed); S.doorMat=ed.material;
  S.exitLight=new THREE.PointLight(0x7FA88A,0,10,2);
  S.exitLight.position.set(0,2.6,ZF+2); level.add(S.exitLight);
  S.reviewLight=new THREE.PointLight(0xffc98a,0,26,1.6); level.add(S.reviewLight);
  [-22,-49,-77].forEach(function(z){
    addSup((Math.random()<.5?-1:1)*(1.6+Math.random()*1.1), z+(Math.random()-.5)*4, 0xB8A05A,'補給');
  });
  exitZone={x:0,z:ZF+3,r:5}; S.reviewRange=[ZF,ZN];
  camera.position.set(0,1.62,ZN-1.5); yaw=0; pitch=0;
  makeZombie(0,-14,1.15); makeZombie(1.5,-30,1.15);
  // 以前這裡有一句 setTorch(1.5)：一盞永遠亮著、玩家沒付任何代價的相機燈。
  // 手電筒變成道具之後那盞燈不見了，停車場會明顯變暗——
  // 這不是 bug，是「撿到手電筒」終於變成有感的事件。
}

function buildDay2(){

  var M=day2Mats();
  var W=14, ZN=8, ZF=-104, L=ZN-ZF, mid=(ZN+ZF)/2;
  bounds=[-W/2+0.6, W/2-0.6, ZF, ZN];
  // 柏油路面
  var road=plane(W,L,M.road,0.35);
  road.rotation.x=-Math.PI/2; level.add(road); road.position.set(0,0,mid);
  // 右側車道的陰影。**要看得見**，不然玩家不會知道那裡比較舒服
  var shade=new THREE.Mesh(new THREE.PlaneGeometry(W/2-SHADE_X,L),
    new THREE.MeshLambertMaterial({color:0x2b2f31,transparent:true,opacity:.55}));
  shade.rotation.x=-Math.PI/2;
  shade.position.set((SHADE_X+W/2)/2,0.012,mid); level.add(shade);
  // 雙黃線
  [-0.16,0.16].forEach(function(ox){
    var ln=new THREE.Mesh(new THREE.PlaneGeometry(0.12,L),
      new THREE.MeshLambertMaterial({color:0xb8a032}));
    ln.rotation.x=-Math.PI/2; ln.position.set(ox,0.014,mid); level.add(ln);
  });
  // 人行道（兩側各一條，稍微高起來，不是 solid，走得上去）
  [-1,1].forEach(function(sd){
    var pv=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.16,L),M.walk);
    uvBox(pv.geometry,1.6,0.16,L,0.8);
    pv.position.set(sd*(W/2-0.8),0.08,mid); level.add(pv);
  });
  // 兩側建築：一段一段疊，高度與顏色隨機，看起來才不像一面長牆
  for(var bz=ZN; bz>ZF; bz-=9){
    [-1,1].forEach(function(sd){
      var h=7+Math.random()*5, d=8.4+Math.random()*0.6;
      box(3.6,h,d,M.fac[(Math.random()*M.fac.length)|0],sd*(W/2+1.6),h/2,bz-d/2,0,true);
      // 一樓的門窗，讓立面不是一片色塊
      var win=new THREE.Mesh(new THREE.PlaneGeometry(d*0.7,2.0),
        new THREE.MeshLambertMaterial({color:0x24282b}));
      win.position.set(sd*(W/2-0.22),2.0,bz-d/2);
      win.rotation.y=sd>0?-Math.PI/2:Math.PI/2; level.add(win);
    });
  }
  // 街尾封起來（走到底就是出口）
  box(W+8,10,1.2,0x4c4a45,0,5,ZF-0.6,0,true);
  // ---- 白天的光 ----
  level.add(regLight(new THREE.AmbientLight(0xbcc6cc,0.92),0.92));
  var sun=new THREE.DirectionalLight(0xfff2d8,1.25);
  sun.position.set(SUN.x*40,26,SUN.z*40); level.add(regLight(sun,1.25));
  var sky=new THREE.HemisphereLight(0xcfe0ea,0x5a5348,0.55);
  level.add(regLight(sky,0.55));
  // ---- 壞掉的車與廢棄物 ----
  var cz=-6;
  while(cz>ZF+16){                 // 出口前留一段淨空，鐵捲門要一眼看得到
    var lane=(Math.random()<.5)?-1:1;
    var cx=lane*(1.4+Math.random()*3.4);
    carWreck(cx,cz,(Math.random()-0.5)*0.9);
    if(Math.random()<.55){                       // 路邊的雜物堆
      var dx2=-lane*(2.2+Math.random()*2.6);
      box(0.9+Math.random()*0.8,0.5+Math.random()*0.5,0.8+Math.random()*0.7,
          0x4a4640,dx2,0.3,cz-3-Math.random()*3,Math.random()*1.2,true);
    }
    cz-=7+Math.random()*5;
  }
  // ---- 消防車與消防斧 ----
  var ftz=-34;
  box(2.3,2.6,7.2,M.car,-3.1,1.3,ftz,0.10,true);            // 車體
  box(2.4,1.0,2.2,M.car,-3.1,2.9,ftz+2.4,0.10,true);        // 駕駛室頂
  var fl=new THREE.PointLight(0xff5a44,0.0,9,2); fl.position.set(-3.1,3.2,ftz);
  level.add(regLight(fl,0.0));
  addAxePickup(-1.05,ftz-0.6);   // 要留在消防車碰撞箱外面，不然走不過去拿
  // ---- 補給（玻璃瓶）----
  [-18,-48,-80].forEach(function(z){
    addSup((Math.random()<.5?-1:1)*(1.5+Math.random()*2.6), z+(Math.random()-.5)*4,
           0x7FA88A,'玻璃瓶');
  });
  // ---- 出口：街尾右側，一道半開的鐵捲門 ----
  // 街的盡頭是封死的，所以這道門是唯一的出路。
  // 半開是刻意的：下一關的藥局也是半開的鐵捲門，兩關接得起來，
  // 玩家彎腰鑽進去的那個動作會重複一次。
  var GX=6.42, GZ=ZF+9;
  var frame=new THREE.Mesh(new THREE.PlaneGeometry(3.2,3.0),
    new THREE.MeshBasicMaterial({color:0x141a18}));            // 門洞裡面是暗的
  frame.position.set(GX-0.02,1.5,GZ); frame.rotation.y=-Math.PI/2; level.add(frame);
  // 拉到一半的鐵捲門：捲片＋下緣的橫桿
  var shut=new THREE.Mesh(new THREE.BoxGeometry(0.10,1.55,3.2),
    new THREE.MeshLambertMaterial({map:tex('#7b7f7a','40,44,42',1,26)}));
  shut.position.set(GX+0.06,2.22,GZ); level.add(shut);
  var bar=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.16,3.3),
    new THREE.MeshLambertMaterial({color:0x3c4340}));
  bar.position.set(GX+0.06,1.44,GZ); level.add(bar);
  // 門框（兩側的軌道），讓它看起來是一道門不是牆上的一塊貼圖
  [-1.66,1.66].forEach(function(oz){
    box(0.22,3.1,0.20,0x565b56,GX+0.05,1.55,GZ+oz,0,false);
  });
  S.doorMat=frame.material;
  S.exitLight=new THREE.PointLight(0x7FA88A,0,11,2);
  S.exitLight.position.set(GX-1.2,1.9,GZ); level.add(S.exitLight);
  S.reviewLight=new THREE.PointLight(0xffc98a,0,26,1.6); level.add(S.reviewLight);
  exitZone={x:GX-1.5,z:GZ,r:2.2};
  camera.position.set(1.2,1.62,ZN-2.5); yaw=0; pitch=0;
  makeZombie(-1.2,-22,1.15); makeZombie(2.4,-45,1.15); makeZombie(-0.6,-72,1.15);
  reviewPose=null;
}
// 一台撞爛的車。刻意做得矮一點（1.05 高），因為它是掩體不是牆——
// 玩家要能看見車頂另一邊有沒有東西
function carWreck(x,z,ry){
  var col=[0x4a5560,0x5c4a44,0x46504a,0x5a5648][(Math.random()*4)|0];
  box(1.85,0.95,4.2,col,x,0.48,z,ry,true);
  box(1.6,0.62,1.9,0x2b3033,x,1.22,z+0.25,ry,false);           // 車窗那一段
  return x;
}
// 消防斧：靠在消防車旁邊，走近按「拿走」。
// 這是第一次在關卡裡撿到武器，用的是已經有的「檢視」那顆鍵，玩家不用學新東西。
function addAxePickup(x,z){
  var g=new THREE.Group();
  var haft=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1.0,8),
    new THREE.MeshLambertMaterial({color:0x6b533a}));
  haft.position.y=.5; haft.rotation.z=0.26; g.add(haft);
  var head=new THREE.Mesh(new THREE.BoxGeometry(.10,.30,.20),
    new THREE.MeshLambertMaterial({color:0xb0453a}));
  head.position.set(-.14,.96,0); g.add(head);
  var gl=new THREE.PointLight(0xffb070,.5,4.0,2); gl.position.set(0,.8,0);
  g.add(regLight(gl,.5));
  g.position.set(x,0,z); level.add(g);
  items.push({g:g,kind:'take',taken:false,give:'axe',name:'消防斧'});
}


// ================================================================ Day 5 排水隧道
// **這一關的動詞是「聽」。** 幾乎全黑，只有你左手那支手電筒。
// 核心取捨在這裡正面撞上，而且不需要另外設計——它是從既有規則長出來的：
//   手電筒＋鐵撬 = 看得到，但要打三下
//   霰彈槍       = 一發清場，但你什麼都看不到，而且槍口暗斑讓你更瞎好幾秒
// 所以這一關**不做「不管你怎麼選都看不見」的路段**（作者決定）。
// 這一關的力量來自你自己選擇了失明，不是被關卡強迫失明。
// ---- Day 5 的程序化材質 ----
// 這一關最暗，所以法線貼圖的效果最明顯：手電筒是唯一的光，
// 光沿著管壁的模板痕與青苔邊緣走，「這是一根圓管」才讀得出來
function day5Mats(){
  if(PTEX.d5) return PTEX.d5;
  return (PTEX.d5={
    // side:BackSide —— 玩家在管子**裡面**，看到的是內壁。漏掉的話整根管子會消失
    tube:pmat('t_tube',function(){return cvAlgae('#33383a');},2.8,8,0.30,0x1e2220,THREE.BackSide),
    floor:pmat('t_floor',function(){return cvConcrete('#2b3130',{});},2.0,14,0.45,0x1e2220),
    side:pmat('t_side',function(){return cvAlgae('#2e3335');},2.6,8,0.55,0x1e2220,THREE.BackSide),
    met :pmat('t_met', function(){return cvMetal('#494f50');},1.6,44,1.1,0x3a3a34)});
}
function buildDay5(){
  clearLevel();
  var R=2.6, ZN=4, ZF=-96, L=ZN-ZF, mid=(ZN+ZF)/2;
  bounds=[-R+0.7, R-0.7, ZF, ZN];
  S.tunR=R; S.tunZF=ZF;
  var CY=R*0.62;                       // 管心的高度
  // **這裡一定要用 Phong，不能用 Lambert。**
  // Three.js 的 MeshLambertMaterial 是**逐頂點**打光（Gouraud），
  // 而這根管子沿 z 只有兩排頂點——聚光燈照在兩排頂點中間的牆面上時，
  // 兩端的頂點都不在光錐裡，算出來就是全黑。
  // 症狀正好是作者回報的：「正面朝牆沒有光，偏一點又有」——
  // 偏一點是因為光錐掃到了某一排頂點。
  // Phong 是逐片元打光，才會在牆上出現真正的光斑。
  var M=day5Mats(); var tmat=M.tube;
  // 管身分段做，**支管的位置要真的把牆開一個洞**。
  // 第一版是把支管貼在牆外面，主管的牆完全沒開洞，
  // 所以看到的是穿模的怪形狀，喪屍也是直接穿牆出來。
  // Three.js 沒有現成的布林運算，作法是把圓柱畫成「缺一段角度的弧」：
  // CylinderGeometry 的 thetaStart / thetaLength 就是留給這種事的。
  // 角度對應（管子躺下之後）：0 = 正下方、π/2 = +X、π = 正上方、−π/2 = −X。
  function tubeSeg(z0,z1,gapTh,gapHalf){
    var len=Math.abs(z1-z0); if(len<0.02) return;
    var g0,gl;
    if(gapTh===undefined){ g0=0; gl=Math.PI*2; }
    else { g0=gapTh+gapHalf; gl=Math.PI*2-gapHalf*2; }
    var mg=new THREE.CylinderGeometry(R,R,len,20,1,true,g0,gl);
    uvCyl(mg,R,len,gl,0.30);          // 依實際公尺數縮 UV，長短不同的管段紋理才一致
    var m=new THREE.Mesh(mg,tmat);
    m.rotation.x=Math.PI/2; m.position.set(0,CY,(z0+z1)/2); level.add(m);
  }
  // 走道地板（管底鋪平，不然玩家會覺得腳下是圓的）
  var fl=plane(R*2-0.4,L,M.floor,0.45);
  fl.rotation.x=-Math.PI/2; fl.position.set(0,0,mid); level.add(fl);
  // 及踝的水。**要看得見反光**，不然涉水的聲音會像是憑空來的
  // **水面用 Phong 不用 Lambert**：Lambert 沒有高光，手電筒照上去只是均勻變亮，
  // 看起來像濕地板不像水。有高光才會有那條晃動的亮帶，低頭就看得到自己站在水裡
  var wat=new THREE.Mesh(new THREE.PlaneGeometry(R*2-0.4,L),
    new THREE.MeshPhongMaterial({color:0x182c31,shininess:90,specular:0x6d94a2,
      transparent:true,opacity:.78}));
  wat.rotation.x=-Math.PI/2; wat.position.set(0,0.085,mid); level.add(wat);
  // 兩端封起來
  box(R*2.4,R*1.6,0.8,0x2a2f30,0,R*0.7,ZN+0.6,0,true);
  // ---- 支管 ----
  // 喪屍從側面出來，「左邊還是右邊」才有意義。
  // 全部從正前方來的話，聽聲辨位就退化成看得到看不到。
  var PIPES=[[-1,-16],[1,-33],[-1,-52],[1,-68],[-1,-83]];
  var PR=1.15, PY=1.05;                                  // 支管半徑、管心高度
  var pmat=M.side;
  // 洞口在主管牆上的角度與張角
  var gapHalf=Math.asin(Math.min(0.95,PR/R))+0.10;
  PIPES.forEach(function(pp){
    pp[2]=Math.atan2(pp[0]*R, -(PY-CY));                 // 世界方向 (sinθ,−cosθ)
    pp[3]=PR/Math.cos(0);                                // 洞口沿 z 的半長，下面用
  });
  // 先把主管沿 z 切成一段一段：有支管的地方那一段缺一塊角度
  (function(){
    var cuts=PIPES.map(function(pp){ return {z:pp[1],th:pp[2],h:PR+0.10}; })
                  .sort(function(a,b){ return b.z-a.z; });
    var zc=ZN;
    cuts.forEach(function(c){
      tubeSeg(zc, c.z+c.h);                              // 沒有洞的那一段
      // **洞要是圓的，不是長方形的。** 第一版整段用同一個角度缺口，
      // 等於在牆上挖掉一塊 2.8 公尺長 × 64 度寬的長方形——
      // 玩家看到的是一個大黑洞、框浮在中間、喪屍站在框的旁邊。
      // 正確作法是沿 z 切成薄片，**每一片的缺口寬度照圓的方程式算**：
      // 離圓心 dz 處的半寬 = √(PR²−dz²)，再換成角度。八片就夠圓了。
      var N=8;
      for(var k=0;k<N;k++){
        var z0=c.z+c.h-(2*c.h)*(k/N), z1=c.z+c.h-(2*c.h)*((k+1)/N);
        var dz=Math.abs((z0+z1)/2-c.z);
        var w=Math.sqrt(Math.max(0,PR*PR-dz*dz));        // 這一片的洞有多寬
        if(w<0.05){ tubeSeg(z0,z1); continue; }
        tubeSeg(z0,z1,c.th,Math.asin(Math.min(0.98,w/R))+0.02);
      }
      zc=c.z-c.h;
    });
    tubeSeg(zc, ZF);
  })();
  PIPES.forEach(function(pp){
    var sd=pp[0], pz=pp[1];
    var PL=3.2;
    var pg=new THREE.CylinderGeometry(PR,PR,PL,14,1,true);
    uvCyl(pg,PR,PL,6.283185,0.55);
    var m=new THREE.Mesh(pg,pmat);
    m.rotation.z=Math.PI/2; m.position.set(sd*(R+PL/2-0.35),PY,pz); level.add(m);
    // 支管的底也要有水，不然管子裡看起來是懸空的
    var pw=new THREE.Mesh(new THREE.PlaneGeometry(PL,PR*1.5),
      new THREE.MeshPhongMaterial({color:0x182c31,shininess:90,specular:0x6d94a2,
        transparent:true,opacity:.78}));
    pw.rotation.x=-Math.PI/2; pw.rotation.z=Math.PI/2;
    pw.position.set(sd*(R+PL/2-0.35),0.085,pz); level.add(pw);
    // 管口的一圈混凝土框：**有框才看得出那是一個開口**，不是牆上的一塊污漬
    // 管口的框要**貼在牆上**（x 落在主管半徑處），不能往內縮，不然會浮在洞的中間
    var ring=new THREE.Mesh(new THREE.TorusGeometry(PR+0.06,0.09,6,18),
      new THREE.MeshLambertMaterial({color:0x494f50}));
    ring.position.set(sd*(R-0.06),PY,pz); ring.rotation.y=sd*Math.PI/2; level.add(ring);
    // 管子的盡頭封起來
    var cap=new THREE.Mesh(new THREE.CircleGeometry(PR,14),
      new THREE.MeshLambertMaterial({color:0x1a2022}));
    cap.position.set(sd*(R+PL-0.35),PY,pz); cap.rotation.y=-sd*Math.PI/2; level.add(cap);
  });
  // ---- 光 ----
  // 幾乎全黑。地面的一點點微光只是為了讓玩家不會覺得畫面壞掉，
  // 不足以讓他不開手電筒就走完（那個取捨才是這一關的全部）。
  level.add(regLight(new THREE.AmbientLight(0x1c252a,.30),.30));
  // 頭頂的排水柵：三道很暗的光柱，當作路標，也讓玩家看得出隧道有多長
  // 路標要夠多。玩家在黑暗裡需要一個「下一個目標在那裡」的東西，
  // 不然他不知道自己有沒有在前進——那是迷路，不是失明
  [-10,-27,-44,-61,-78,-92].forEach(function(gz){
    var gl=new THREE.PointLight(0x9fb4c0,.85,11,1.7); gl.position.set(0,R*1.05,gz);
    level.add(regLight(gl,.85));
    var gm=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.5),
      new THREE.MeshBasicMaterial({color:0x4d5f68}));
    gm.rotation.x=Math.PI/2; gm.position.set(0,R*1.18,gz); level.add(gm);
  });
  // ---- 細節：讓它看起來像下水道，不是一根光滑的管子 ----
  // 沿牆的管線（兩條，不同高度不同側），還有排水柵下的鏽蝕爬梯。
  // 圓管最怕的就是「每一段都長一樣」——玩家會失去前進的實感
  [[0.62,-1],[1.35,1]].forEach(function(pl){
    var a2=pl[0]*pl[1], rr=R-0.16;
    var pipe=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,L,8,1),
      new THREE.MeshLambertMaterial({color:0x3f4442}));
    pipe.rotation.x=Math.PI/2;
    pipe.position.set(Math.sin(a2>0?1.25:-1.25)*rr*(pl[1]>0?1:1), CY+Math.cos(1.25)*rr*0.0+pl[0], mid);
    pipe.position.x=pl[1]*(R-0.30); level.add(pipe);
    // 每隔一段一個支撐環
    for(var sz=ZN-6; sz>ZF; sz-=12){
      box(0.30,0.10,0.10,0x515654, pl[1]*(R-0.20), pl[0], sz, 0, false);
    }
  });

  for(var dz2=-6; dz2>ZF+4; dz2-=9+Math.random()*8){   // 水面上的漂浮雜物
    box(0.35+Math.random()*0.5,0.10,0.28+Math.random()*0.4,0x3b3a33,
        (Math.random()-0.5)*(R*1.2), 0.11, dz2+(Math.random()-0.5)*4, Math.random()*1.5, false);
  }

  // ---- 霰彈槍 ----
  // 放中段。撿到之後才開始面對那個取捨——在那之前他只有手電筒＋鐵撬。
  addSgPickup(1.35,-44);
  // ---- 補給（霰彈與玻璃瓶）----
  [-24,-58,-88].forEach(function(z){
    addSup((Math.random()<.5?-1:1)*1.25, z+(Math.random()-.5)*3, 0x8fa5b2,'補給');
  });
  // ---- 出口：終點的爬梯，爬上去就是地面 ----
  // 作者的想法，比一道門好得多：**黑了一整關之後，出口是頭頂的一塊光**，
  // 而且爬出去正好接得上 Day 6 的醫院外圍。
  var EX=ZF+2.6;
  for(var ry=0.42; ry<R*1.30; ry+=0.32)               // 鏽蝕的爬梯
    box(0.50,0.055,0.055,0x6a5540, 0, ry, EX-0.62, 0, false);
  [-0.24,0.24].forEach(function(ox){                   // 兩根立柱
    box(0.05,R*1.35,0.05,0x5a4a3c, ox, R*0.68, EX-0.70, 0, false);
  });
  // 人孔：頭頂開一個洞，外面的天光灑下來
  var hole=new THREE.Mesh(new THREE.CircleGeometry(0.62,16),
    new THREE.MeshBasicMaterial({color:0x2a3a30}));

// ================================================================ Day 6 醫院外圍
// **這一關的動詞是「認路」。** 前五關全部是線性的走廊（街道、藥局、停車場、隧道），
// 玩家只要往前走就會到。Day 6 第一次讓他自己找路——而他已經看不清楚路牌了。
// 這是低視力最真實的日常，而且不需要任何新機制就成立。
//
// 路標刻意做成**三層冗餘**，粗細不同：
//   細 = 牌子上的字（病程 0.4 以上就開始讀不到）
//   中 = 大箭頭（0.7 左右還看得出方向）
//   粗 = 地上的引導漆線（幾乎全程都看得到）
// 玩家會自己發現「我現在只能靠地上那條線了」。**三層都在，所以永遠不會卡關**
// ——藥局的處方箋就是因為會變成門檻才被拿掉的，同一個坑不要再踩。
//
// 兩條曲線在這裡交會：彈藥全程手槍三盒、霰彈兩盒，走到這裡一定打光；
// 眼睛也差不多壞了。所以**這一關不放任何彈藥，只放玻璃瓶**——
// 正解變成「把牠們引開然後走過去」。你不是英雄，你是一個要去看病的人。
//
// 地圖是 L 形（前五關第一次不是直線）：
//   A 後巷（沿 -z）→ B 外圍道路（沿 +x）→ C 急診車道（封死的死路）→ D 正門大廳
// 綠線帶你走到急診門，然後**斷在那裡**。牆上的公告字很小，但地上另有一條藍線。
var D6={
  aw:5.0,                   // 後巷半寬
  rz0:-26, rz1:-38,         // 外圍道路的 z 範圍
  rx0:-10, rx1:48,          // 外圍道路的 x 範圍
  fz:-38.6,                 // 醫院圍籬（道路南側）
  hz:-46,                   // 醫院立面
  bay0:18, bay1:30,         // 急診車道的開口
  lob0:36, lob1:46,         // 正門前庭的開口
  gateX:12,                 // 路中間那道要撬開的圍籬
  doorE:24,                 // 急診門的 x
  doorM:41                  // 正門的 x
};
// 招牌用自己的畫布（labelTex 是直式的藥盒貼圖，比例不對）。
// **一律用 MeshBasicMaterial**：招牌看不看得清楚要由「眼睛」決定，
// 不要由場景的光決定——否則玩家會分不出是天黑了還是自己壞了。
function d6Tex(W,H,draw){
  var c=document.createElement('canvas'); c.width=W; c.height=H;
  var t=new THREE.CanvasTexture(c);
  t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter;
  function run(){ var x=c.getContext('2d'); draw(x,W,H); t.needsUpdate=true; }
  run(); LABELS.push(run);
  return t;
}
function d6Board(x,y,z,ry,w,h,t){
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({map:t}));
  m.position.set(x,y,z); m.rotation.y=ry||0; level.add(m); return m;
}
// 醫院的方向牌：底色 + 大箭頭 + 中文 + 英文。
// 三層冗餘裡的「中」（箭頭）與「細」（字）都在這一張上面
function d6Dir(text,en,dir,bg){
  return d6Tex(512,192,function(x,W,H){
    x.fillStyle=bg||'#1f4a63'; x.fillRect(0,0,W,H);
    x.fillStyle='rgba(255,255,255,0.16)'; x.fillRect(0,0,W,6);
    // 大箭頭：眼睛壞掉之後最後還看得出來的那一層
    x.save(); x.translate(dir>0?W-96:96,H/2); x.scale(dir>0?1:-1,1);
    x.fillStyle='#EDF3F5'; x.beginPath();
    x.moveTo(-56,-16); x.lineTo(14,-16); x.lineTo(14,-46); x.lineTo(66,0);
    x.lineTo(14,46); x.lineTo(14,16); x.lineTo(-56,16); x.closePath(); x.fill();
    x.restore();
    x.fillStyle='#EDF3F5'; x.textBaseline='middle';
    x.font='600 74px '+FONT; x.fillText(text,dir>0?40:150,H/2-18);
    x.font='500 30px '+FONT; x.fillStyle='rgba(237,243,245,0.82)';
    x.fillText(en,dir>0?42:152,H/2+38);
  });
}
// 手寫的公告。**字刻意很小**——這一張是三層冗餘裡最細的那一層，
// 讀不到才是常態，讀不到也走得出去（地上還有藍線）
function d6Notice(){
  return d6Tex(384,288,function(x,W,H){
    x.fillStyle='#E4E0D4'; x.fillRect(0,0,W,H);
    x.strokeStyle='rgba(0,0,0,0.18)'; x.lineWidth=3; x.strokeRect(6,6,W-12,H-12);
    x.fillStyle='#1d2326'; x.textBaseline='top';
    x.font='600 30px '+FONT; x.fillText('急診暫停開放',30,30);
    x.font='400 22px '+FONT; x.fillStyle='#3a4247';
    ['本區已封閉，請由一樓大廳','（本棟建築東側）進入。','夜間仍有人員留守。',
     '請沿地面藍線前行  →'].forEach(function(s,i){ x.fillText(s,30,92+i*38); });
  });
}
// 地上的引導漆線。**這是三層冗餘裡最粗的那一層**，所以用 Basic 材質、
// 顏色也給得飽和：它必須是「眼睛壞到最後還看得見」的那個東西
function d6Line(x1,z1,x2,z2,color){
  var w=Math.abs(x2-x1)||0.34, d=Math.abs(z2-z1)||0.34;
  var m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),
    new THREE.MeshBasicMaterial({color:color}));
  m.rotation.x=-Math.PI/2;
  m.position.set((x1+x2)/2,0.02,(z1+z2)/2); level.add(m);
}
// 拒馬。矮（1.1），因為它是動線不是牆——玩家要看得見另一邊有沒有東西
function d6Barrier(x,z,ry){
  box(0.14,1.10,2.10,0x9a8c3e,x,0.55,z,ry||0,true);
  box(0.10,0.08,2.20,0xd8cf8a,x,1.02,z,ry||0,false);
}
// 空的推床。醫院外面排著一列沒有人的推床，不用一句台詞就講完了
// 「來的人太多，或者太晚」
function d6Gurney(x,z,ry){
  box(0.72,0.06,1.95,0xc9cdd0,x,0.78,z,ry||0,false);
  [-0.8,0.8].forEach(function(oz){
    box(0.62,0.72,0.06,0x6d757a,x,0.40,z+oz,ry||0,false); });
}
// ---- Day 6 的程序化材質 ----

    canopy:pmat('h_can',function(){return cvMetal('#5a615f');},1.3,50,0.9,0x3a3a34)});
}
function buildDay6(){
  clearLevel();
  bounds=[-11,49,-47,8];
  var A=D6.aw;
  // ---- 地面。手電筒照得到的大面一律 Phong（逐片元），Lambert 會整片沒反應 ----

  var grd=plane(62,56,M.grd,0.30);
  grd.rotation.x=-Math.PI/2; grd.position.set(19,0,-20); level.add(grd);

  // ---- A 後巷：兩側的建築 ----

    var hw2=6.5+Math.random()*4;
    box(6,hw2,8.2,[0x54514a,0x605a50,0x4b4f4c][(Math.random()*3)|0],
        -A-3,hw2/2,bz-4.1,0,true,true);
  }
  // 東側是一整塊街廓，一路封到道路盡頭
  for(var ex6=A+0.5; ex6<49; ex6+=8.5){
    var hw3=7+Math.random()*5;
    box(8.5,hw3,34,[0x585349,0x4f544f,0x635c51][(Math.random()*3)|0],
        ex6+4.25,hw3/2,-9,0,true,true);

  box(1.2,4,13,0x4a4b46,-11,2,-32,0,true,true);
  box(0.30,3.2,0.30,M.post,-8.6,1.6,-30,0.4,true);
  box(0.30,3.2,0.30,M.post,-8.0,1.6,-34,-0.3,true);
  box(3.4,1.0,2.6,0x565048,-8.8,0.5,-32,0.5,true);
  // ---- 醫院大樓 ----
  box(60,15,6,M.bldg,19,7.5,D6.hz-3,0,true,true);
  // 零星亮著的窗。**全程看得到目的地**——黑暗裡需要「下一個目標在那裡」，
  // 這是 Day 5 的教訓（六道排水柵那一條）
  for(var wy=0;wy<5;wy++) for(var wx=0;wx<16;wx++){
    var on=Math.random()<0.30;
    var wm6=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.0),
      new THREE.MeshBasicMaterial({color:on?0xd8c48e:0x232a2e}));
    wm6.position.set(-4+wx*3.1, 4.4+wy*2.3, D6.hz+0.05); level.add(wm6);

  // ---- 圍籬：把道路和醫院院區隔開，只留急診車道與正門兩個開口 ----
  function fence(x0,x1){
    box(x1-x0,2.2,0.18,M.fence,(x0+x1)/2,1.1,D6.fz,0,true); padLast(0.55,TUNE.zStop);
    for(var fx6=x0;fx6<=x1;fx6+=3) box(0.12,2.3,0.12,0x767d78,fx6,1.15,D6.fz,0,false);
  }
  fence(-11,D6.bay0); fence(D6.bay1,D6.lob0); fence(D6.lob1,49);
  // 兩個開口的側牆（不然從車道可以橫著走進院區）
  [D6.bay0,D6.bay1,D6.lob0,D6.lob1].forEach(function(fx7){
    box(0.18,2.2,7.6,M.fence,fx7,1.1,(D6.fz+D6.hz)/2,0,true); padLast(0.55,TUNE.zStop);
  });
  // ---- B 道路上那道要撬開的圍籬 ----
  // 唯一的新互動，而且是舊的：跟藥局撬調劑室門完全一樣的動作。
  // 它的價值是**那 2.4 秒你不能揮**——最後一關的脆弱應該來自舊能力，不是新規則
  // **門旁邊這兩片才是作者看到「手穿出來」的地方**，不是門本身。
  // 門有 zpad，這兩片沒有，所以喪屍可以貼到板面 0.35 公尺——比伸手的長度短。
  // 這兩片跟門一樣是 2.2 公尺高的薄板，要一起標
  box(0.5,2.2,4.8,M.fence,D6.gateX,1.1,-35.6,0,true); padLast(0.55,TUNE.zStop);
  box(0.5,2.2,4.8,M.fence,D6.gateX,1.1,-28.4,0,true); padLast(0.55,TUNE.zStop);

  var gl6=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.24,0.24),
    new THREE.MeshLambertMaterial({color:0xb8a24e}));

  gg.position.set(D6.gateX,1.05,-30.85); level.add(gg);

      x.fillStyle='#8d2f28'; x.fillRect(0,0,W,H);

      x.font='700 76px '+FONT; x.fillText('急診',26,H/2-6);

  d6Board(D6.doorE+3.1,1.65,D6.hz+0.36,0,1.05,0.79,d6Notice());       // 那張小字公告

// 撿走一個補給箱，是「把箱子藏起來」不是「把這個群組關掉」。
// **`visible=false` 不能用在有燈掛在裡面的群組上**：Three.js 遍歷場景時
// 遇到 visible===false 會整棵子樹直接跳過，那盞燈一樣會從光源清單消失，
// 於是 NUM_POINT_LIGHTS 改變、全場材質重編譯——跟 remove() 完全一樣的結果。
// 第一輪修正只換掉 remove()、留著 visible=false，所以頓挫沒有消失。
// 正確做法是**群組保持 visible，只把裡面的網格藏起來**，燈留著並歸零。
function hideSup(sp){
  if(sp.mesh) for(var i=0;i<sp.mesh.length;i++) sp.mesh[i].visible=false;
  if(sp.light) sp.light.intensity=0;
  if(sp.reg) sp.reg.base=0;
}
function addSup(x,z,color,label){
  var g=new THREE.Group();
  var b=new THREE.Mesh(new THREE.BoxGeometry(.42,.3,.3),new THREE.MeshLambertMaterial({color:color}));
  b.position.y=.15; g.add(b);
  var cr=new THREE.Mesh(new THREE.BoxGeometry(.44,.06,.09),new THREE.MeshBasicMaterial({color:0xC4453A}));
  cr.position.y=.15; g.add(cr);
  var gl=new THREE.PointLight(color,.5,4.2,2); gl.position.set(0,.5,0); g.add(regLight(gl,.5));
  g.position.set(x,0,z); level.add(g);
  // 把燈與它在 lightReg 裡的那一筆一起記下來。撿走的時候要**關掉它而不是移除它**，
  // 理由見 sups.forEach 裡的註解（移除燈會害整個場景的 shader 重編譯）
  sups.push({g:g,taken:false,label:label,light:gl,reg:lightReg[lightReg.length-1],
             mesh:[b,cr]});
}

// ================================================================ day flow
// ================================================================ 疾病
// eyes: 'R' 單側 / 'both' 雙側（第二眼較輕）
// urgency: true 代表有黃金治療時間，趕得上就有救
//
// ---- 三種「玩家自己花掉的視力」為什麼每一種病都不一樣（2026-09 文獻回顧）----
// 以前 sprint / head / 槍口代價是五種病共用的。查過文獻之後改成分病，
// 因為**其中幾條在醫學上是反的**，共用等於在教錯的東西。
//
// sprint（衝刺）：
//   剝離 有。丹麥 50 人前瞻研究：頭部動作加倍時，剝離邊界每小時推進
//        -6μm（幾乎不動）/ -75μm（中等）/ -219μm（活動多）；角速度是唯一
//        與邊界移動顯著相關的指標，姿勢遵從度反而不顯著。
//        **驅動惡化的是頭在動**，不是「劇烈運動」這個籠統概念。
//   糖尿病 有。活動性增殖性病變者，劇烈活動可能誘發玻璃體出血或牽引性剝離；
//        ADA 建議避免無氧運動與涉及憋氣、震動、Valsalva 的活動。
//   青光眼 **0**。中等強度有氧運動會讓眼壓下降約 2–5 mmHg，
//        中高強度身體活動與視野惡化速率下降約一成有關。跑步讓青光眼惡化是錯的。
//   黃斑部 **0**。沒有支持運動加速 AMD 的證據。
//   白內障 **0**。水晶體的混濁跟運動沒有關係。
//
// head（被打中頭）：閉合性眼球鈍挫傷。IRIS Registry 20 萬人、追蹤平均 444 天：
//   2.8% 做白內障手術、0.8% 剝離修補、0.8% 裂孔治療、0.3% 青光眼手術。
//   風險比：外傷性白內障→白內障手術 13.0、前房出血→青光眼手術 7.24、
//   玻璃體出血→裂孔 11.0 / 剝離修補 14.2。鈍傷佔外傷性青光眼約四成（隅角後退）。
//   所以**四種病都有依據，但幅度不一樣**：剝離最高（急性、當下就在惡化）、
//   糖尿病次之（外傷誘發玻璃體出血）、白內障與青光眼中等、黃斑部最低。
//   （誠實的但書：外傷性青光眼常是遲發的，平均間隔 25 個月，而且是「多生一個病」
//     不是「加速既有的病」。遊戲壓成即時的病程跳躍，跟壓縮六天是同一種簡化。）
//
// muzzRec（槍口閃光的恢復時間）：**取代了原本的「每開一槍扣病程」**。
//   閃光致盲是視色素漂白，是暫時的：白天幾秒到兩分鐘、夜間 3–10 分鐘。
//   造成永久損傷的光性視網膜病變要日蝕直視／雷射／電焊那個等級，槍口閃光遠不到。
//   **所以扣病程沒有依據，扣掉了。**
//   但有依據的是恢復變慢：健康眼多半 30 秒內恢復到基線一行以內；
//   黃斑部病變者的光壓力恢復時間中位數早期 119.5 秒、晚期 198 秒（對照 80 秒），
//   另一份 133 人的研究中 62% 延遲、最長可達正常上限的六倍。
//   糖尿病黃斑水腫同樣會大幅延長。白內障是水晶體散射，也退得慢。
//   這個做法比扣病程好：醫學上對，而且**在喪屍面前瞎三秒比扣 0.15% 有感得多**。
//
// 後座力：**不做**。找不到像樣的臨床證據，能找到的都是打獵論壇的個人經驗。
//   有依據的「射擊造成眼傷」是瞄準鏡撞到眉骨，那是鈍挫傷，歸 head。
//   間接證據只有憋氣用力會升眼壓（臥推憋氣 +4.3 mmHg、Valsalva 16.4→24.0 mmHg），
//   但開槍不是 Valsalva。加了就是我們在編。霰彈槍要比手槍貴，
//   用「閃光更亮、恢復更久」表現就好，那個有依據。
//
// post = 手術之後還剩下多少病程（「來得及」那一版）。**這些數字有文獻依據，不要憑印象改。**
//   白內障 0.06  沒有其他眼疾的眼睛，術後矯正視力達 0.5 以上約 95%
//   剝離   0.22  黃斑部還貼著就開刀，約 90% 能到 0.5 以上（掀過去才開只剩約 28%）
//   糖尿病 0.40  雷射把風險減半，已出血／已缺血的地方是永久的
//   黃斑部 0.45  抗 VEGF 是「穩住」不是治好：九成兩年內沒再掉 15 個字母，但七年後三分之一仍變差
//   青光眼 null  **完全不降**——已經失去的視野不會回來，治療只能讓它慢下來。
//                所以手術後的畫面就是你走進醫院那一刻的畫面，一模一樣。
//                這比任何文字都能說明「青光眼沒有黃金時間可以搶」。
// 「來不及」那一版一律是 1.0。
var EDU_TAIL='這個遊戲把病程壓縮成七天，也把結果畫得比多數人實際會遇到的更重，\n是為了讓你在幾十分鐘內感覺得到。\n\n真實世界慢得多，而且每一種病失去視力的樣子都不一樣：\n有的是正中間那塊糊掉、有的是視野一圈一圈變窄、有的是整片蒙上一層霧。\n多數人不會走到眼前全黑，也不是每一種病都以全黑收場。\n但共通的是——已經失去的那一部分，回不來。\n\n上面的數字來自臨床試驗與大型研究的平均值，每個人的狀況都不一樣。\n眼睛有任何異狀，請找眼科醫師，不要拿這個遊戲當診斷依據。';

function buildEduk(){
  var box=document.getElementById('eduktiles'); box.innerHTML='';
  EDU_CARDS.forEach(function(c){
    var d=document.createElement('div');
    d.className='ek'; d.dataset.k=c.k;
    var h=document.createElement('b'); h.textContent=c.t;
    var s=document.createElement('em'); s.textContent=c.s;
    var b=document.createElement('div'); b.className='ekb'; b.textContent=c.b;
    d.appendChild(h); d.appendChild(s); d.appendChild(b); box.appendChild(d);
  });
  // 一次只開一張。不然卡片會一路長下去，「開始」按鈕被推到很遠的地方
  box.addEventListener('click',function(e){
    var t=e.target; while(t&&t!==box&&!t.classList.contains('ek')) t=t.parentNode;
    if(!t||t===box) return;
    var was=t.classList.contains('open');
    Array.prototype.forEach.call(box.children,function(x){x.classList.remove('open');});
    if(!was){ t.classList.add('open'); t.scrollIntoView({block:'nearest'}); }
  });
}

// 顳側弧光。文獻上這種閃光常常一次連閃兩三下，所以排成一小串
function fireArc(t0){
  if(!S.arcs) S.arcs=[];
  var n=1+(Math.random()<0.40?1:0);
  var base=(Math.random()-0.5)*1.5;              // 這一串出現在弧的哪一段
  for(var i=0;i<n;i++)
    S.arcs.push({t:t0+i*(0.14+Math.random()*0.13),
                 a:base+(Math.random()-0.5)*0.35,
                 s:0.75+Math.random()*0.5});     // 每一下的強度也不一樣
  if(S.arcs.length>8) S.arcs.splice(0,S.arcs.length-8);
}

// 把病程強度寫進各條件的左右眼通道
function applyVision(sev,smooth,dt){
  var t={detach:[0,0],floaters:[0,0],glauc:[0,0],amd:[0,0],cat:[0,0],dr:[0,0]};
  var second=DZ.eyes==='both'?0.86:0;      // 雙側疾病的另一眼通常較輕
  function set(name,v){ t[name]=[v*second,v]; }
  // 眼藥水只緩解乾澀與飛蚊的干擾感，不動病程——這是設計上的誠實界線
  var relief=(S.relief>0)?0.45:1;
  if(DZ.key==='detach'){ set('detach',sev); t.floaters=[0,DZ.floaters*relief]; }
  else if(DZ.key==='glauc') set('glauc',sev);
  else if(DZ.key==='amd')   set('amd',sev);
  else if(DZ.key==='cat')   set('cat',sev);
  else if(DZ.key==='dr'){   set('dr',sev); set('cat',sev*U.uDrP.value.w);
    t.floaters=[DZ.floaters*second*relief,DZ.floaters*relief]; }
  // 診斷用：關掉所有症狀，只看場景本身。用來分辨「畫面暗」是燈暗還是眼睛
  if(TUNE.noSym){ for(var kk in t) t[kk]=[0,0]; }
  var map={detach:U.uDetach,floaters:U.uFloat,glauc:U.uGlauc,amd:U.uAmd,cat:U.uCat,dr:U.uDr};
  Object.keys(map).forEach(function(k){
    var u=map[k].value, v=t[k];
    if(smooth){ var s2=Math.min(1,dt*6); u.x+=(v[0]-u.x)*s2; u.y+=(v[1]-u.y)*s2; }
    else { u.x=v[0]; u.y=v[1]; }
  });
}

// 測試用：確保背包裡至少有一盒備彈。正式的取得流程之後再做
function giveAmmo(kind){
  kind=kind||'p';
  if(!S.bag) S.bag=[];
  for(var i=0;i<S.bag.length;i++) if(S.bag[i].ammo===kind&&(S.bag[i].rounds|0)>0) return;
  var d=copyOf(kind==='s'?AMMO_S:AMMO_P);
  d.rounds=(kind==='s'?TUNE.sgBox:TUNE.ammoBox);
  if(S.bag.length<BAG_MAX){ S.bag.push(d); bagCount(); }
}
var DAY1_START=DZ.start;
function startDay(n){

  S.day=n; S.phase='run'; S.st=100; S.got=0;

    S.jSprint=0; S.jHead=0; S.jGun=0; S.jHeadN=0; S.jSprintT=0; S.jShotP=0; S.jShotS=0;

  S.spawnT=0;
  vx=vz=0; blocking=false; sprinting=false; shake=0; hintT=0;

  S.reload=0; S.reloadBox=null; S.reloadTake=0; S.reloadKind=null;
  S.muzzAt=-99; S.fromGun=0; S.shotsP=0; S.shotsS=0;
  S.muzzK=1; S.muzzD=1; S.muzzZ=1; S.pumpT=0;
  S.arcs=[]; S.lastArc=-99; S.lastYaw=undefined; U.uArc.value.set(0,0);

  if(n>=3) S.torch=true;

  // 自己想起「我有這東西」，如果自動亮著，那個記憶點就沒有了。

  if(n===4){
    // 霰彈槍改成 Day 5 在隧道裡撿，這裡不再直接發
    S.weap.axe=true; S.weap.gun=true;
    if((S.bot|0)<TUNE.botN) S.bot=TUNE.botN;
    if((S.mag|0)<TUNE.gunMag) S.mag=TUNE.gunMag;
    giveAmmo('p');
  }
  if(n===5){                                   // 跳關進來的話補上前面該有的東西
    S.weap.axe=true; S.weap.gun=true;
    if((S.bot|0)<TUNE.botN) S.bot=TUNE.botN;
    if((S.mag|0)<TUNE.gunMag) S.mag=TUNE.gunMag;
  }
  if(n===6){
    // 從測試入口跳進 Day 6 的話，**要重現「彈盡＋眼睛快壞」那個狀態**，
    // 否則測到的是一個假的最後一關：拿著滿彈匣的手槍走完，兩條曲線根本沒有交會。
    // 所以五把武器都給，但兩把槍是空的、背包裡也沒有備彈。

    if((S.bot|0)<TUNE.botN) S.bot=TUNE.botN;
    if(S.jumpEmpty){
      S.mag=0; S.smag=0;
      S.bag=(S.bag||[]).filter(function(b){ return !b.ammo; });
      S.jumpEmpty=false;
    }
  }
  if(typeof S.bot!=='number') S.bot=0;
  if(typeof S.mag!=='number') S.mag=0;
  if(typeof S.smag!=='number') S.smag=0;
  wIdx=0; showWeapon();
  U.uFade.value=0; hud.classList.add('on'); hud.style.opacity='';
  hintEl.style.opacity=1;
  document.getElementById('objmsg').style.opacity=0;

  if(n===1){
    S.prog=DAY1_START; S.startProg=DAY1_START;

    document.getElementById('eye').style.display='';
    document.getElementById('eyelabel').textContent=(DZ.eyes==='both'?'雙眼':'右眼')+' · '+DZ.name;
    document.getElementById('objlabel').textContent='補給';
    document.getElementById('tot').textContent='3';
    hintEl.textContent='沿街往前 · 三箱補給後從街尾右側的鐵捲門離開 · 太陽在你右手邊';
    buildDay2();
  } else if(n===5){
    S.startProg=S.prog;
    if(S.origin===undefined) S.origin=DAY1_START;
    setFog(0x070c0e,7,38);      // 霧從 2 公尺開始等於伸手不見五指，改成 7
    document.getElementById('eye').style.display='';
    document.getElementById('eyelabel').textContent=(DZ.eyes==='both'?'雙眼':'右眼')+' · '+DZ.name;
    document.getElementById('objlabel').textContent='補給';
    document.getElementById('tot').textContent='3';
    document.getElementById('objmsg').textContent='盡頭的爬梯可以上去';
    hintEl.textContent='這裡幾乎全黑 · 用走的 · 水聲會傳出去 · 出口是隧道盡頭的爬梯';
    buildDay5();
  } else if(n===6){
    S.startProg=S.prog;
    if(S.origin===undefined) S.origin=DAY1_START;
    // 傍晚的空氣，遠處是灰藍的。霧不要太近——這一關的重點是
    // **全程看得到那棟樓**，霧把它吃掉的話「有目標可以走」就沒了
    setFog(0x39434b,22,110);
    document.getElementById('eye').style.display='';
    document.getElementById('eyelabel').textContent=(DZ.eyes==='both'?'雙眼':'右眼')+' · '+DZ.name;
    document.getElementById('objlabel').textContent='目標';
    document.getElementById('tot').textContent='—';
    document.getElementById('objmsg').textContent='走到醫院大門';
    hintEl.textContent='醫院就在前面 · 跟著地上的引導線走';
    buildDay6();
    document.getElementById('got').textContent='—';
    document.getElementById('objmsg').style.opacity=1;
  } else if(n===3){
    S.startProg=S.prog;
    if(S.origin===undefined) S.origin=DAY1_START;
    setFog(0x2e3538,8,28);
    document.getElementById('eye').style.display='';
    document.getElementById('eyelabel').textContent=(DZ.eyes==='both'?'雙眼':'右眼')+' · '+DZ.name;
    document.getElementById('objlabel').textContent='調劑室';
    document.getElementById('tot').textContent='1';
    document.getElementById('objmsg').textContent='隨時可以離開藥局';
    hintEl.textContent='貨架上是成藥 · 眼科的藥在最裡面的調劑室 · 門要按住撬開';
    S.rxSeen=false;
    buildDay3();
  } else {
    S.startProg=S.prog;
    if(S.origin===undefined) S.origin=DAY1_START;   // 萬一直接從 Day 4 開始
    setFog(0x080b0d,3,26);

    document.getElementById('objlabel').textContent='補給';
    document.getElementById('tot').textContent='3';
    hintEl.textContent='找到三箱補給後前往走廊盡頭 · 這裡很暗，你左手有手電筒';

  // 場景蓋完了才檢查——**一定要在最後**，因為障礙物是一路加上去的，
  // 在中途檢查等於只檢查了當下已經存在的那幾個
  var fx=fixPickups();
  if(fx.moved||fx.stuck)
    log('撿取物檢查：共 <b>'+fx.n+'</b> 個，挪開被埋住的 <b>'+fx.moved+
        '</b> 個'+(fx.stuck?'，<b>'+fx.stuck+'</b> 個找不到空位':''),
        fx.stuck?'bad':'ok');
  // Three.js 是**第一次真的畫到某個材質的時候**才編譯它的 shader。
  // 所以走進一個還沒看過的區域（第一次看到木棧板、第一次看到鐵貨箱）
  // 就會卡一下——而衝刺時你把新東西掃進畫面的速度是走路的兩倍多，

  // renderer.compile() 把場上所有材質先編譯完，這一下發生在卡片還蓋著的時候。
  try{ var ct0=performance.now(); renderer.compile(scene,camera);
       log('shader 預先編譯 '+Math.round(performance.now()-ct0)+' ms'); }
  catch(e){ log('預先編譯失敗（不影響遊玩）：'+(e.message||e)); }
  S.spawned=0;
  bagCount(); bagHide();
  // 環境音：這一關的底噪，淡入兩秒。**進關才開，不是開場就開**——

  heartStop(); ambPlay(n);

  applyVision(S.prog,false);

  log('Day '+n+' 場景：物件 <b>'+level.children.length+'</b>　燈 <b>'+lightReg.length+
      '</b>　相機 z=<b>'+camera.position.z.toFixed(1)+'</b>　亮度 <b>'+(bScene+1)+'</b>',
      level.children.length>0?'ok':'bad');

// 結算數字。journey=true 就改用整趟旅程的累計（六天加起來），
// 那才是最後一關該給的帳——一關一關的小計在中途已經看過了
function fillStats(journey){
  var pct=function(v){return Math.round(v*100)+'%';};
  var st0=journey?(S.origin!==undefined?S.origin:DAY1_START):S.startProg;
  var sp=journey?(S.jSprint||0):S.fromSprint;
  var hd=journey?(S.jHead||0):S.fromHead;
  var gn=journey?(S.jGun||0):(S.fromGun||0);
  var hn=journey?(S.jHeadN||0):S.headHits;
  var stm=journey?(S.jSprintT||0):S.sprintT;
  var np=journey?(S.jShotP||0):(S.shotsP|0);
  var ns=journey?(S.jShotS||0):(S.shotsS|0);
  // 自然惡化用「總共掉了多少」減掉「自己花掉的」反推，
  // 這樣不管中間經過幾張過場卡片（每張 +0.01）都算得對
  var tm=Math.max(0,S.prog-st0-sp-hd-gn);
  document.getElementById('s0').textContent=pct(st0);
  document.getElementById('s1').textContent='+'+pct(journey?tm:S.fromTime);
  // 衝刺對青光眼／黃斑部／白內障是 0——**這一格不是 bug，是這個遊戲最想講的一件事**。
  // 有氧運動反而會降眼壓。與其顯示一個看起來像壞掉的 +0%，不如把理由講出來
  var noSprint=!(DZ.sprint>0);
  document.getElementById('s2lab').textContent=noSprint?'衝刺':'衝刺代價';
  document.getElementById('s2').textContent=noSprint
    ?('跑了 '+Math.round(stm)+' 秒 · 這種病不會因此惡化')
    :('+'+pct(sp)+'（衝刺 '+Math.round(stm)+' 秒）');
  document.getElementById('s3').textContent='+'+pct(hd)+'（'+hn+' 次）';
  var sw=[];
  if(np) sw.push('手槍 '+np+' 發');
  if(ns) sw.push('霰彈 '+ns+' 發');
  // 開槍不再扣病程（沒有依據），但這一行還是要留著——**它報告的是事實，不是帳**。
  // 玩家開了幾槍、以及「你有沒有注意到開完槍要等比較久才看得見」，
  // 才是這個機制真正在教的東西
  document.getElementById('s5row').style.display=(np+ns>0)?'':'none';
  document.getElementById('s5lab').textContent='開槍';
  document.getElementById('s5').textContent=
    (np+ns>0)?(sw.join(' · ')+'　閃光不扣病程，但恢復變慢'):'';
  document.getElementById('s4').textContent=pct(S.prog);
  var av=sp+hd+gn;
  var lever=noSprint?'少被打中頭':'少衝刺、少被打中頭';
  document.getElementById('verdict').textContent= av<0.02
    ?'你走得很謹慎。這一趟失去的視力幾乎全是時間造成的——那部分你擋不住，只能盡快就醫。'
    :'其中 '+pct(av)+' 是你自己花掉的。'+lever+'，這些視力還會留著。';
}

// 程序化貼圖要花時間算（法線圖是逐像素跑的），在進關卡當下算會卡一下。
// 玩家在讀開場卡片的那幾秒是**免費的時間**，先在背景把它算好。
// day4Mats() 自己有快取，所以就算玩家搶先跳關進去也只是照算一次，不會算兩遍。
// 用 setTimeout 而不是直接呼叫：讓開場卡片先畫出來，不然畫面會先黑一下
// 六關的程序化材質全部算完約 1.8 秒（伺服器 CPU），一次算完會卡住開場。
// 所以排成一個佇列，**一次只算一關**，而且只在卡片顯示中才算——
// 卡片是玩家在讀字的時間，本來就是免費的；遊戲進行中算會掉幀。
// 順序：Day 1 先（馬上要用），Day 4 第二（最重的一關）。
var MATQ=[day1Mats,day4Mats,day2Mats,day3Mats,day5Mats,day6Mats];
function warmMats(){
  if(!MATQ.length) return;
  var card=document.getElementById('card');
  if(!card||!card.classList.contains('show')){ setTimeout(warmMats,1500); return; }  // 玩到一半就先等
  var f=MATQ.shift(), t0=performance.now();
  try{ f(); log('材質預熱 '+Math.round(performance.now()-t0)+' ms，還剩 '+MATQ.length+' 關'); }
  catch(e){ log('材質預熱失敗：'+(e.message||e),'bad'); }
  setTimeout(warmMats,60);
}

var memSave=null;
function enterMemory(){
  // 以前這裡只記了場景，回來時的霧與亮度是**寫死停車場那一組**的。
  // Day 5 之後就不對了（隧道回來會變成停車場的霧），Day 6 更不對。

  memSave={g:level, solids:solids.slice(), lamps:lamps.slice(), sups:sups.slice(),
           zs:zs.slice(), reg:lightReg.slice(), torch:torchBase,
           fog:scene.fog?{c:scene.fog.color.getHex(),n:fogBase.near,f:fogBase.far}:null,
           bright:bScene+1,
           cam:{x:camera.position.x,y:camera.position.y,z:camera.position.z},
           vyaw:S.viewYaw||0};
  level.visible=false;
  level=new THREE.Group(); scene.add(level);
  buildDay1();                       // 相機會被擺回 Day 1 的出生點與朝向

  put(solids,memSave.solids); put(lamps,memSave.lamps); put(sups,memSave.sups);
  put(zs,memSave.zs); put(lightReg,memSave.reg);

// ================================================================ 結局過場
// 原本規劃是一整關的 Day 7 醫院內部。2026-08 決定砍掉那一關，
// **但兩種結局與片尾衛教字卡不能一起砍**——那是這個作品存在的理由。
// 所以壓縮成 Day 6 的結尾過場：走到大門 → 進門 → 黑場 → 手術後的視野 → 字卡。
//
// 這裡做的是「黑場之後」的整段，做成可以獨立呼叫的一支，Day 6 蓋好之後直接接上去。
// 現在先掛在隱藏測試入口的兩顆按鈕上，這樣不用等 Day 6 就看得到收尾。
//
// **手術後的畫面刻意用第一天早上的公寓**：跟開場一模一樣的視角，
// 玩家可以直接把「現在」疊到「那時候」上面。不需要任何說明文字。
function buildSurgeryView(){
  clearLevel(); buildDay1();
  for(var i=0;i<sups.length;i++) hideSup(sups[i]);   // 結局畫面不該有補給箱（同樣不能關整個群組）
  camera.position.set(-1.6,1.62,-9.0); S.viewYaw=Math.PI; yaw=Math.PI; pitch=0;
  setFog(0x2a2e30,6,22); setSceneBright(SCENE_BRIGHT[1]||3,false);
  setTorch(0); TORCH_M.visible=false;
  rightArm.visible=false; leftArm.visible=false;            // 手術後手上不拿東西
  CROSS.visible=false;
}
function startEnding(inTime){
  S.inTime=!!inTime;
  // 「來得及」降到這種病手術後該有的殘餘值。post 是 null（青光眼）＝完全不降；
  // 而且永遠不會比你走進醫院時更好——手術不會讓你比原本看得更清楚
  S.postProg=inTime?(DZ.post!=null?Math.min(S.prog,DZ.post):S.prog):1.0;
  S.phase='surgery'; S.endT=0; S.sgStep=0;
  document.getElementById('card').classList.remove('show');

}
function finishDay(won){
  if(S.phase!=='run')return;
  S.won=won;
  heartStop();
  // 整趟旅程的帳，在這裡累加（每一關的 from* 下一關就會被歸零）
  S.jSprint=(S.jSprint||0)+S.fromSprint; S.jHead=(S.jHead||0)+S.fromHead;
  S.jGun=(S.jGun||0)+(S.fromGun||0);     S.jHeadN=(S.jHeadN||0)+S.headHits;
  S.jSprintT=(S.jSprintT||0)+S.sprintT;
  S.jShotP=(S.jShotP||0)+(S.shotsP|0);   S.jShotS=(S.jShotS||0)+(S.shotsS|0);
  // 鑽過鐵捲門離開街道 / 藥局。**聲音是關卡真正的句點**——
  // 黑場之前先讓玩家聽到門在身後關上，那一關才算走完
  if(won && (S.day===2||S.day===3)) snd('shutter',{vol:0.75,rate:0.98});
  ambStop(1.4);
  if(S.day===1){
    S.phase='card'; S.prog=Math.min(1,S.prog+0.01);   // 一天過去（原本是兩天，中間補上 Day 2）
    hud.classList.remove('on');
    showCard('day1done');
  } else if(S.day===2){
    S.phase='card'; S.prog=Math.min(1,S.prog+0.01);   // 一天過去
    hud.classList.remove('on');
    showCard('day2done');
  } else if(S.day===4){
    S.phase='card'; S.prog=Math.min(1,S.prog+0.01);   // 一天過去
    hud.classList.remove('on');
    showCard('day4done');
  } else if(S.day===3){
    S.phase='card'; S.prog=Math.min(1,S.prog+0.01);   // 一天過去
    hud.classList.remove('on');
    showCard('day3done');
  } else if(S.day===5){
    S.phase='card'; S.prog=Math.min(1,S.prog+0.01);   // 一天過去
    hud.classList.remove('on');
    showCard('day5done');
  } else if(S.day===6 && !won){
    // **死在最後一關仍然要看到衛教字卡**（作者決定）。
    // 字卡是這個作品存在的理由，不該因為玩家在門口打輸了就看不到。
    // 沒有手術過場——他沒有走進去，那一段不會發生
    S.phase='card'; hud.classList.remove('on');
    showCard('day6dead');
  } else {
    S.phase='ending'; S.endT=0; S.memStep=0; S.viewYaw=0;
    // 範圍改成由關卡自己提供（以前寫死停車場的 -92/6，接上 Day 5 之後就不對了）
    // 倒帶的鏡頭：走廊型的關卡沿 z 退幾公尺就好，但 Day 6 是 L 形的，
    // 「z 退幾公尺」會退到牆裡去。所以關卡可以自己指定一個 reviewPose
    var rx=0, rz, ry6=0;
    if(reviewPose){ rx=reviewPose.x; rz=reviewPose.z; ry6=reviewPose.yaw||0; }
    else {
      var RR=S.reviewRange||[-92,6], ZF=RR[0], ZN=RR[1];
      rz=Math.max(ZF+14,Math.min(ZN-4,camera.position.z+11));
    }
    S.reviewX=rx; S.reviewZ=rz; S.viewYaw=ry6;
    camera.position.set(rx,1.62,rz); yaw=ry6; pitch=.02;
    blocking=false; sprinting=false; vx=vz=0;
    if(S.reviewLight){S.reviewLight.intensity=1.5*LM();S.reviewLight.position.set(rx,3.0,rz-7);}
    hud.classList.remove('on');
  }
}

function hurt(dmg,head){
  if(S.phase!=='run'||TUNE.god)return;
  if(S.inspect) inspectEnd(false);              // 被打到就會鬆手
  if(S.bagOpen) bagHide();
  // 裝填到一半被打中就會掉彈匣。子彈不會被扣掉，但那一秒半白花了
  if(S.reload>0){ var wasShell=(S.reloadKind==='shell'); cancelReload();
    snd(wasShell?'shell_in':'reload_mag',{vol:0.45,rate:0.80,lp:1600});
    tip('rdrop',wasShell?'手一鬆，那一發霰彈掉了':'裝填被打斷了'); }
  var d=blocking?dmg*TUNE.blockMul:dmg; S.hp-=d;
  // 被打中頭的代價**改成分病**（每一種病的值在 DISEASES 裡，見那一段的文獻註解）。
  // TUNE.head 從「代價本身」變成「全域倍率」，調參面板拉它就是五種病一起縮放
  if(head&&!blocking){

function atkDown(){
  if(S.phase!=='run'||S.inspect||S.bagOpen) return;
  var w=W();
  if(S.reload>0){
    // 霰彈槍是一發一發填、每一發推進去就算數，所以隨時可以停手先開一槍。

    // 手槍是換整個彈匣，中途打斷沒有意義，維持原本的「閃一下按鈕」
    if(w.key==='sg' && S.reloadKind==='shell' && (S.smag|0)>0){ cancelReload(); }
    else { flashAtk(); return; }

// ================================================================ 手電筒
// **手電筒不是武器。** 它是照明道具，佔住左手。
// 它真正的代價不是「傷害低」，是它會拿走你別的能力——開著就不能拿雙手武器。
// 不做電池：這遊戲的倒數計時器只有一個，就是眼睛。
function torchSet(on){
  S.torchOn=!!on && !!S.torch;
  TORCH_M.visible=S.torchOn;
  torch.angle=TUNE.torchAng; torch.penumbra=TUNE.torchPen; torch.distance=24;
  torch.target.position.set(-.05,0,-8);
  TB.kx=0; TB.ky=0; TB.drop=0; TB.insp=0;        // 收起來再拿出來，光束從正的開始
  setTorch(S.torchOn?TUNE.torchInt:0);
  torchBtn();
}
// ---- 光束的偏移 ----
// 燈掛在相機上，目標點每一幀重算：基準方向 + 走路晃 + 攻擊甩 + 格擋垂 + 檢視轉向。
// 這是手電筒真正的機制，不是特效——每一種反應都在拿走你一點視野。
var TB={kx:0,ky:0,drop:0,insp:0};
// 右手揮出去，左手一定會往反方向帶。所以**每揮一次，就有一瞬間看不到你正在打的東西**。
// 丟瓶子是在「出手」時才呼叫（蓄力期間左手沒動，光要完全穩定）。
function torchFling(){
  if(!S.torchOn) return;
  TB.kx=-TUNE.torchSwing; TB.ky=-TUNE.torchSwing*0.42;
}
// Day 2 的眩光。做法很輕：只是在亮度系統算出來的曝光上，再依「有多正對太陽」往上推。
// 沒有新規則、沒有新 UI——玩家自己會發現往右看會刺眼、走陰影裡會好一點。
// 這裡不碰 uFlash 也不碰 uMuzz：那是眼睛自己的閃光與槍口後像，跟外面的太陽是兩件事。
// 手電筒閃兩下再穩定下來。**這是劇本事件不是資源管理**——
// 想要「電快沒了」的緊張感，做成一次性的嚇一跳就好；
// 做成要管理的電量等於加了第二個計時器，會稀釋核心。
function torchFlicker(){
  var seq=[[0,.18],[.10,1],[.22,.10],[.34,1],[.46,.06],[.72,.72],[1.10,1]];
  seq.forEach(function(st){
    setTimeout(function(){
      if(!S.torchOn) return;
      setTorch(TUNE.torchInt*st[1]);
      if(st[1]<.2) noise(.05,1800,.10,-.35);
    }, st[0]*1000);
  });
  setTimeout(function(){ if(S.torchOn) tip('flick','燈閃了兩下 · 這裡的空氣有點濕'); },1300);
}
function updateGlare(dt){
  var tg=0;
  if(S.day===2){
    var fx=-Math.sin(yaw), fz=-Math.cos(yaw);
    var al=Math.max(0, fx*SUN.x+fz*SUN.z);
    // 陰影的邊界要平順，不然走過那條線畫面會跳一階
    var sh=Math.max(0,Math.min(1,(camera.position.x-SHADE_X)/1.4));
    tg=Math.pow(al,TUNE.sunPow)*(1-sh*TUNE.sunShade);
  }
  S.glare=(S.glare||0)+(tg-(S.glare||0))*Math.min(1,dt*TUNE.sunAdapt);
  U.uGain.value=gainBase*(1+S.glare*TUNE.sunGlare);
}
function updateTorchBeam(dt,mag,running){
  if(!S.torchOn) return;
  // 1. 走路／衝刺：bob 本來就會隨速度加快，所以只要給振幅，頻率自己會對
  var amp=running?TUNE.torchRun:(mag>.05?TUNE.torchWalk*mag:0);
  var sx=Math.sin(bob*1.0+1.1)*amp*0.55;
  var sy=Math.sin(bob*2.0)*amp;                  // 上下為主，跟腳步同一個節奏
  // 2. 揮擊甩出去的衝量，每幀衰減
  var kr=Math.min(1,dt*(3/Math.max(0.02,TUNE.torchSwingT)));
  TB.kx-=TB.kx*kr; TB.ky-=TB.ky*kr;
  if(Math.abs(TB.kx)<0.002) TB.kx=0;
  if(Math.abs(TB.ky)<0.002) TB.ky=0;
  // 3. 格擋：垂下去很快（擋是反射動作），回正才慢——那 0.35 秒是你付的代價
  var wd=blocking?1:0;
  TB.drop+=(wd-TB.drop)*Math.min(1,dt/(wd?0.05:Math.max(0.05,TUNE.torchDrop)*0.40));
  // 4. 檢視：光轉到手上的東西，周圍全黑
  TB.insp+=((S.inspect?1:0)-TB.insp)*Math.min(1,dt*8);

  var tx=-0.05+sx+TB.kx, ty=sy+TB.ky, tz=-8;
  // 格擋：照地面，前方黑掉
  tx=tx+(-0.40-tx)*TB.drop; ty=ty+(-3.20-ty)*TB.drop; tz=tz+(-2.40-tz)*TB.drop;
  // 檢視：轉向手上那個盒子
  tx=tx+(0.00-tx)*TB.insp; ty=ty+(-0.10-ty)*TB.insp; tz=tz+(-0.90-tz)*TB.insp;
  torch.target.position.set(tx,ty,tz);
  // 檢視時把光錐收窄、照射距離縮短、亮度壓下來——三件事一起做才會「周圍全黑」，
  // 只調亮度的話近的東西還是會過曝
  torch.angle=TUNE.torchAng*(1-0.42*TB.insp);
  torch.distance=24-21*TB.insp;
  setTorch(TUNE.torchInt*(1-(1-TUNE.torchInsp)*TB.insp));
}

function oneHandIdx(){

function toggleTorch(){
  if(S.phase!=='run'||S.inspect||S.bagOpen) return;
  if(!S.torch){ toast('你身上沒有手電筒'); return; }
  if(S.torchOn){ torchSet(false); toast('收起手電筒'); torchClick(false); return; }
  // 手上是雙手武器 → 自動換回上一把單手武器，不要跳出來說「不行」
  if(W().hands===2){
    var n=oneHandIdx();

    var was=W().name;
    swapW(n,true);
    torchSet(true);
    toast('收起'+was+' · 換'+W().name+'（手電筒要用左手）');
  } else {
    torchSet(true);
    toast('手電筒');
    tip('torch2','拿消防斧或槍的時候會自動收起來——那兩把要兩隻手');

}
