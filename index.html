// 一列滑桿。get/set 讀寫真正的變數，所以拉完立刻生效
function slider(label,min,max,step,get,set,fmt){
  var d=document.createElement('div'); d.className='drow';
  var l=document.createElement('label'); var v=document.createElement('span');
  l.textContent=label; l.appendChild(v);
  var r=document.createElement('input'); r.type='range';
  r.min=min; r.max=max; r.step=step;
  function show(){ v.textContent=(fmt?fmt(get()):get()); r.value=get(); }
  r.addEventListener('input',function(){ set(parseFloat(r.value)); show(); });
  d.appendChild(l); d.appendChild(r); body.appendChild(d);
  rows.push(show); show();
}
function toggles(items){
  var d=document.createElement('div'); d.className='drow dbtns';
  items.forEach(function(it){
    var b=document.createElement('div'); b.className='dbtn'; b.textContent=it.label;
    function show(){ b.classList.toggle('on',!!it.get()); }
    b.addEventListener('click',function(){ it.set(!it.get()); show(); });
    d.appendChild(b); rows.push(show); show();
  });
  body.appendChild(d);
}
function picker(items,current,onpick){
  var d=document.createElement('div'); d.className='drow dbtns'; var bs=[];
  items.forEach(function(it){
    var b=document.createElement('div'); b.className='dbtn'; b.textContent=it.label; bs.push(b);
    b.addEventListener('click',function(){
      onpick(it.value);
      bs.forEach(function(x,i){x.classList.toggle('on',items[i].value===current());});
      rows.forEach(function(f){f();});
    });
    d.appendChild(b);
  });
  body.appendChild(d);
  rows.push(function(){bs.forEach(function(x,i){x.classList.toggle('on',items[i].value===current());});});
}

sec('場景檢查');
(function(){
  var d=document.createElement('div'); d.className='drow dbtns';
  var b=document.createElement('div'); b.className='dbtn'; b.textContent='通道檢查（沿中線掃碰撞箱）';
  b.style.flexBasis='100%';
  // 藥局第一版的櫃檯碰撞箱橫跨走道，把通往調劑室的門整個封死——
  // 門會開、燈會亮，走過去就是走不過。用程式掃比自己走一遍可靠得多
  b.addEventListener('click',function(){
    if(!bounds){ toast('沒有場景'); return; }
    var z0=bounds[3], z1=bounds[2], bad=[], run=null;
    for(var z=z0; z>=z1; z-=0.1){
      var open=false;
      for(var x=bounds[0]; x<=bounds[1]; x+=0.25) if(!blockedAt(x,z)){ open=true; break; }
      if(!open){ if(!run) run=[z,z]; else run[1]=z; }
      else if(run){ bad.push(run); run=null; }
    }
    if(run) bad.push(run);
    if(!bad.length){ toast('通道檢查：整條路都走得通'); log('通道檢查：<b>通過</b>','ok'); }
    else {
      toast('通道檢查：'+bad.length+' 段被封死');
      log('通道檢查：<b>'+bad.length+' 段封死</b> '+bad.map(function(r){
        return 'z '+r[0].toFixed(1)+'~'+r[1].toFixed(1); }).join('、'),'bad');
    }
  });
  d.appendChild(b);
  // 沿中線掃只對「走廊型」的關卡有效。Day 6 是 L 形而且有分岔，
  // 中線根本不經過急診車道與正門前庭——所以要改用洪水填充：
  // 從出生點開始，每 0.5 公尺一格往四周漫延，漫得到出口才算通。
  // **蓋完新場景一定要按這一顆**，比自己走一遍可靠得多
  var b2=document.createElement('div'); b2.className='dbtn';
  b2.textContent='連通檢查（洪水填充 · 走得到出口嗎）'; b2.style.flexBasis='100%';
  b2.addEventListener('click',function(){
    if(!bounds||!exitZone){ toast('沒有場景或沒有出口'); return; }
    var G=0.5;
    var x0=bounds[0]+0.6, x1=bounds[1]-0.6, z0=bounds[2]+0.6, z1=bounds[3]-0.6;
    var nx=Math.floor((x1-x0)/G)+1, nz=Math.floor((z1-z0)/G)+1;
    if(nx*nz>120000){ toast('場景太大，跳過'); return; }
    var seen=new Uint8Array(nx*nz);
    function idx(i,j){ return j*nx+i; }
    var si=Math.round((camera.position.x-x0)/G), sj=Math.round((camera.position.z-z0)/G);
    si=Math.max(0,Math.min(nx-1,si)); sj=Math.max(0,Math.min(nz-1,sj));
    var q=[idx(si,sj)]; seen[q[0]]=1; var cnt=0, reach=false;
    var NB=[[1,0],[-1,0],[0,1],[0,-1]];
    while(q.length){
      var c=q.pop(), ci=c%nx, cj=(c-ci)/nx; cnt++;
      if(Math.hypot(x0+ci*G-exitZone.x, z0+cj*G-exitZone.z)<exitZone.r) reach=true;
      for(var k=0;k<4;k++){
        var ni=ci+NB[k][0], nj=cj+NB[k][1];
        if(ni<0||nj<0||ni>=nx||nj>=nz) continue;
        var id2=idx(ni,nj); if(seen[id2]) continue;
        seen[id2]=1;
        if(blockedAt(x0+ni*G,z0+nj*G)) continue;    // 標記過但不往外擴＝那一格是牆
        q.push(id2);
      }
    }
    var area=Math.round(cnt*G*G);
    if(reach){ toast('連通檢查：走得到出口');
      log('連通檢查：<b>走得到出口</b>　可走面積約 '+area+' 平方公尺','ok'); }
    else { toast('連通檢查：走不到出口！');
      log('連通檢查：<b>出口不連通</b>　從出生點只走得到約 '+area+
          ' 平方公尺。出口在 x='+exitZone.x.toFixed(1)+' z='+exitZone.z.toFixed(1),'bad'); }
  });
  d.appendChild(b2);
  body.appendChild(d);
})();

// ================================================================ 武器邏輯
// 設計重點：揮空要讓玩家覺得「我看錯距離了」，不是「按鈕沒反應」。
// 靠四件事做到——(1) 起手絕對不延遲 (2) 揮空比命中更久才收得回來
// (3) 硬直期間手臂還在畫面上動 (4) 太遠／差一點／砍到柱子的聲音完全不同。
var P_IDLE=[-.12,.22,.30,.30,-.30,-.42];
var poseA=[0,0,0,0,0,0], poseB=[0,0,0,0,0,0], poseEnd=null, recTotal=0, push=0;
var kick=0, kickBack=0, yawKick=0;      // 後座：往上頂的量、要壓回來的量、左右的偏
function setPose(p){ rightArm.rotation.set(p[0],p[1],p[2]); rightArm.position.set(p[3],p[4],p[5]); }
function mixPose(a,b,t,out){ for(var i=0;i<6;i++) out[i]=a[i]+(b[i]-a[i])*t; return out; }
function fill(o,a,b,c,d,e,f){ o[0]=a;o[1]=b;o[2]=c;o[3]=d;o[4]=e;o[5]=f; return o; }

function crowPose(p){ var a;
  if(p<0.30){a=p/0.30;      return fill(poseA,-.12+a*.75,.22+a*.35,.30+a*.30, .30+a*.14,-.30+a*.16,-.42+a*.16);}
  if(p<0.52){a=(p-0.30)/0.22;return fill(poseA,.63-a*1.55,.57-a*.85,.60-a*.95, .44-a*.42,-.14-a*.30,-.26-a*.34);}
  a=(p-0.52)/0.48;           return fill(poseA,-.92+a*.80,-.28+a*.50,-.35+a*.65, .02+a*.28,-.44+a*.14,-.60+a*.18);}

// 斧頭：**雙手斜劈**。舊版的數字算出來其實是由下往上撈再往前推，
// 看起來像單手拿著斧柄戳刺，不是劈。作者實測就是這麼回報的。
//
// 現在的三段：
//   0 ~ 0.45  舉起來——斧刃朝上、往右後方拉到肩膀上（rx 轉正 = 刃往上）
//   0.45~0.70 劈下來——rx 從 +0.98 一路掃到 -0.74，1.7 弧度的行程橫跨整個畫面，
//             同時從右上往左下切（ry 由負轉正、px 往左）。判定在 0.58，正好在弧的中段
//   0.70~1.0  刃停在左下方，幾乎不動。玩家在硬直時低頭就看得到斧頭還卡在下面，
//             這是「我揮空了」和「按鈕沒反應」之間唯一的差別
//
// 關鍵是**行程要夠長**。舊版 rx 只走 1.9 而且中段在畫面外，
// 看得到的部分就只剩前後位移，所以像戳的。
function axePose(p){ var a;
  if(p<0.45){a=p/0.45; a=a*a*(3-2*a);
                             return fill(poseA,-.12+a*1.10,.22-a*.46,.30+a*.52, .30+a*.13,-.30+a*.30,-.42+a*.16);}
  if(p<0.70){a=(p-0.45)/0.25; a=a*a*(3-2*a);
                             return fill(poseA,.98-a*1.72,-.24+a*.70,.82-a*1.02, .43-a*.30,.00-a*.44,-.26-a*.46);}
  // 收招不能再往下了：**斧刃要停在畫面裡**。再多劈 20 度刃就掉到畫面下緣外，
  // 低頭也看不到，「揮空了」和「當機了」的差別就沒了
  a=(p-0.70)/0.30;           return fill(poseA,-.74+a*.10,.46+a*.02,-.20+a*.04, .13+a*.02,-.44+a*.02,-.72+a*.02);}

// 瓶子：往後拉 → 甩出去。蓄力時停在拉滿的位置，蓄越久拉越後面
function botPose(p){ var a;
  if(p<0.55){a=p/0.55;       return fill(poseA,-.12+a*.70,.22+a*.50,.30+a*.18, .30+a*.12,-.30+a*.30,-.42+a*.30);}
  a=(p-0.55)/0.45;           return fill(poseA,.58-a*.86,.72-a*.50,.48-a*.18, .42-a*.18,.00-a*.26,-.12-a*.26);}
function chargePose(c){ var a=Math.min(1,c/Math.max(0.05,TUNE.botCharge));
  return fill(poseA,-.12+a*.62,.22+a*.44,.30+a*.16, .30+a*.10,-.30+a*.26,-.42+a*.26);}

// 手槍：槍口往上跳，然後慢慢壓回來。跟冷兵器的「揮」完全不同的節奏
function gunPose(p){ var a;
  if(p<0.14){ a=p/0.14;
    return fill(poseA,-.12+a*.34,.22-a*.05,.30-a*.09, .30-a*.015,-.30+a*.055,-.42+a*.05); }
  a=(p-0.14)/0.86; a=a*a;
  return fill(poseA,.22-a*.34,.17+a*.05,.21+a*.09, .285+a*.015,-.245-a*.055,-.37-a*.05); }

// 霰彈槍：後座把整把槍往上往後掀，然後慢慢壓回來。
// 比手槍慢一倍、幅度大一倍，玩家用身體就感覺得到「這一發代價很大」
function sgPose(p){ var a;
  if(p<0.10){ a=p/0.10;
    return fill(poseA,-.12+a*.52,.22-a*.03,.30-a*.12, .30-a*.02,-.30+a*.10,-.42+a*.10); }
  a=(p-0.10)/0.90; a=a*a;
  return fill(poseA,.40-a*.52,.19+a*.03,.18+a*.12, .28+a*.02,-.20-a*.10,-.32-a*.10); }

// 裝填：把彈匣拿到眼前再推回去。動作要看得見，
// 因為後期在暗處低頭裝填的那一秒半，本身就是這把武器的代價
function reloadPose(k){
  var a=Math.sin(Math.min(1,Math.max(0,k))*Math.PI);
  return fill(poseA,-.12-a*.52,.22+a*.26,.30+a*.50, .30-a*.16,-.30+a*.22,-.42+a*.12); }

function recStart(sec){ recover=sec; recTotal=sec; }

// ---- 左手 ----
// 兩種完全不同的狀態：
//   單手武器（或空手）→ 原本的待機／格擋姿勢，平滑收斂
//   雙手武器          → 左手**真的握上去**，直接跟著右手走（不平滑，不然握點會脫開）
// 握點是「右手的座標系裡的一個偏移」，所以右手怎麼揮、左手就怎麼跟。
var LOFF=new THREE.Vector3();
function updateLeftArm(dt){
  var w=W();
  if(w.hands===2&&S.phase==='run'&&!S.inspect){
    // 握點是「右手座標系裡的一個偏移」。**這幾個數字踩過一個坑**：
    // 第一版把左手放在右手後方（+z，柄的尾端），算出來落在螢幕右邊 0.33、
    // 距離相機只有 0.27 公尺——那個距離的畫面半寬只有 0.20，所以整隻手在畫面外。
    // 作者的回報是「槍枝系列都沒看到左手」，其實它一直在，只是看不到。
    // 現在一律往前（-z）、往左（-x）挪，握在柄／護木上看得到的那一段。
    var ox=-0.05, oy=-0.02, oz=-0.30;                // 消防斧：左手握在柄的前段
    if(w.key==='gun'){ ox=-0.147; oy=0.089; oz=-0.146; } // 手槍：左手從左側托住右手
    else if(w.key==='sg'){                                // 霰彈槍：左手放在前護木上
      var pm=WMESH.sg&&WMESH.sg.userData.pump;
      ox=-0.02; oy=-0.045; oz=pm?pm.position.z:-0.40;    // 泵動時護木往後拉，手跟著拉
    }
    LOFF.set(ox,oy,oz).applyEuler(rightArm.rotation);
    leftArm.rotation.set(rightArm.rotation.x,rightArm.rotation.y+0.10,rightArm.rotation.z+0.30);
    leftArm.position.set(rightArm.position.x+LOFF.x,
                         rightArm.position.y+LOFF.y,
                         rightArm.position.z+LOFF.z);
    // 裝填：手槍是左手把彈匣送上去，霰彈槍是一發一發從腰間拿到彈倉口。
    // 兩者都是「手沉到腰間、再舉回槍上」，只是霰彈槍每一發都做一次（所以看起來很忙）
    if(S.reload>0){
      var pr=1-S.reload/Math.max(0.001,S.reloadTot||1);
      var hip=Math.max(0,Math.min(1, pr<0.5 ? pr/0.22 : (0.86-pr)/0.34 ));
      leftArm.position.x+=(-0.30-leftArm.position.x)*hip;
      leftArm.position.y+=(-0.62-leftArm.position.y)*hip;
      leftArm.position.z+=(-0.28-leftArm.position.z)*hip;
      leftArm.rotation.x+=(-0.55-leftArm.rotation.x)*hip;
    }
    return;
  }
  // 單手武器或空手。拿著手電筒格擋時手腕壓得更低——光束也垂下去照地面，
  // 兩件事要對得上，不然會看到「手舉著、光卻在腳邊」
  var lt=blocking
    ?(S.torchOn?[-1.05,-.22,-.45,-.18,-.20,-.36]:[-.55,-.30,-.6,-.16,-.16,-.34])
    :[-.10,-.22,-.28,-.30,-.32,-.44];
  var kk=Math.min(1,dt*12);
  leftArm.rotation.x+=(lt[0]-leftArm.rotation.x)*kk;
  leftArm.rotation.y+=(lt[1]-leftArm.rotation.y)*kk;
  leftArm.rotation.z+=(lt[2]-leftArm.rotation.z)*kk;
  leftArm.position.x+=(lt[3]-leftArm.position.x)*kk;
  leftArm.position.y+=(lt[4]+Math.sin(bob*2)*.01-leftArm.position.y)*kk;
  leftArm.position.z+=(lt[5]-leftArm.position.z)*kk;
}
function updateWeapon(dt){
  var w=W();
  // 準心只在拿槍而且真的在玩的時候出現（結算倒帶時不該有東西擋在畫面中央）
  CROSS.visible=(w.kind==='gun'&&S.phase==='run'&&!S.inspect);
  var idle=fill(poseB,P_IDLE[0]+Math.sin(bob*2)*.03,P_IDLE[1],P_IDLE[2]+Math.sin(bob)*.02,
                      P_IDLE[3],P_IDLE[4]+Math.sin(bob*2)*.012,P_IDLE[5]).slice();
  if(S.reload>0){                       // 裝填優先於一切，期間不能開槍
    S.reload=Math.max(0,S.reload-dt);
    setPose(reloadPose(1-S.reload/Math.max(0.001,S.reloadTot||1)));
    if(S.reload<=0) finishReload();
  } else if(swT>=0){
    swT+=dt;
    var dur=(w.key==='axe')?TUNE.axeSw:(w.key==='bot'?TUNE.botSw:
             (w.key==='gun'?TUNE.gunSw:(w.key==='sg'?TUNE.sgSw:TUNE.crowSw)));
    var frac=(w.key==='axe')?TUNE.axeFrac:(w.key==='bot'?TUNE.botFrac:
             (w.key==='gun'?TUNE.gunFrac:(w.key==='sg'?TUNE.sgFrac:TUNE.crowFrac)));
    var p=Math.min(1,swT/dur);
    if(!swDid && p>=frac){ swDid=true; resolveSwing(); }
    setPose(w.key==='axe'?axePose(p):(w.key==='bot'?botPose(p):
            (w.key==='gun'?gunPose(p):(w.key==='sg'?sgPose(p):crowPose(p)))));
    if(swT>=dur){ poseEnd=poseA.slice(); swT=-1; }
  } else if(charge>=0){
    charge=Math.min(TUNE.botCharge,charge+dt);
    setPose(chargePose(charge));
  } else if(recover>0){
    recover=Math.max(0,recover-dt);
    // 先慢後快地拖回來，像把甩出去的重量收回身上
    var k=1-recover/Math.max(0.001,recTotal);
    setPose(mixPose(poseEnd||idle, idle, k*k, poseA));
  } else {
    setPose(idle);
  }
  // 揮空的重心會把你帶過去一點，命中則是戛然而止——這個差別用身體感覺得到
  if(push!==0){ var d2=push*Math.min(1,dt*7); yaw+=d2; push-=d2;
    if(Math.abs(push)<0.0005) push=0; }
  // 後座：跟揮空的 push 一樣是「每幀衰減的位移」，不是瞬間跳一格。
  // 先很快往上頂（kick），再慢慢壓回來（kickBack），所以連續開槍準心會越飄越高
  if(kick!==0){ var k1=kick*Math.min(1,dt*20); pitch+=k1; kick-=k1; kickBack+=k1;
    if(Math.abs(kick)<0.0003) kick=0; }
  if(kickBack!==0){ var k2=kickBack*Math.min(1,dt*3.4); pitch-=k2; kickBack-=k2;
    if(Math.abs(kickBack)<0.0003) kickBack=0; }
  if(yawKick!==0){ var k3=yawKick*Math.min(1,dt*9); yaw+=k3; yawKick-=k3;
    if(Math.abs(yawKick)<0.0003) yawKick=0; }
  pitch=Math.max(-.9,Math.min(.75,pitch));
  if(muzzL.intensity>0) muzzL.intensity=Math.max(0,muzzL.intensity-dt*480);
  // 泵動：開完一槍前護木往後拉再推回去。看得到、也聽得到，
  // 玩家才知道「這把槍要花這麼久才能打下一發」，而不是以為按鈕沒反應
  if(S.pumpT>0){
    var was=S.pumpT; S.pumpT=Math.max(0,S.pumpT-dt);
    var q=1-S.pumpT/Math.max(0.001,TUNE.sgRec*0.55);
    var pm=WMESH.sg&&WMESH.sg.userData.pump;
    if(pm) pm.position.z=-0.40+Math.sin(q*Math.PI)*0.13;
    if(was>0&&S.pumpT<=0) pump();
  } else { var pm2=WMESH.sg&&WMESH.sg.userData.pump;
           if(pm2&&pm2.position.z!==-0.40) pm2.position.z=-0.40; }
  // 蓄力條。裝填時借來當進度條——玩家要看得到「還有多久才能開槍」
  var cg=document.getElementById('chg');
  if(charge>=0){ cg.classList.add('on');
    cg.firstElementChild.style.width=Math.round(charge/TUNE.botCharge*100)+'%'; }
  else if(S.reload>0){ cg.classList.add('on');
    cg.firstElementChild.style.width=
      Math.round((1-S.reload/Math.max(0.001,S.reloadTot||1))*100)+'%'; }
  else cg.classList.remove('on');
  document.getElementById('atk').classList.toggle('rec',recover>0||swT>=0||S.reload>0);
  updateThrown(dt);
}

// ---- 命中判定 ----
function tip(key,msg){                          // 同一種提示只講前兩次，之後靠聲音自己判斷
  S.tips=S.tips||{}; S.tips[key]=(S.tips[key]||0)+1;
  if(S.tips[key]<=2) toast(msg);
}
function hurtZombie(z,dmg,stag){
  z.hp-=dmg; if(stag>0) z.stagger=stag;
  z.flash=1; z.flashOn=true;      // 實際的上色在 updateZombie 裡，見那裡的說明
  if(z.hp<=0){ z.dead=1;
    var pk=panOf(z.g.position.x,z.g.position.z,20);
    voice('death',z.voice,.62,0,z.rate*0.98);
    // 落地聲要對齊倒地動畫，不是對齊「被打中」。提早響會聽成「牠飛出去了」
    snd(S.day===5?'step_water':'body_fall',
        {vol:0.85*Math.max(0.25,pk.vol),pan:pk.pan,near:pk.vol,
         rate:0.90+Math.random()*0.10,delay:0.55});
  }
  else voice('pain',z.voice,.55,0,z.rate*(0.94+Math.random()*0.16));
}
function resolveSwing(){
  var w=W();
  S.st=Math.max(0,S.st-w.st);
  if(w.key==='bot'){ throwBottle(); recStart(TUNE.botRec); return; }
  if(w.key==='gun'){ fireGun(); return; }
  if(w.key==='sg'){ fireSG(); return; }

  var isAxe=(w.key==='axe');
  var arc =isAxe?TUNE.axeArc:TUNE.crowArc;
  var maxR=isAxe?TUNE.axeMax:TUNE.reach;
  var minR=isAxe?TUNE.axeMin:0;
  var gz  =isAxe?TUNE.axeGraze:0;
  var dmg =isAxe?TUNE.axeHit:TUNE.hit;
  var flat=tmp.set(fwd.x,0,fwd.z).normalize().clone();

  var best=null,bestD=1e9;
  for(var i=0;i<zs.length;i++){ var z=zs[i]; if(z.dead)continue;
    tmp2.subVectors(z.g.position,camera.position); tmp2.y=0;
    var d=tmp2.length(); if(d>maxR+gz) continue;
    tmp2.normalize(); if(tmp2.dot(flat)<arc) continue;
    // **中間隔著柱子或車就打不到。** 兩把槍本來就有做這件事，冷兵器沒有——
    // 結果是隔著一根柱子照樣把喪屍打死，距離對、角度對，就是中間有一根水泥柱。
    // `losBlocked` 是玩家到喪屍的線段對 AABB 的檢查，只會擋住真的擋在中間的東西
    if(losBlocked(camera.position.x,camera.position.z,z.g.position.x,z.g.position.z)) continue;
    if(d<bestD){ bestD=d; best=z; }
  }
  // 砍到柱子或牆：只有當障礙物比目標還近才算，否則喪屍背後有車就永遠打不到。
  // **鐵撬也要做**，不然隔著柱子揮會是「完全揮空」的低沉風聲，
  // 玩家會以為是自己距離抓錯，而不是中間有東西擋著
  var lim=Math.min(maxR, best?bestD:maxR);
  for(var r=0.9;r<=lim;r+=0.4){
    if(blockedAt(camera.position.x+flat.x*r, camera.position.z+flat.z*r)){
      clang(isAxe?.55:.38); shake=Math.max(shake,isAxe?.40:.24); push=-0.045;
      recStart(isAxe?TUNE.axeRecWall:TUNE.crowRecWall);
      tip('wall',isAxe?'斧頭砍在柱子上':'鐵撬敲在柱子上');
      return;
    }
  }
  if(best && bestD<=maxR && bestD>=minR){          // 命中
    hurtZombie(best,dmg,isAxe?0.95:0.55);
    // 打中身體是三層疊出來的：**脆**（骨頭）＋**濕**（肉）＋**悶**（整個人的重量）。
    // 兩把武器的差別在配方，不在音量——後期眼睛壞掉時，
    // 玩家是靠耳朵確認自己拿的是哪一把。
    //   斧頭＝切進去，所以「脆」是主角
    //   鐵撬＝鈍器，不切開東西，所以完全沒有「脆」，只有濕跟悶
    // hit_flesh_1~3 是肉拍聲（濕），hit_flesh_4 是悶爆的低頻（重量），
    // 所以下面用 pool 和 idx 把它們分開用
    if(isAxe){
      snd('axe_chop', {vol:0.95,pool:4,rate:0.90+Math.random()*0.08});   // 脆
      snd('hit_flesh',{vol:0.45,pool:3,rate:0.86,lp:2400});              // 濕
      snd('hit_flesh',{vol:0.30,idx:3,rate:0.70,lp:700,delay:0.02});     // 悶
    } else {
      snd('hit_flesh',{vol:0.90,pool:3,rate:0.98+Math.random()*0.12});   // 濕
      snd('hit_flesh',{vol:0.55,idx:3,rate:0.74,lp:800,delay:0.02});     // 悶
    }
    recStart(isAxe?TUNE.axeRecHit:TUNE.crowRec);
  } else if(best && bestD<minR){                   // 太近，打到的是斧柄
    hurtZombie(best,dmg*TUNE.axeHaft,0);
    // 只剩「悶」這一層，脆和濕都拿掉——沒有切進去，也沒有真的打到肉。
    // 這是在教「你站太近了」
    snd('hit_flesh',{vol:0.60,idx:3,rate:0.66,lp:600});
    recStart(TUNE.axeRecMiss); push=0.030;
    tip('haft','太近了，打到的是斧柄');
  } else if(best){                                 // 差一點——這是教距離最重要的一種回饋
    best.dodge=0.28; best.dodgeSide=(Math.random()<0.5?1:-1);
    noise(.07,5600,.24,0);                         // 尖銳的擦身破空聲
    recStart(isAxe?TUNE.axeRecMiss:TUNE.crowRec); push=0.055;
    tip('graze','差一點——再往前半步');
  } else {                                         // 完全揮空
    noise(.20,470,.22,0);                          // 低沉的風聲
    recStart(isAxe?TUNE.axeRecMiss:TUNE.crowRec);
    push=isAxe?0.070:0.020;
  }
}

// ---- 手槍 ----
// 這把武器測的是「中央視力」。判定方式是子彈沿著準心方向走一條直線，
// 看目標離這條線多近。距離越遠，同樣的命中半徑對應到的角度就越小，
// 所以「看不清楚 → 打不中」是幾何自然長出來的，不是額外加的懲罰。
function gunHitTest(){
  var org=camera.position, best=null, bestT=1e9, bestHead=false;
  for(var i=0;i<zs.length;i++){
    var z=zs[i]; if(z.dead) continue;
    // 軀幹與頭各測一次
    var pts=[[1.05,TUNE.gunRad,false],[1.72,TUNE.gunHeadRad,true]];
    for(var k=0;k<pts.length;k++){
      tmp2.set(z.g.position.x-org.x, z.g.position.y+pts[k][0]-org.y, z.g.position.z-org.z);
      var along=tmp2.dot(fwd);
      if(along<=0.6||along>TUNE.gunRange) continue;
      tmp.copy(fwd).multiplyScalar(along);
      var perp=Math.hypot(tmp2.x-tmp.x, tmp2.y-tmp.y, tmp2.z-tmp.z);
      if(perp>pts[k][1]) continue;
      if(along<bestT){ bestT=along; best=z; bestHead=pts[k][2]; }
    }
  }
  return best?{z:best,d:bestT,head:bestHead}:null;
}
function fireGun(){
  if((S.mag|0)<=0){                       // 空槍：一聲喀，不是靜悄悄的沒反應
    clickDry(); flashAtk(); recStart(0.18);
    tip('empty','彈匣空了 · 點揮擊鍵裝填');
    return;
  }
  S.mag--; showWeapon();
  bang(1);
  muzzL.intensity=24;                     // 真的照亮一下場景，只亮三四格畫面

  // **開槍不再扣病程。** 閃光致盲是視色素漂白，是暫時的（白天幾秒到兩分鐘），
  // 造成永久損傷的光性視網膜病變要日蝕直視／雷射那個等級，槍口閃光遠不到。
  // 代價改成「恢復時間變長」，做在 uMuzz 的後像上，見 DISEASES 的 muzzRec。
  S.shotsP=(S.shotsP||0)+1;

  // 槍口致盲。用 uMuzz，跟病程的 uFlash 完全分開
  S.muzzAt=clock.getElapsedTime();
  S.muzzK=1; S.muzzD=1; S.muzzZ=1;        // 手槍是基準值，霰彈槍會把這三個放大

  // 後座
  kick+=TUNE.gunKick; yawKick+=(Math.random()-0.5)*TUNE.gunKick*0.45;
  shake=Math.max(shake,0.30);

  var h=gunHitTest();
  // 子彈會被柱子和車擋住。只檢查「比目標更近」的範圍，
  // 否則喪屍背後停一台車就永遠打不到牠（跟斧頭砍到柱子同一個坑）
  var flat=tmp.set(fwd.x,0,fwd.z).normalize().clone();
  var lim=Math.min(TUNE.gunRange, h?h.d:TUNE.gunRange);
  for(var r=0.8;r<=lim;r+=0.35){
    if(blockedAt(camera.position.x+flat.x*r, camera.position.z+flat.z*r)){
      clang(.34); tip('gwall','子彈打在柱子上');
      alarmAt(camera.position.x,camera.position.z,TUNE.gunNoise);
      recStart(TUNE.gunRec); return;
    }
  }
  if(h){
    var dmg=TUNE.gunHit*(h.head?TUNE.gunHead:1);
    hurtZombie(h.z,dmg,h.head?0.85:0.45);
    snd('hit_flesh',{vol:0.70,rate:1.18+Math.random()*0.10,hp:260});
    if(h.head) tip('ghead','正中頭部');
  } else {
    tip('gmiss','沒打中——準心要壓在牠身上');
  }
  alarmAt(camera.position.x,camera.position.z,TUNE.gunNoise);
  recStart(TUNE.gunRec);
}
// ---- 霰彈槍 ----
// 這把武器測的是「粗略方向」。判定沿用手槍那條「離準心射線多近」的射線，
// 但不是一個點，是一個**角度錐**：散佈圓的半徑 = 散佈半角 × 距離。
// 傷害＝散佈圓跟目標圓重疊了多少，所以貼臉幾乎全中、遠距離自然衰減成搔癢。
// 距離的懲罰是幾何自己長出來的，不是額外加的。
//
// 刻意**不做爆頭加成**：獎勵精準等於把它變成第二把手槍，
// 那「眼睛壞掉之後還打得中」這件事就不成立了。
function sgHitTest(){
  var org=camera.position, hits=[];
  for(var i=0;i<zs.length;i++){
    var z=zs[i]; if(z.dead) continue;
    tmp2.set(z.g.position.x-org.x, z.g.position.y+1.15-org.y, z.g.position.z-org.z);
    var along=tmp2.dot(fwd);
    if(along<=0.5||along>TUNE.sgRange) continue;
    tmp.copy(fwd).multiplyScalar(along);
    var perp=Math.hypot(tmp2.x-tmp.x, tmp2.y-tmp.y, tmp2.z-tmp.z);
    var sR=Math.max(0.05,TUNE.sgSpread*along);      // 這個距離上散佈圓多大
    var tR=TUNE.sgRad;                              // 目標的等效半徑
    if(perp>sR+tR) continue;
    // 覆蓋率：目標圓能吃到散佈圓的多少（貼臉時 sR 比 tR 小 → 全吃）
    var cover=Math.min(1,(tR*tR)/(sR*sR));
    // 偏離準心的衰減：正中央 1，剛好擦到邊 0
    var off=Math.max(0,Math.min(1,1-(perp-tR)/sR));
    var frac=cover*off;
    if(frac<=0.01) continue;
    hits.push({z:z,d:along,frac:frac});
  }
  hits.sort(function(a,b){return a.d-b.d;});
  return hits;
}
function fireSG(){
  if((S.smag|0)<=0){
    clickDry(); flashAtk(); recStart(0.20);

    return;
  }
  S.smag--; showWeapon();
  boom(1);
  muzzL.intensity=44;                     // 比手槍亮得多，真的會照亮一片
  S.pumpT=TUNE.sgRec*0.55;                // 開完槍才泵動，聲音跟著手一起

  S.shotsS=(S.shotsS||0)+1;      // 同樣不扣病程，代價在後像的長度上（見 fireGun 的註解）

  // 槍口致盲：同一套 uMuzz，但強度、持續、斑的大小都比手槍大一截
  S.muzzAt=clock.getElapsedTime();

  // 否則喪屍背後停一台車就永遠打不到牠（跟斧頭砍到柱子同一個坑）
  var flat=tmp.set(fwd.x,0,fwd.z).normalize().clone();
  var lim=Math.min(TUNE.sgRange, hits.length?hits[0].d:6);
  for(var r=0.8;r<=lim;r+=0.35){
    if(blockedAt(camera.position.x+flat.x*r, camera.position.z+flat.z*r)){
      clang(.50); shake=Math.max(shake,0.40);
      tip('swall','彈丸全打在柱子上');
      alarmAt(camera.position.x,camera.position.z,TUNE.sgNoise);
      recStart(TUNE.sgRec); return;
    }
  }
  if(hits.length){
    // 一發可以掃到好幾隻——這是霰彈槍存在的另一半理由
    for(var k=0;k<hits.length;k++){
      var h=hits[k];
      hurtZombie(h.z, TUNE.sgHit*h.frac, h.frac>0.5?1.10:0.55);
    }
    snd('hit_flesh',{vol:0.85,rate:1.02});
    snd('hit_flesh',{vol:0.45,rate:0.86,delay:0.035});   // 一片彈丸不是一顆，要有厚度
    if(hits.length>1) tip('smulti','一發掃倒兩隻以上');
    else if(hits[0].frac<0.30) tip('sfar','太遠了——霰彈散開就沒力了');
  } else {
    tip('smiss','完全沒掃到——方向差太多了');
  }
  alarmAt(camera.position.x,camera.position.z,TUNE.sgNoise);
  recStart(TUNE.sgRec);
}
// 槍聲會把整層樓叫醒。這是槍最大的代價，也是它跟玻璃瓶剛好相反的地方：
// 瓶子是把注意力送走，槍是把注意力全部拉到自己身上
function alarmAt(x,z0,R,quiet){
  var n=0;
  for(var i=0;i<zs.length;i++){
    var z=zs[i]; if(z.dead) continue;
    var d=Math.hypot(z.g.position.x-x, z.g.position.z-z0);
    if(d>R) continue;
    z.lureT=0;                            // 正在被瓶子騙走的也會被叫回來
    if(!z.alert){
      z.alert=true; n++;
      if(d<22) voice('attack',(z.voice+1)%4,.40,0,z.rate*0.92);
    }
  }
  if(n && !quiet) tip('gloud','槍聲把牠們全叫過來了');
  return n;
}
// ---- 裝填 ----
// 彈匣在手上、備彈在背包。裝填 = 把背包裡那一盒的子彈倒進彈匣，
// 所以它仍然遵守「效果在使用的時候才發生」這條規則
// 兩把槍的裝填節奏刻意完全不同：
//   手槍   換彈匣＝一次 1.6 秒補滿，中途換武器就整個放棄（子彈不會被扣）
//   霰彈槍 一發一發推進管狀彈倉，**每推進一發就立刻算數**，
//          所以隨時可以停下來先開一槍。「裝到一半就得先打」是這把槍的張力來源
function startReload(box,cont){
  var sg=(box.ammo==='s');
  S.reloadKind=sg?'shell':'mag';
  S.reloadBox=box;
  S.reloadTake=sg?1:Math.min(TUNE.gunMag-(S.mag|0), box.rounds|0);
  S.reload=sg?TUNE.sgShell:TUNE.gunReload;
  S.reloadTot=S.reload;
  recover=0; charge=-1; swT=-1; swDid=false;
  // 手槍：起手是「退彈匣＋推新的進去」的完整一段（reload_mag_b），
  // 收尾另外補一聲卡到底（reload_mag）。裝填要 1.6 秒，一段素材撐不滿，
  // 中間那段安靜正是「我現在動不了」的張力
  if(sg) shellIn(); else snd('reload_mag_b',{vol:0.80,rate:0.98+Math.random()*0.06});
  // 接續推下一發時不要再跳一次字，五發就會洗版五次
  if(!cont) toast(sg?'一發一發推進去…（可隨時開槍打斷）':'裝填中…');
}
function finishReload(){
  var b=S.reloadBox, sg=(S.reloadKind==='shell');
  if(b){
    var take=Math.min(S.reloadTake, b.rounds|0);
    b.rounds=(b.rounds|0)-take;
    if(sg) S.smag=(S.smag|0)+take; else S.mag=(S.mag|0)+take;
    if(b.rounds<=0){ var k=S.bag?S.bag.indexOf(b):-1; if(k>=0) S.bag.splice(k,1); }
    bagCount(); if(S.bagOpen) bagRender();
  }
  S.reload=0; S.reloadTake=0;
  showWeapon();
  // 霰彈槍：還沒滿、手上還是這把 → 自動接著推下一發。
  // 這一盒剛好推完的話，換背包裡的下一盒繼續（不然會莫名其妙停在半滿）
  if(sg && (S.smag|0)<TUNE.sgMag && W().key==='sg' && S.phase==='run'){
    var nx=(b && (b.rounds|0)>0) ? b : null;
    if(!nx && S.bag) for(var j=0;j<S.bag.length;j++)
      if(S.bag[j].ammo==='s'&&(S.bag[j].rounds|0)>0){ nx=S.bag[j]; break; }
    if(nx){ startReload(nx,true); return; }
  }
  S.reloadBox=null; S.reloadKind=null;
  if(sg){ pump(); }                                  // 填滿了，把槍機推回去
  else snd('reload_mag',{vol:0.85,rate:1.04+Math.random()*0.08});   // 彈匣卡到底
}
// 中途停手。霰彈槍已經推進去的那幾發留著（上面每一發推進就算數了），
// 手槍則是整個放棄——這正好對應真實的兩種裝填方式
function cancelReload(){
  S.reload=0; S.reloadBox=null; S.reloadKind=null; S.reloadTake=0;
}
// 手機長按揮擊鍵、電腦按 R。找背包裡第一盒還有彈的。
// 霰彈槍在裝填中再按一次＝停手
function reloadGun(){
  if(S.phase!=='run'||S.inspect||S.bagOpen) return;
  var w=W(); if(w.kind!=='gun') return;
  if(!S.weap||!S.weap[w.key]) return;
  if(S.reload>0){
    if(S.reloadKind==='shell'){ cancelReload(); pump(); toast('停手'); }
    return;
  }
  if(swT>=0) return;
  if(magOf()>=magMax()){ flashAtk();
    tip('magfull',w.key==='sg'?'彈倉是滿的':'彈匣是滿的'); return; }
  var kind=AMMOK(), box=null;
  if(S.bag) for(var i=0;i<S.bag.length;i++)
    if(S.bag[i].ammo===kind&&(S.bag[i].rounds|0)>0){ box=S.bag[i]; break; }
  if(!box){ clickDry(); flashAtk();
    tip('noammo',kind==='s'?'背包裡沒有霰彈了':'背包裡沒有子彈了'); return; }
  startReload(box);
}

// ---- 玻璃瓶 ----
function throwBottle(){
  if((S.bot|0)<=0) return;
  S.bot--; showWeapon();
  var pow=Math.min(1,(S.throwPow||0)/Math.max(0.05,TUNE.botCharge));
  var want2=TUNE.botMin+(TUNE.botMax-TUNE.botMin)*pow;
  var ang=0.40, G=9.8, h0=camera.position.y, v=7;
  for(var i=0;i<10;i++){                          // 反推初速，讓落點大約落在 want2 公尺外
    var vs=v*Math.sin(ang), vc=v*Math.cos(ang);
    var R=vc*(vs+Math.sqrt(vs*vs+2*G*h0))/G;
    if(R>0.01) v*=Math.sqrt(want2/R);
  }
  var dir=tmp.set(fwd.x,0,fwd.z).normalize().clone();
  var m=WMESH.bot.clone(true);
  m.position.set(camera.position.x+dir.x*0.5, camera.position.y-0.10, camera.position.z+dir.z*0.5);
  m.rotation.set(0,0,0); m.visible=true; level.add(m);
  throwns.push({m:m, v:new THREE.Vector3(dir.x*v*Math.cos(ang), v*Math.sin(ang), dir.z*v*Math.cos(ang)),
                life:0, spin:(Math.random()*8+6)*(Math.random()<.5?1:-1)});
  noise(.12,900,.18,0);
}
function updateThrown(dt){
  for(var i=throwns.length-1;i>=0;i--){
    var b=throwns[i]; b.life+=dt;
    b.v.y-=9.8*dt;
    var nx=b.m.position.x+b.v.x*dt, ny=b.m.position.y+b.v.y*dt, nz=b.m.position.z+b.v.z*dt;
    var hitGround=(ny<=0.07), hitWall=blockedAt(nx,nz);
    if(hitGround||hitWall||b.life>6){
      level.remove(b.m); throwns.splice(i,1);
      var px=hitWall?b.m.position.x:nx, pz=hitWall?b.m.position.z:nz;
      var q=panOf(px,pz,26);
      smash(Math.max(0.22,q.vol),q.pan);
      lureAt(px,pz);
      continue;
    }
    b.m.position.set(nx,ny,nz);
    b.m.rotation.x+=b.spin*dt; b.m.rotation.z+=b.spin*0.6*dt;
  }
}
// 兩點之間有沒有東西擋著。誘餌對已警戒喪屍的效果完全取決於這個函式
function losBlocked(ax,az,bx,bz){
  var dx=bx-ax, dz=bz-az;
  for(var s=0;s<solids.length;s++){
    var o=solids[s], t0=0, t1=1, ok=true;
    var d1=[dx,dz], lo=[o.x-o.hw-ax,o.z-o.hd-az], hi=[o.x+o.hw-ax,o.z+o.hd-az];
    for(var k=0;k<2;k++){
      if(Math.abs(d1[k])<1e-6){ if(lo[k]>0||hi[k]<0){ ok=false; break; } continue; }
      var a1=lo[k]/d1[k], b1=hi[k]/d1[k];
      if(a1>b1){ var tt=a1; a1=b1; b1=tt; }
      t0=Math.max(t0,a1); t1=Math.min(t1,b1);
      if(t0>t1){ ok=false; break; }
    }
    if(ok) return true;
  }
  return false;
}
// 誘餌的核心規則：
//   沒發現你的      → 整隻被騙走，而且會完全跟丟
//   發現你、還看得到你 → 只被拖住兩三秒，警戒不會消失
//   發現你、但你已經斷開視線 → 整隻跟丟（所以正確玩法是先躲到柱子後面再丟）
function lureAt(x,z0){
  var pulled=0, fooled=0;
  for(var i=0;i<zs.length;i++){
    var z=zs[i]; if(z.dead) continue;
    var d=Math.hypot(z.g.position.x-x, z.g.position.z-z0);
    if(d>TUNE.lureR) continue;
    z.lureX=x; z.lureZ=z0;
    if(!z.alert){ z.lureT=TUNE.lureHold; z.freeze=3.0; fooled++; }
    else {
      var sees=!losBlocked(z.g.position.x,z.g.position.z,camera.position.x,camera.position.z);
      if(sees){ z.lureT=TUNE.lureAlert; pulled++; }
      else { z.alert=false; z.freeze=3.0; z.lureT=TUNE.lureHold; fooled++; }
    }
  }
  if(fooled) tip('lure','牠們跟丟你了');
  else if(pulled) tip('lure2','牠還盯著你——先斷開視線再丟');
}

var clock=new THREE.Clock();
function tick(){
  var dt=Math.min(clock.getDelta(),.05), t=clock.getElapsedTime();
  U.uTime.value=t;
  heartUpdate(dt);

  if(S.phase==='run'){
    S.t+=dt;
    // Day 2 的速率是**暫用的過渡值**（Day 1 與 Day 4 的中間偏前段）。
    // 病程曲線要等 Day 2 做完、量過真實遊玩時間，才一口氣校準全部六關——
    // 現在改速率就是在猜。這一行到時候會被換掉。
    var rate=(S.day===1)?DZ.day1
            :(S.day===2?DZ.day1+(DZ.day4-DZ.day1)*0.35
            :(S.day===3?DZ.day4*0.8:(S.day===5?DZ.day4*1.15:DZ.day4)));
    var nat=TUNE.pause?0:rate*dt; S.prog=Math.min(1,S.prog+nat); S.fromTime+=nat;

    var kx=(keys.KeyD?1:0)-(keys.KeyA?1:0), kz=(keys.KeyS?1:0)-(keys.KeyW?1:0);
    var mx=vx||kx, mz=vz||kz;
    if(S.inspect||S.bagOpen){ mx=0; mz=0; }      // 檢視或翻背包時站著不動
    var mag=Math.min(1,Math.hypot(mx,mz));
    var canSprint=sprinting&&S.st>2&&mag>.4&&!blocking;
    document.getElementById('spr').classList.toggle('burning',canSprint);
    var speed=blocking?1.35:(canSprint?TUNE.run:TUNE.walk);
    // 硬直期間走得慢，但不鎖死——一旦連走路轉頭都不能，玩家就會覺得是當機
    if(recover>0||swT>=0||S.reload>0) speed*=TUNE.recSlow;
    if(mag>.01){var sy=Math.sin(yaw),cy=Math.cos(yaw);
      // 前方 = (-sin, -cos)，右方 = (cos, -sin)。mz 為負代表往前推搖桿。
      var nx=camera.position.x+( mx*cy + mz*sy)*speed*dt;
      var nz=camera.position.z+(-mx*sy + mz*cy)*speed*dt;
      var stuck=blockedAt(camera.position.x,camera.position.z);
      if(stuck||!blockedAt(nx,camera.position.z)) camera.position.x=nx;
      if(stuck||!blockedAt(camera.position.x,nz)) camera.position.z=nz;
      bob+=dt*speed*1.5;}
    if(bounds){
      camera.position.x=Math.max(bounds[0]+.6,Math.min(bounds[1]-.6,camera.position.x));
      camera.position.z=Math.max(bounds[2]+.6,Math.min(bounds[3]-.6,camera.position.z));
    }
    camera.position.y=1.62+Math.sin(bob*2)*0.022*mag;
    updateTorchBeam(dt,mag,canSprint);
    updateGlare(dt);
    // 自己的腳步。表面依關卡換素材（室內／硬地／水），Day 5 另外有叫醒喪屍的效果：
    // **走路不會引來任何東西，衝刺才會**——跟「跑得快能活命，但要付代價」
    // 是同一條主軸，也跟病程的邏輯一致。
    // 音量刻意壓低（TUNE.stepVol）：自己的腳步太大聲會蓋掉外面的，
    // 而外面那些才是玩家眼睛壞掉之後唯一剩下的情報
    if(mag>0.05){
      S.stepT=(S.stepT||0)-dt*(canSprint?2.6:1.5);
      if(S.stepT<=0){
        S.stepT=0.86+Math.random()*0.28;
        // 自己的腳步在腳下，左右只給一點點隨機——不是定位資訊，是身體感
        stepPlayer(canSprint?0.95:0.55,(Math.random()-0.5)*0.25,canSprint);
        if(S.day===5 && canSprint){
          var woke=alarmAt(camera.position.x,camera.position.z,TUNE.splashWake,true);
          if(woke>0) tip('splash','水聲傳得很遠 · 用走的就不會');
        }
      }
    }
    // 滴水聲。隨機從天花板某處落下——**這是在教玩家「聲音有方向」**，
    // 等到喪屍出聲的時候，他才有一個對照的基準
    if(S.day===5){
      S.dripT=(S.dripT||1.5)-dt;
      if(S.dripT<=0){
        S.dripT=0.9+Math.random()*2.6;
        var dx3=camera.position.x+(Math.random()-0.5)*7;
        var dz3=camera.position.z-2-Math.random()*16;
        var pd2=panOf(dx3,dz3,20);
        if(pd2.vol>0.05) splash(pd2.vol*pd2.vol*0.75,pd2.pan,false,pd2.vol);
      }
    }
    // 手電筒快沒電的一次性劇本事件（**不做電池**：計時器只有一個，就是眼睛）
    if(S.day===5 && !S.flickDone && S.torchOn && camera.position.z<-60){
      S.flickDone=true; torchFlicker();
    }

    // Day 6：走到封死的急診門前面提示一次。**只是提示，不是解法**——
    // 地上還有一條藍線，讀不到牆上那張紙也走得出去。
    // 「它不能變成門檻」是藥局處方箋那一條的教訓
    if(S.day===6 && !S.d6Seal &&
       Math.abs(camera.position.x-D6.doorE)<4.5 && camera.position.z<D6.hz+4.2){
      S.d6Seal=true;
      tip('d6seal','急診封死了 · 綠線到這裡就沒有了 · 低頭看看地上還有什麼');
    }

    if(canSprint){S.st-=17*dt;S.sprintT+=dt;
      var ex=(S.day===1?DZ.sprint*0.25:DZ.sprint)*dt; S.prog=Math.min(1,S.prog+ex); S.fromSprint+=ex;}
    else if(blocking) S.st-=6*dt;
    else S.st=Math.min(100,S.st+14*dt);
    S.st=Math.max(0,S.st);

    // Day 6 沒有蒐集目標，走到醫院大門就是目標（total=0 → 出口一開始就是開的）。
    // 最後一關要收束，不是再蒐集一次東西
    var total=(S.day===1)?2:(S.day===3?1:(S.day===6?0:3));
    sups.forEach(function(sp){
      if(sp.taken)return;
      sp.g.rotation.y+=dt*.8;
      var dx=camera.position.x-sp.g.position.x, dz=camera.position.z-sp.g.position.z;
      if(Math.hypot(dx,dz)<1.9){
        // **不要 level.remove()。** 這個群組裡有一盞 PointLight，
        // 把燈從場景移除會改變 Three.js 的 NUM_POINT_LIGHTS，
        // 而那是 shader 程式的快取鍵的一部分——場上**每一個材質**都會當場重新編譯。
        // 美術拉皮之前場上只有幾個簡單的 Lambert，感覺不太出來；
        // 現在每一關有 5~8 個帶法線圖的 Phong，那一下就變成看得見的頓挫。
        // 作者的回報是「拿補給箱的時候都會頓一下」——就是這個。
        // 正解是燈留在場上、強度歸零（連 lightReg 的 base 也要歸零，
        // 否則切換亮度時 applyBright() 會把它點回來），只把箱子藏起來。
        sp.taken=true; hideSup(sp);
        S.got++; chime();
        // 撿到的是什麼東西就發什麼聲音。鑰匙是 Day 1 的目標物，
        // 它的聲音要跟一般補給箱分得開——玩家聽到就知道「找到了」
        snd(sp.label==='鑰匙'?'key':'paper',{vol:0.75,rate:0.96+Math.random()*0.10});
        document.getElementById('got').textContent=(S.day===6?'—':S.got);
        if(S.day===1&&S.got===1) makeZombie(-1.5,-1.5,0.85,70);   // 鄰居
        // 撿到手電筒 = 真的拿到一支道具，不是把場景的燈打開。
        // 刻意不自動點亮：公寓是早上、光線充足，玩家會覺得「這現在沒用」然後收起來，
        // 走進停車場才想起自己有這東西。在不需要的時候拿到、需要時才想起來，
        // 比「剛好在需要的前一關發給你」真實得多。
        if(sp.label==='補給'&&S.day===5){
          S.bot=(S.bot|0)+1;
          if(S.weap.sg) giveAmmo('s'); else giveAmmo('p');
        }
        if(sp.label==='玻璃瓶'){
          S.bot=(S.bot|0)+TUNE.botPer; showWeapon();
          tip('bottle','玻璃瓶不佔背包 · 丟出去製造聲響可以把喪屍引開');
        }
        if(sp.label==='手電筒'){
          S.torch=true; torchBtn();
          tip('torch','手電筒收在左手 · 右下「手電」開關（電腦按 T）');
        }
        if(total>0&&S.got>=total){
          if(S.doorMat) S.doorMat.color.setHex(0x4d7a62);
          if(S.exitLight) S.exitLight.intensity=2.2*LM();
          document.getElementById('objmsg').style.opacity=1;
          toast(S.day===1?'齊了 · 出門':(S.day===5?'補給齊了 · 盡頭有一道爬梯':'補給齊了 · 前往盡頭'));
        } else toast('取得'+sp.label);
      }
    });
    // ---- 互動：檢視物品 / 撬開調劑室的門 ----
    S.near=null;
    if(!S.inspect){
      // **要連高度一起算。** 以前只用水平方向比對準程度，所以上下兩層放在同一個
      // 位置的兩盒藥，不管你怎麼抬頭低頭，永遠只選得到其中一盒——
      // 抬頭低頭在程式裡根本沒有意義。層板變成上下兩層之後這件事才浮出來。
      var cp=Math.cos(pitch);
      var fx=-Math.sin(yaw)*cp, fy=Math.sin(pitch), fz=-Math.cos(yaw)*cp, bestScore=-9;
      for(var ii=0;ii<items.length;ii++){
        var it=items[ii]; if(it.taken) continue;
        if(it.kind==='door'&&it.opened) continue;                 // 通用的（Day 6 圍籬）
        if(it.kind==='door'&&!it.onHold&&S.rxDoor&&S.rxDoor.open) continue;
        if(S.wallZ!==undefined &&                       // 隔著牆搆不到
           (camera.position.z<S.wallZ)!==(it.g.position.z<S.wallZ)) continue;
        var ddx=it.g.position.x-camera.position.x, ddz=it.g.position.z-camera.position.z;
        var dd=Math.hypot(ddx,ddz);
        if(dd>2.6) continue;                            // 距離仍然只算地面距離
        // 櫃子的原點在地板上，但玩家看的是櫃面中間，所以另外給一個瞄準高度
        var ay=(it.aimY!==undefined?it.aimY:it.g.position.y);
        var ddy=ay-camera.position.y;
        var d3=Math.sqrt(ddx*ddx+ddy*ddy+ddz*ddz)||1;
        var dot=(ddx*fx+ddy*fy+ddz*fz)/d3;
        if(dot<0.55) continue;
        var sc=dot-dd*0.05;                            // 對準優先，距離只是微調
        if(sc>bestScore){ bestScore=sc; S.near=it; }
      }
    }
    var actEl=document.getElementById('act');
    actEl.classList.toggle('show',!!S.near);
    if(S.near) actEl.textContent=(S.near.kind==='door')?'撬開'
      :(S.near.kind==='cab'?'打開':(S.near.kind==='take'?'拿走':'檢視'));
    // 「按住撬開」本來只有藥局的調劑室門會用。Day 6 的圍籬要用同一個動作，
    // 所以改成通用的：物件自己帶秒數（holdSec）與完成時要做的事（onHold）。
    // 沒帶就是舊的藥局那道門，行為完全不變。
    var holdEl=document.getElementById('hold');
    if(S.holding&&S.near&&S.near.kind==='door'){
      var need=S.near.holdSec||2.6;
      S.holdT=(S.holdT||0)+dt;
      holdEl.classList.add('on');
      holdEl.firstChild.style.width=Math.min(100,S.holdT/need*100)+'%';
      if(S.holdT>=need){
        if(S.near.onHold) S.near.onHold(S.near); else openRxDoor();
        S.holding=false; S.holdT=0;
      }
    } else { S.holdT=0; holdEl.classList.remove('on'); }

    if(S.got>=total&&exitZone){
      var ex2=camera.position.x-exitZone.x, ez=camera.position.z-exitZone.z;
      if(Math.hypot(ex2,ez)<exitZone.r) finishDay(true);
    }

    if(S.day===4){
      // 停車場會從走廊深處補生喪屍，但**要有總量上限**。
      // 原本只限制「同時最多四隻」，玩家每清掉一隻就補一隻，等於無限——
      // 這一關的壓力來源應該是「暗」和「要繞路」，不是被數量磨。
      // 上限用完之後走廊就真的空了，那個安靜本身也是資訊
      S.spawnT+=dt;
      if(S.spawnT>7 && zs.length<4 && (S.spawned||0)<TUNE.d4Spawn){
        S.spawnT=0; S.spawned=(S.spawned||0)+1;
        makeZombie((Math.random()-.5)*4.6, camera.position.z-17-Math.random()*8, 1.15);}
    }
  }

  for(var ti=tweens.length-1;ti>=0;ti--){ var tw=tweens[ti];
    tw.o.rotation.y+=(tw.t-tw.o.rotation.y)*Math.min(1,dt*tw.s);
    if(Math.abs(tw.t-tw.o.rotation.y)<0.01){ tw.o.rotation.y=tw.t; tweens.splice(ti,1); } }
  if(S.inspect){
    var I=S.inspect, kk2=Math.min(1,dt*9);
    I.mesh.rotation.y+=(I.ry-I.mesh.rotation.y)*kk2;
    I.mesh.rotation.x+=(I.rx-I.mesh.rotation.x)*kk2;
    I.mesh.position.z+=(-I.dist-I.mesh.position.z)*kk2;
  }

  camera.rotation.set(pitch,yaw,0,'YXZ');
  camera.getWorldDirection(fwd);
  right.crossVectors(fwd,UPV).normalize();

  // ---- 武器動作 ----
  // 三段：揮擊（swT）→ 硬直（recover）→ 待機。
  // 硬直期間手臂仍然留在畫面上慢慢拖回來，玩家低頭就看得到「我的手還在下面」，
  // 這是「揮空了」和「當機了」之間唯一的差別。
  updateWeapon(dt);

  updateLeftArm(dt);

  if(S.phase!=='ending'&&S.phase!=='surgery'&&!TUNE.pause)
    for(var n=zs.length-1;n>=0;n--) updateZombie(zs[n],n,dt,t);

  if(S.phase==='surgery'){
    // 13 秒的收尾。慢是刻意的——這是整個遊戲最後要留在玩家身上的一格。
    S.endT+=dt; var g=S.endT;
    yaw=Math.PI+Math.sin(g*0.22)*0.16;                       // 鏡頭很輕地擺，像剛醒過來
    applyVision(S.postProg,false);
    if(g<1.8){ U.uFade.value=1;                              // 黑場：手術中
      if(!S.sgStep){ S.sgStep=1;
        capEl.textContent='手術結束了。'; capEl.style.opacity=1; } }
    else if(g<2.6){ capEl.style.opacity=0; U.uFade.value=1; }
    else if(g<3.6){ U.uFade.value=1-(g-2.6)/1.0; }           // 慢慢淡入
    else if(g<10.0){ U.uFade.value=0;
      if(S.sgStep<2){ S.sgStep=2;
        capEl.textContent=S.inTime?'這是現在，你看到的世界。':'右眼再也沒有亮起來。';
        capEl.style.opacity=1; }
      if(g>8.6) capEl.style.opacity=0; }
    else if(g<11.6){ U.uFade.value=(g-10.0)/1.6; }
    else { S.phase='card'; capEl.style.opacity=0; showCard('ending'); }
  } else if(S.phase==='ending'){
    S.endT+=dt; var e=S.endT;
    yaw=(S.viewYaw||0)+Math.sin(e*0.28)*0.30;
    if(e<1.0){ applyVision(S.prog,false); U.uFade.value=0; }         // 停在倒下／走出去的那一刻
    else if(e<1.6){ U.uFade.value=(e-1.0)/0.6; }                     // 黑場
    else if(e<5.2){                                                  // 回憶：第一天早上的公寓
      if(!S.memStep){ S.memStep=1; enterMemory();
        capEl.textContent='這是第一天早上，你在家裡看到的世界'; capEl.style.opacity=1; }
      applyVision(S.origin,false);
      U.uFade.value=Math.max(0,1-(e-1.6)/0.6);
    }
    else if(e<5.8){ U.uFade.value=(e-5.2)/0.6; }                     // 黑場
    else if(e<9.4){                                                  // 現在：停車場，剛才那一刻
      if(S.memStep<2){ S.memStep=2; leaveMemory();
        capEl.textContent='這是你現在看到的世界'; }
      applyVision(S.prog,false);
      U.uFade.value=Math.max(0,1-(e-5.8)/0.6);
    }
    else if(e<11.0){ capEl.style.opacity=0; U.uFade.value=Math.min(1,(e-9.4)/1.6); }
    else {
      // 倒帶跑完之後：Day 6 才是真的走到醫院，接手術過場。
      // 「來得及」的判斷就在這裡——差別不是輸贏，是時機。
      // **門檻是暫定值**（TUNE.inTime），六關量過真實遊玩時間之後才會定案
      if(S.day===6){ startEnding(S.prog<TUNE.inTime); }
      else { S.phase='card'; showCard('day4done'); }
    }
  } else if(S.phase==='run'){
    applyVision(S.prog,true,dt);
  }

  shake=Math.max(0,shake-dt*3); U.uShake.value=shake;

  if(Math.abs(bCur-bTarget)>0.003){          // 亮度過渡（停電、燈亮回來）
    bCur+=(bTarget-bCur)*Math.min(1,dt*1.8); applyBright();
  }

  // 閃光：間隔隨機，但兩次之間絕不少於 20 秒
  var sev=DZ.flash?Math.max(S.prog||0,0.25):0;
  if(S.nextFlash===undefined) S.nextFlash=t+TUNE.flashGap+Math.random()*25;
  // 閃光有兩種形狀，每次隨機抽：
  //   作者版 = 整片視野閃一下白光（第 2 節，親身經驗）
  //   文獻版 = 顳側周邊的一道弧光，而且常常一次連閃兩三下
  if(t>=S.nextFlash){
    if(sev>0 && Math.random()<TUNE.arcMix) fireArc(t); else S.flashAt=t;
    S.nextFlash=t+TUNE.flashGap+Math.random()*(sev>0.4?12:25);
  }
  // 轉頭誘發：文獻上眼球轉動（尤其在暗處）是 photopsia 最常見的誘因。
  // 這也讓「你越常甩頭找東西，看到的閃光越多」自然成立
  var dy=Math.abs(yaw-(S.lastYaw===undefined?yaw:S.lastYaw))/Math.max(dt,0.001);
  S.lastYaw=yaw;
  if(sev>0.02 && dy>TUNE.arcTurn && t-(S.lastArc||-99)>TUNE.arcGap){ fireArc(t); S.lastArc=t; }

  var since=t-(S.flashAt||-99);
  U.uFlash.value=(since<0.35? Math.exp(-Math.pow(since/0.055,2))*sev*TUNE.flashAmp*(S.relief>0?0.5:1) : 0);

  var arc=0, arcA=0;
  if(S.arcs) for(var ai=S.arcs.length-1;ai>=0;ai--){
    var it=S.arcs[ai], ag=t-it.t;
    if(ag<-0.001) continue;
    if(ag>0.22){ S.arcs.splice(ai,1); continue; }
    var v=Math.exp(-Math.pow(ag/0.034,2))*it.s;
    if(v>arc){ arc=v; arcA=it.a; }
  }
  U.uArc.value.set(arc*sev*TUNE.arcAmp*(S.relief>0?0.5:1), arcA);

  // 槍口致盲。三段：白閃 → 亮斑退掉 → 留下暗斑，暗斑才是真正讓你看不見的東西。
  // 眼藥水**不會**減輕它——這不是症狀，是外面的光造成的
  var ma=t-(S.muzzAt||-99), mzP=0, mzN=0;
  if(ma>=0 && ma<8){
    // **這裡是槍口閃光唯一的代價**（不再扣病程，見 DISEASES 上方的文獻註解）。
    // 有依據的不是「閃光傷眼」，而是「恢復變慢」：健康眼多半 30 秒內恢復到
    // 基線一行以內，黃斑部病變者中位 119.5 秒（早期）到 198 秒（晚期），
    // 對照組 80 秒；另一份研究 62% 延遲、最長可到正常上限的六倍。
    // 所以 muzzRec 是「病程每滿一分，後像多拖幾成」——
    // 黃斑部與糖尿病最久（1.70）、白內障次之（0.90，水晶體散射）、
    // 剝離 0.35、青光眼 0.15（接近正常）。
    var rf=1+Math.min(1,S.prog||0)*(DZ.muzzRec!==undefined?DZ.muzzRec:0);
    // 白內障除了退得慢，還會散射：同樣一發子彈閃得更「開」
    var catf=(DZ.key==='cat')?1+Math.min(1,S.prog||0)*0.9:1;
    // S.muzzK / D / Z 是「這一發是哪把槍打的」。手槍全是 1，
    // 霰彈槍三個都放大——強度、持續、還有斑的大小
    var amp=TUNE.muzzAmp*(S.muzzK||1);
    var mdur=TUNE.muzzBlind*(S.muzzD||1)*rf;
    mzP=(ma<0.09?1:Math.exp(-Math.pow((ma-0.09)/0.20,2)))*amp;
    mzN=Math.min(1,ma/0.16)*Math.pow(Math.max(0,1-ma/mdur),1.5)*amp*catf;
  }
  U.uMuzz.value.set(mzP,mzN,(S.muzzZ||1)*(DZ.key==='cat'?1+Math.min(1,S.prog||0)*0.35:1));
  if(S.relief>0) S.relief-=dt;
  // 燈的閃爍。**這是刻意的**——市電已經撐不住了，日光燈管在垂死掙扎，
  // 兩個不同頻率的 sin 相乘會產生不規則的拍頻，所以看起來是「一閃一閃」
  // 而不是規律的呼吸。
  //
  // 但原本的振幅是**絕對值 0.30**，這是個毛病：base 越暗的燈相對閃得越兇。
  // 實測換算：Day 1 客廳燈 base 0.9 → 相對擺幅 ±33%，
  // 而 Day 3 藥局燈 base 1.35 → 只有 ±22%。
  // 也就是**最不該閃的那盞（住家的燈）閃得最厲害**。
  // 改成乘上 base（比例制），每一盞的相對擺幅就一致，
  // 而且可以用 TUNE.lampFlick 一個值統一調（0 = 完全不閃）
  lamps.forEach(function(o,i){if(!o.dead)
    o.l.intensity=o.base*(1+Math.sin(t*13+i)*Math.sin(t*4.1+i)*TUNE.lampFlick)*LM();});

  hpEl.style.width=Math.max(0,S.hp)+'%';
  stEl.style.width=S.st+'%';
  document.getElementById('eyev').textContent=Math.round(S.prog*100);
  hintT+=dt; if(hintT>10) hintEl.style.opacity=0;

  // 安全模式：跳過後製，場景直接輸出。用來二分「是後製壞了還是場景壞了」
  if(TUNE.noPost){
    renderer.setRenderTarget(null); renderer.render(scene,camera);
  } else {
    renderer.setRenderTarget(rt); renderer.render(scene,camera);
    renderer.setRenderTarget(null); renderer.render(postScene,postCam);
  }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
